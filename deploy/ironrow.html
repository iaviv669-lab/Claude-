 hands over your shoulders, holding it to your upper chest. This will be your starting position.","Perform the movement by flexing the spine, crunching the weight down as far as you can.","Hold the peak contraction for a moment before returning to the starting position."]},{id:"g-standing-towel-triceps-extension",name:"Standing Towel Triceps Extension",type:"isolation_upper",pattern:"isolation",primary:["triceps"],secondary:[],equipment:["bodyweight"],laterality:"bilateral",bw:.3,metric:"weight_reps",steps:["To begin, stand up with both arms fully extended above the head holding one end of a towel with both hands. Your elbows should be in and the arms perpendicular to the floor with the palms facing each other while your feet should be shoulder width apart from each other. This is the starting position.","Now communicate with your partner so that he/she can grip the other side of the towel to apply resistance. Keeping your upper arms close to your head (elbows in) and perpendicular to the floor, lower the resistance in a semicircular motion behind your head until your forearms touch your biceps. Tip: The upper arms should remain stationary and only the forearms should move. Breathe in as you perform this step.","Go back to the starting position by using the triceps to raise the towel. Breathe out as you perform this step.","Repeat for the recommended amount of repetitions."]},{id:"e-stationary-bike",name:"Stationary Bike",type:"cardio",pattern:"squat",primary:["quads"],secondary:["glutes","calves"],equipment:["machine"],laterality:"bilateral",bw:0,metric:"time",aliases:["cycling","spin bike"]},{id:"g-step-up-with-knee-raise",name:"Step-up with Knee Raise",type:"compound_lower",pattern:"lunge",primary:["glutes"],secondary:["hamstrings","quads"],equipment:["bodyweight"],laterality:"bilateral",bw:.6,metric:"weight_reps",steps:["Stand facing a box or bench of an appropriate height with your feet together. This will be your starting position.","Begin the movement by stepping up, putting your left foot on the top of the bench. Extend through the hip and knee of your front leg to stand up on the box. As you stand on the box with your left leg, flex your right knee and hip, bringing your knee as high as you can.","Reverse this motion to step down off the box, and then repeat the sequence on the opposite leg."]},{id:"g-stiff-leg-barbell-good-morning",name:"Stiff Leg Barbell Good Morning",type:"compound_upper",pattern:"hinge",primary:["lower_back"],secondary:["glutes","hamstrings"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.","Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a shoulder width medium stance. Keep your head up at all times as looking down will get you off balance and also maintain a straight back. This will be your starting position.","Keeping your legs stationary, move your torso forward by bending at the hips while inhaling. Lower your torso until it is parallel with the floor.","Begin to raise the bar as you exhale by elevating your torso back to the starting position.","Repeat for the recommended amount of repetitions."]},{id:"e-stiff-leg-deadlift",name:"Stiff-Leg Deadlift",type:"compound_lower",pattern:"hinge",primary:["hamstrings"],secondary:["glutes","lower_back"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-stiff-legged-barbell-deadlift",name:"Stiff-Legged Barbell Deadlift",type:"compound_lower",pattern:"hinge",primary:["hamstrings"],secondary:["glutes","lower_back"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Grasp a bar using an overhand grip (palms facing down). You may need some wrist wraps if using a significant amount of weight.","Stand with your torso straight and your legs spaced using a shoulder width or narrower stance. The knees should be slightly bent. This is your starting position.","Keeping the knees stationary, lower the barbell to over the top of your feet by bending at the hips while keeping your back straight. Keep moving forward as if you were going to pick something from the floor until you feel a stretch on the hamstrings. Inhale as you perform this movement.","Start bringing your torso up straight again by extending your hips until you are back at the starting position. Exhale as you perform this movement.","Repeat for the recommended amount of repetitions."]},{id:"e-stir-the-pot",name:"Stir the Pot",type:"core",pattern:"core",primary:["abs"],secondary:["obliques"],equipment:["bodyweight"],laterality:"bilateral",bw:0,metric:"time",aliases:[]},{id:"g-straight-bar-bench-mid-rows",name:"Straight Bar Bench Mid Rows",type:"compound_upper",pattern:"horizontal_pull",primary:["upper_back"],secondary:["biceps","lats"],equipment:["barbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Place a loaded barbell on the end of a bench. Standing on the bench behind the bar, take a medium, pronated grip. Stand with your hips back and chest up, maintaining a neutral spine. This will be your starting position.","Row the bar to your torso by retracting the shoulder blades and flexing the elbows. Use a controlled movement with no jerking.","After a brief pause, slowly return the bar to the starting position, ensuring to go all the way down."]},{id:"g-straight-raises-on-incline-bench",name:"Straight Raises on Incline Bench",type:"isolation_upper",pattern:"isolation",primary:["front_delts"],secondary:["lats"],equipment:["barbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Place a bar on the ground behind the head of an incline bench.","Lay on the bench face down. With a pronated grip, pick the barbell up from the floor, keeping your arms straight. Allow the bar to hang straight down. This will be your starting position.","To begin, raise the barbell out in front of your head while keeping your arms extended.","Return to the starting position."]},{id:"g-straight-arm-dumbbell-pullover",name:"Straight-Arm Dumbbell Pullover",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["lats","front_delts","triceps"],equipment:["dumbbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Place a dumbbell standing up on a flat bench.","Ensuring that the dumbbell stays securely placed at the top of the bench, lie perpendicular to the bench (torso across it as in forming a cross) with only your shoulders lying on the surface. Hips should be below the bench and legs bent with feet firmly on the floor. The head will be off the bench as well.","Grasp the dumbbell with both hands and hold it straight over your chest at arms length. Both palms should be pressing against the underside one of the sides of the dumbbell. This will be your starting position. Caution: Always ensure that the dumbbell used for this exercise is secure. Using a dumbbell with loose plates can result in the dumbbell falling apart and falling on your face.","While keeping your arms straight, lower the weight slowly in an arc behind your head while breathing in until you feel a stretch on the chest.","At that point, bring the dumbbell back to the starting position using the arc through which the weight was lowered and exhale as you perform this movement.","Hold the weight on the initial position for a second and repeat the motion for the prescribed number of repetitions."]},{id:"g-suitcase-carry",name:"Suitcase Carry",type:"core",pattern:"carry",primary:["abs"],secondary:["glutes"],equipment:["kettlebell"],laterality:"bilateral",bw:0,metric:"time",steps:["Pick up a kettlebell in one hand like a suitcase, standing tall with your shoulders level.","Walk forward with short, steady steps, bracing your core so you don't lean toward the weight.","Set the bell down after the distance or time, then switch hands."]},{id:"g-sumo-deadlift-with-bands",name:"Sumo Deadlift with Bands",type:"compound_lower",pattern:"hinge",primary:["hamstrings"],secondary:["glutes","lower_back","quads"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["To deadlift with short bands, simply loop them over the bar before you start, and step into them to set up. Ensure that they under the back half of your foot, directly where you are driving into the floor.","Begin with a bar loaded on the ground. Approach the bar so that the bar intersects the middle of the feet. The feet should be set very wide, near the collars. Bend at the hips to grip the bar. The arms should be directly below the shoulders, inside the legs, and you can use a pronated grip, a mixed grip, or hook grip.","Take a breath, and then lower your hips, looking forward with your head with your chest up. Drive through the floor, spreading your feet apart, with your weight on the back half of your feet. Extend through the hips and knees.","As the bar passes through the knees, lean back and drive the hips into the bar, pulling your shoulder blades together.","Return the weight to the ground by bending at the hips and controlling the weight on the way down."]},{id:"g-sumo-deadlift-with-chains",name:"Sumo Deadlift with Chains",type:"compound_lower",pattern:"hinge",primary:["hamstrings"],secondary:["glutes","lower_back","quads"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["You can attach the chains to the sleeves of the bar, or just drape the middle over the bar so there is a greater weight increase as you lift. Attempt to keep the ends of the chains away from the plates so you don't hit them when you lower the weight.","Begin with a bar loaded on the ground. Approach the bar so that the bar intersects the middle of the feet. The feet should be set very wide, near the collars. Bend at the hips to grip the bar. The arms should be directly below the shoulders, inside the legs, and you can use a pronated grip, a mixed grip, or hook grip. Relax the shoulders, which in effect lengthens your arms.","Take a breath, and then lower your hips, looking forward with your head with your chest up. Drive through the floor, spreading your feet apart, with your weight on the back half of your feet. Extend through the hips and knees.","As the bar passes through the knees, lean back and drive the hips into the bar, pulling your shoulder blades together.","Return the weight to the ground by bending at the hips and controlling the weight on the way down."]},{id:"g-superman-hold",name:"Superman Hold",type:"isolation_upper",pattern:"isolation",primary:["lower_back"],secondary:["glutes"],equipment:["bodyweight"],laterality:"bilateral",bw:.3,metric:"time",steps:["To begin, lie straight and face down on the floor or exercise mat. Your arms should be fully extended in front of you. This is the starting position.","Simultaneously raise your arms, legs, and chest off of the floor and hold this contraction for 2 seconds. Tip: Squeeze your lower back to get the best results from this exercise. Remember to exhale during this movement. Note: When holding the contracted position, you should look like superman when he is flying.","Slowly begin to lower your arms, legs and chest back down to the starting position while inhaling.","Repeat for the recommended amount of repetitions prescribed in your program."]},{id:"e-svend-press",name:"Svend Press",type:"isolation_upper",pattern:"isolation",primary:["chest"],secondary:[],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-swimming",name:"Swimming",type:"cardio",pattern:"carry",primary:["lats","front_delts"],secondary:["abs"],equipment:["bodyweight"],laterality:"bilateral",bw:0,metric:"time",aliases:[]},{id:"g-t-bar-row-with-handle",name:"T-Bar Row with Handle",type:"compound_upper",pattern:"horizontal_pull",primary:["upper_back"],secondary:["biceps","lats"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Position a bar into a landmine or in a corner to keep it from moving. Load an appropriate weight onto your end.","Stand over the bar, and position a Double D row handle around the bar next to the collar. Using your hips and legs, rise to a standing position.","Assume a wide stance with your hips back and your chest up. Your arms should be extended. This will be your starting position.","Pull the weight to your upper abdomen by retracting the shoulder blades and flexing the elbows. Do not jerk the weight or cheat during the movement.","After a brief pause, return to the starting position."]},{id:"g-tate-press",name:"Tate Press",type:"isolation_upper",pattern:"horizontal_push",primary:["triceps"],secondary:["chest","front_delts"],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Lie down on a flat bench with a dumbbell in each hand on top of your thighs. The palms of your hand will be facing each other.","By using your thighs to help you get the dumbbells up, clean the dumbbells one arm at a time so that you can hold them in front of you at shoulder width. Note: when holding the dumbbells in front of you, make sure your arms are wider than shoulder width apart from each other using a pronated (palms forward) grip. Allow your elbows to point out. This is your starting position.","Keeping the upper arms stationary, slowly move the dumbbells in and down in a semi circular motion until they touch the upper chest while inhaling. Keep full control of the dumbbells at all times and do not move the upper arms nor rest the dumbbells on the chest.","As you breathe out, move the dumbbells up using your triceps and the same semi-circular motion but in reverse. Attempt to keep the dumbbells together as they move up. Lock your arms in the contracted position, hold for a second and then start coming down again slowly again. Tip: It should take at least twice as long to go down than to come up.","Repeat the movement for the prescribed amount of repetitions of your training program."]},{id:"e-thruster",name:"Thruster",type:"compound_lower",pattern:"squat",primary:["quads","front_delts"],secondary:["glutes","triceps"],equipment:["barbell","dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-tibialis-raise",name:"Tibialis Raise",type:"isolation_lower",pattern:"isolation",primary:["calves"],secondary:[],equipment:["bodyweight"],laterality:"bilateral",bw:.3,metric:"weight_reps",aliases:["tib raise"]},{id:"e-tire-flip",name:"Tire Flip",type:"compound_lower",pattern:"hinge",primary:["glutes","hamstrings"],secondary:["chest","front_delts"],equipment:["bodyweight"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-toes-to-bar",name:"Toes-to-Bar",type:"core",pattern:"core",primary:["abs"],secondary:["lats"],equipment:["pullup_bar"],laterality:"bilateral",bw:.35,metric:"weight_reps",aliases:[]},{id:"e-trap-bar-shrug",name:"Trap Bar Shrug",type:"isolation_upper",pattern:"isolation",primary:["traps"],secondary:[],equipment:["trap_bar"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-treadmill-run",name:"Treadmill Run",type:"cardio",pattern:"carry",primary:["quads","calves"],secondary:["hamstrings","glutes"],equipment:["machine"],laterality:"bilateral",bw:0,metric:"time",aliases:["running"]},{id:"g-tricep-dumbbell-kickback",name:"Tricep Dumbbell Kickback",type:"isolation_upper",pattern:"isolation",primary:["triceps"],secondary:[],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Start with a dumbbell in each hand and your palms facing your torso. Keep your back straight with a slight bend in the knees and bend forward at the waist. Your torso should be almost parallel to the floor. Make sure to keep your head up. Your upper arms should be close to your torso and parallel to the floor. Your forearms should be pointed towards the floor as you hold the weights. There should be a 90-degree angle formed between your forearm and upper arm. This is your starting position.","Now, while keeping your upper arms stationary, exhale and use your triceps to lift the weights until the arm is fully extended. Focus on moving the forearm.","After a brief pause at the top contraction, inhale and slowly lower the dumbbells back down to the starting position.","Repeat the movement for the prescribed amount of repetitions."]},{id:"e-triceps-dip-machine",name:"Triceps Dip Machine",type:"compound_upper",pattern:"vertical_push",primary:["triceps"],secondary:["chest"],equipment:["machine"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-triceps-overhead-extension-with-rope",name:"Triceps Overhead Extension with Rope",type:"isolation_upper",pattern:"isolation",primary:["triceps"],secondary:[],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Attach a rope to a low pulley. After selecting an appropriate weight, grasp the rope with both hands and face away from the cable.","Position your hands behind your head with your elbows point straight up. Your elbows should start out flexed, and you can stagger your stance and lean gently away from the machine to create greater stability. This will be your starting position.","To perform the movement, extend through the elbow while keeping the upper arm in position, raising your hands above your head.","Squeeze your triceps at the top of the movement, and slowly lower the weight back to the start position."]},{id:"g-triceps-pushdown-rope-attachment",name:"Triceps Pushdown - Rope Attachment",type:"isolation_upper",pattern:"isolation",primary:["triceps"],secondary:[],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Attach a rope attachment to a high pulley and grab with a neutral grip (palms facing each other).","Standing upright with the torso straight and a very small inclination forward, bring the upper arms close to your body and perpendicular to the floor. The forearms should be pointing up towards the pulley as they hold the rope with the palms facing each other. This is your starting position.","Using the triceps, bring the rope down as you bring each side of the rope to the side of your thighs. At the end of the movement the arms are fully extended and perpendicular to the floor. The upper arms should always remain stationary next to your torso and only the forearms should move. Exhale as you perform this movement.","After holding for a second, at the contracted position, bring the rope slowly up to the starting point. Breathe in as you perform this step.","Repeat for the recommended amount of repetitions."]},{id:"g-triceps-pushdown-v-bar-attachment",name:"Triceps Pushdown - V-Bar Attachment",type:"isolation_upper",pattern:"isolation",primary:["triceps"],secondary:[],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Attach a V-Bar to a high pulley and grab with an overhand grip (palms facing down) at shoulder width.","Standing upright with the torso straight and a very small inclination forward, bring the upper arms close to your body and perpendicular to the floor. The forearms should be pointing up towards the pulley as they hold the bar. The thumbs should be higher than the small finger. This is your starting position.","Using the triceps, bring the bar down until it touches the front of your thighs and the arms are fully extended perpendicular to the floor. The upper arms should always remain stationary next to your torso and only the forearms should move. Exhale as you perform this movement.","After a second hold at the contracted position, bring the V-Bar slowly up to the starting point. Breathe in as you perform this step.","Repeat for the recommended amount of repetitions."]},{id:"g-tuck-crunch",name:"Tuck Crunch",type:"core",pattern:"core",primary:["abs"],secondary:[],equipment:["bodyweight"],laterality:"bilateral",bw:.3,metric:"weight_reps",steps:["To begin, lie down on the floor or an exercise mat with your back pressed against the floor. Your arms should be lying across your sides with the palms facing down.","Your legs should be crossed by wrapping one ankle around the other. Slowly elevate your legs up in the air until your thighs are perpendicular to the floor with a slight bend at the knees. Note: Your knees and toes should be parallel to the floor as opposed to the thighs.","Move your arms from the floor and cross them so they are resting on your chest. This is the starting position.","While keeping your lower back pressed against the floor, slowly lift your torso. Remember to exhale while perform this part of the exercise.","Slowly begin to lower your torso back down to the starting position while inhaling.","Repeat for the recommended amount of repetitions."]},{id:"g-two-arm-dumbbell-preacher-curl",name:"Two-Arm Dumbbell Preacher Curl",type:"isolation_upper",pattern:"isolation",primary:["biceps"],secondary:[],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Grab a dumbbell with each arm and place the upper arms on top of the preacher bench or the incline bench. The dumbbell should be held at shoulder length. This will be your starting position.","As you breathe in, slowly lower the dumbbells until your upper arm is extended and the biceps is fully stretched.","As you exhale, use the biceps to curl the weights up until your biceps is fully contracted and the dumbbells are at shoulder height.","Squeeze the biceps hard for a second at the contracted position and repeat for the recommended amount of repetitions."]},{id:"g-two-arm-kettlebell-clean",name:"Two-Arm Kettlebell Clean",type:"compound_upper",pattern:"hinge",primary:["front_delts"],secondary:["calves","glutes","hamstrings","lats"],equipment:["kettlebell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Place two kettlebells between your feet. To get in the starting position, push your butt back and look straight ahead.","Clean the kettlebells to your shoulders by extending through the legs and hips as you raise the kettlebells towards your shoulders. Rotate your wrists as you do so.","Lower the kettlebells back to the starting position and repeat."]},{id:"g-two-arm-kettlebell-jerk",name:"Two-Arm Kettlebell Jerk",type:"compound_upper",pattern:"vertical_push",primary:["front_delts"],secondary:["calves","quads","triceps"],equipment:["kettlebell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Clean two kettlebells to your shoulders.","Clean the kettlebells to your shoulders by extending through the legs and hips as you swing the kettlebells towards your shoulders.","Rotate your wrists as you do so, so that the palms face forward.","Squat down a few inches and reverse the motion rapidly driving both kettlebells overhead.","Immediately after the initial push, squat down again and get under the kettlebells.","Once the kettlebells are locked out, stand upright to complete the exercise."]},{id:"g-two-arm-kettlebell-military-press",name:"Two-Arm Kettlebell Military Press",type:"compound_upper",pattern:"vertical_push",primary:["front_delts"],secondary:["triceps"],equipment:["kettlebell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Clean two kettlebells to your shoulders. Clean the kettlebells to your shoulders by extending through the legs and hips as you swing the kettlebells towards your shoulders. Rotate your wrists as you do so, so that the palms face forward.","Press the kettlebells up and out. As the kettlebells pass your head, lean into the weights so that the kettlebells are racked behind your head. Make sure to contract your lats, butt, and stomach for added stability."]},{id:"g-two-arm-kettlebell-row",name:"Two-Arm Kettlebell Row",type:"compound_upper",pattern:"horizontal_pull",primary:["upper_back"],secondary:["biceps","lats"],equipment:["kettlebell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Place two kettlebells in front of your feet. Bend your knees slightly and then push your butt out as much as possible as you bend over to get in the starting position.","Grab both kettlebells and pull them to your stomach, retracting your shoulder blades and flexing the elbows. Keep your back straight. Lower and repeat."]},{id:"g-underhand-cable-pulldowns",name:"Underhand Cable Pulldowns",type:"compound_upper",pattern:"vertical_pull",primary:["lats"],secondary:["biceps","front_delts"],equipment:["machine","cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Sit down on a pull-down machine with a wide bar attached to the top pulley. Adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.","Grab the pull-down bar with the palms facing your torso (a supinated grip). Make sure that the hands are placed closer than the shoulder width.","As you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.","As you breathe out, pull the bar down until it touches your upper chest by drawing the shoulders and the upper arms down and back. Tip: Concentrate on squeezing the back muscles once you reach the fully contracted position and keep the elbows close to your body. The upper torso should remain stationary as your bring the bar to you and only the arms should move. The forearms should do no other work other than hold the bar.","After a second on the contracted position, while breathing in, slowly bring the bar back to the starting position when your arms are fully extended and the lats are fully stretched.","Repeat this motion for the prescribed amount of repetitions."]},{id:"g-upright-barbell-row",name:"Upright Barbell Row",type:"compound_upper",pattern:"horizontal_push",primary:["front_delts"],secondary:["upper_back"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Grasp a barbell with an overhand grip that is slightly less than shoulder width. The bar should be resting on the top of your thighs with your arms extended and a slight bend in your elbows. Your back should also be straight. This will be your starting position.","Now exhale and use the sides of your shoulders to lift the bar, raising your elbows up and to the side. Keep the bar close to your body as you raise it. Continue to lift the bar until it nearly touches your chin. Tip: Your elbows should drive the motion, and should always be higher than your forearms. Remember to keep your torso stationary and pause for a second at the top of the movement.","Lower the bar back down slowly to the starting position. Inhale as you perform this portion of the movement.","Repeat for the recommended amount of repetitions."]},{id:"g-upright-cable-row",name:"Upright Cable Row",type:"compound_upper",pattern:"horizontal_push",primary:["upper_back"],secondary:["front_delts","lats"],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Grasp a straight bar cable attachment that is attached to a low pulley with a pronated (palms facing your thighs) grip that is slightly less than shoulder width. The bar should be resting on top of your thighs. Your arms should be extended with a slight bend at the elbows and your back should be straight. This will be your starting position.","Use your side shoulders to lift the cable bar as you exhale. The bar should be close to the body as you move it up. Continue to lift it until it nearly touches your chin. Tip: Your elbows should drive the motion. As you lift the bar, your elbows should always be higher than your forearms. Also, keep your torso stationary and pause for a second at the top of the movement.","Lower the bar back down slowly to the starting position. Inhale as you perform this portion of the movement.","Repeat for the recommended amount of repetitions."]},{id:"g-upright-row-with-bands",name:"Upright Row - with Bands",type:"compound_upper",pattern:"horizontal_push",primary:["upper_back"],secondary:["side_delts","lats"],equipment:["band"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["To begin, stand on an exercise band so that tension begins at arm's length. Grasp the handles using a pronated (palms facing your thighs) grip that is slightly less than shoulder width. The handles should be resting on top of your thighs. Your arms should be extended with a slight bend at the elbows and your back should be straight. This will be your starting position.","Use your side shoulders to lift the handles as you exhale. The handles should be close to the body as you move them up. Continue to lift the handles until they nearly touches your chin. Tip: Your elbows should drive the motion. As you lift the handles, your elbows should always be higher than your forearms. Also, keep your torso stationary and pause for a second at the top of the movement.","Lower the handles back down slowly to the starting position. Inhale as you perform this portion of the movement.","Repeat for the recommended amount of repetitions."]},{id:"g-v-bar-pulldown",name:"V-Bar Pulldown",type:"compound_upper",pattern:"vertical_pull",primary:["lats"],secondary:["biceps","front_delts"],equipment:["machine","cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Sit down on a pull-down machine with a V-Bar attached to the top pulley.","Adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.","Grab the V-bar with the palms facing each other (a neutral grip). Stick your chest out and lean yourself back slightly (around 30-degrees) in order to better engage the lats. This will be your starting position.","Using your lats, pull the bar down as you squeeze your shoulder blades. Continue until your chest nearly touches the V-bar. Exhale as you execute this motion. Tip: Keep the torso stationary throughout the movement.","After a second hold on the contracted position, slowly bring the bar back to the starting position as you breathe in.","Repeat for the prescribed number of repetitions."]},{id:"g-v-bar-pullup",name:"V-Bar Pullup",type:"compound_upper",pattern:"vertical_pull",primary:["lats"],secondary:["biceps","front_delts"],equipment:["pullup_bar"],laterality:"bilateral",bw:1,metric:"weight_reps",steps:["Start by placing the middle of the V-bar in the middle of the pull-up bar (assuming that the pull-up station you are using does not have neutral grip handles). The V-Bar handles will be facing down so that you can hang from the pull-up bar through the use of the handles.","Once you securely place the V-bar, take a hold of the bar from each side and hang from it. Stick your chest out and lean yourself back slightly in order to better engage the lats. This will be your starting position.","Using your lats, pull your torso up while leaning your head back slightly so that you do not hit yourself with the chin-up bar. Continue until your chest nearly touches the V-bar. Exhale as you execute this motion.","After a second hold on the contracted position, slowly lower your body back to the starting position as you breathe in.","Repeat for the prescribed number of repetitions."]},{id:"e-v-squat-machine",name:"V-Squat Machine",type:"compound_lower",pattern:"squat",primary:["quads"],secondary:["glutes"],equipment:["machine"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-viking-press",name:"Viking Press",type:"compound_upper",pattern:"vertical_push",primary:["front_delts"],secondary:["triceps"],equipment:["machine"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-walking",name:"Walking",type:"cardio",pattern:"carry",primary:["calves"],secondary:["quads"],equipment:["bodyweight"],laterality:"bilateral",bw:0,metric:"time",aliases:["walk"]},{id:"e-wall-ball",name:"Wall Ball",type:"compound_lower",pattern:"squat",primary:["quads","front_delts"],secondary:["glutes"],equipment:["bodyweight"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-wall-slide",name:"Wall Slide",type:"isolation_upper",pattern:"isolation",primary:["traps","rear_delts"],secondary:[],equipment:["bodyweight"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-weighted-chin-up",name:"Weighted Chin-Up",type:"compound_upper",pattern:"vertical_pull",primary:["lats","biceps"],secondary:[],equipment:["pullup_bar"],laterality:"bilateral",bw:1,metric:"weight_reps",aliases:[]},{id:"e-weighted-dip",name:"Weighted Dip",type:"compound_upper",pattern:"vertical_push",primary:["chest","triceps"],secondary:["front_delts"],equipment:["dip_bars"],laterality:"bilateral",bw:1,metric:"weight_reps",aliases:[]},{id:"g-weighted-jump-squat",name:"Weighted Jump Squat",type:"compound_lower",pattern:"squat",primary:["quads"],secondary:["calves","glutes","hamstrings","lats"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Position a lightly loaded barbell across the back of your shoulders. You could also use a weighted vest, sandbag, or other type of resistance for this exercise.","The weight should be light enough that it doesn't slow you down significantly. Your feet should be just outside of shoulder width with your head and chest up. This will be your starting position.","Using a countermovement, squat partially down and immediately reverse your direction to explode off of the ground, extending through your hips, knees, and ankles. Maintain good posture throughout the jump.","As you return to the ground, absorb the impact through your legs."]},{id:"e-weighted-plank",name:"Weighted Plank",type:"core",pattern:"core",primary:["abs"],secondary:["obliques"],equipment:["bodyweight"],laterality:"bilateral",bw:0,metric:"time",aliases:[]},{id:"e-weighted-pull-up",name:"Weighted Pull-Up",type:"compound_upper",pattern:"vertical_pull",primary:["lats"],secondary:["biceps","upper_back"],equipment:["pullup_bar"],laterality:"bilateral",bw:1,metric:"weight_reps",aliases:[]},{id:"e-weighted-push-up",name:"Weighted Push-Up",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["triceps"],equipment:["bodyweight"],laterality:"bilateral",bw:.65,metric:"weight_reps",aliases:[]},{id:"g-wide-stance-barbell-squat",name:"Wide Stance Barbell Squat",type:"compound_lower",pattern:"squat",primary:["quads"],secondary:["calves","glutes","hamstrings","lats"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.","Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a wider-than-shoulder-width stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance, and also maintain a straight back. This will be your starting position.","Begin to slowly lower the bar by bending the knees as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees (which is the point in which the upper legs are below parallel to the floor). Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise the bar as you exhale by pushing the floor with the heel of your foot as you straighten the legs again and go back to the starting position.","Repeat for the recommended amount of repetitions."]},{id:"g-wide-grip-barbell-bench-press",name:"Wide-Grip Barbell Bench Press",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["front_delts","triceps"],equipment:["barbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Lie back on a flat bench with feet firm on the floor. Using a wide, pronated (palms forward) grip that is around 3 inches away from shoulder width (for each hand), lift the bar from the rack and hold it straight over you with your arms locked. The bar will be perpendicular to the torso and the floor. This will be your starting position.","As you breathe in, come down slowly until you feel the bar on your middle chest.","After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms and squeeze your chest in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up.","Repeat the movement for the prescribed amount of repetitions."]},{id:"g-wide-grip-decline-barbell-bench-press",name:"Wide-Grip Decline Barbell Bench Press",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["front_delts","triceps"],equipment:["barbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Lie back on a decline bench with the feet securely locked at the front of the bench. Using a wide, pronated (palms forward) grip that is around 3 inches away from shoulder width (for each hand), lift the bar from the rack and hold it straight over you with your arms locked. The bar will be perpendicular to the torso and the floor. This will be your starting position.","As you breathe in, come down slowly until you feel the bar on your lower chest.","After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms and squeeze your chest in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up.","Repeat the movement for the prescribed amount of repetitions."]},{id:"g-wide-grip-decline-barbell-pullover",name:"Wide-Grip Decline Barbell Pullover",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["front_delts","triceps"],equipment:["barbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Lie down on a decline bench with both legs securely locked in position. Reach for the barbell behind the head using a pronated grip (palms facing out). Make sure to grab the barbell wider than shoulder width apart for this exercise. Slowly lift the barbell up from the floor by using your arms.","When positioned properly, your arms should be fully extended and perpendicular to the floor. This is the starting position.","Begin by moving the barbell back down in a semicircular motion as if you were going to place it on the floor, but instead, stop when the arms are parallel to the floor. Tip: Keep the arms fully extended at all times. The movement should only happen at the shoulder joint. Inhale as you perform this portion of the movement.","Now bring the barbell up while exhaling until you are back at the starting position. Remember to keep full control of the barbell at all times.","Repeat the movement for the prescribed amount of repetitions of your training program.","When finished with your set, slowly lower the barbell back down until it is level with your head and release it."]},{id:"e-wide-grip-lat-pulldown",name:"Wide-Grip Lat Pulldown",type:"compound_upper",pattern:"vertical_pull",primary:["lats"],secondary:["upper_back","biceps"],equipment:["cable","machine"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-wide-grip-pulldown-behind-the-neck",name:"Wide-Grip Pulldown behind the Neck",type:"compound_upper",pattern:"vertical_pull",primary:["lats"],secondary:["biceps","front_delts"],equipment:["machine","cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Sit down on a pull-down machine with a wide bar attached to the top pulley. Make sure that you adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.","Grab the bar with the palms facing forward using the prescribed grip. Note on grips: For a wide grip, your hands need to be spaced out at a distance wider than your shoulder width. For a medium grip, your hands need to be spaced out at a distance equal to your shoulder width and for a close grip at a distance smaller than your shoulder width.","As you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso and head forward. Think of an imaginary line from the center of the bar down to the back of your neck. This is your starting position.","As you breathe out, bring the bar down until it touches the back of your neck by drawing the shoulders and the upper arms down and back. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary and only the arms should move. The forearms should do no other work except for holding the bar; therefore do not try to pull down the bar using the forearms.","After a second on the contracted position squeezing your shoulder blades together, slowly raise the bar back to the starting position when your arms are fully extended and the lats are fully stretched. Inhale during this portion of the movement.","Repeat this motion for the prescribed amount of repetitions."]},{id:"g-wide-grip-rear-pull-up",name:"Wide-Grip Rear Pull-Up",type:"compound_upper",pattern:"vertical_pull",primary:["lats"],secondary:["biceps","front_delts"],equipment:["pullup_bar"],laterality:"bilateral",bw:1,metric:"weight_reps",steps:["Grab the pull-up bar with the palms facing forward using a wide grip.","As you have both arms extended in front of you holding the bar, bring your torso forward and head so that there is an imaginary line from the pull-up bar to the back of your neck. This is your starting position.","Pull your torso up until the bar is near the back of your neck. To do this, draw the shoulders and upper arms down and back while slightly leaning your head forward. Exhale as you perform this portion of the movement. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary as it moves through space and only the arms should move. The forearms should do no other work other than hold the bar.","After a second on the contracted position, start to inhale and slowly lower your torso back to the starting position when your arms are fully extended and the lats are fully stretched.","Repeat this motion for the prescribed amount of repetitions."]},{id:"g-wide-grip-standing-barbell-curl",name:"Wide-Grip Standing Barbell Curl",type:"isolation_upper",pattern:"isolation",primary:["biceps"],secondary:[],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Stand up with your torso upright while holding a barbell at the wide outer handle. The palm of your hands should be facing forward. The elbows should be close to the torso. This will be your starting position.","While holding the upper arms stationary, curl the weights forward while contracting the biceps as you breathe out. Tip: Only the forearms should move.","Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second and squeeze the biceps hard.","Slowly begin to bring the bar back to starting position as your breathe in.","Repeat for the recommended amount of repetitions."]},{id:"g-wind-sprints",name:"Wind Sprints",type:"core",pattern:"core",primary:["abs"],secondary:[],equipment:["bodyweight"],laterality:"bilateral",bw:.6,metric:"weight_reps",steps:["Hang from a pull-up bar using a pronated grip. Your arms and legs should be extended. This will be your starting position.","Begin by quickly raising one knee as high as you can. Do not swing your body or your legs. 3","Immediately reverse the motion, returning that leg to the starting position. Simultaneously raise the opposite knee as high as possible.","Continue alternating between legs until the set is complete."]},{id:"e-world-s-greatest-stretch",name:"World’s Greatest Stretch",type:"compound_lower",pattern:"lunge",primary:["glutes","hamstrings"],secondary:["adductors"],equipment:["bodyweight"],laterality:"unilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-wrist-roller",name:"Wrist Roller",type:"isolation_upper",pattern:"isolation",primary:["forearms"],secondary:[],equipment:["bodyweight"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-y-raise",name:"Y-Raise",type:"isolation_upper",pattern:"isolation",primary:["side_delts","traps"],secondary:[],equipment:["dumbbell","cable"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-yates-row",name:"Yates Row",type:"compound_upper",pattern:"horizontal_pull",primary:["upper_back","lats"],secondary:["biceps"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-yoke-walk",name:"Yoke Walk",type:"compound_lower",pattern:"carry",primary:["quads","traps"],secondary:["abs"],equipment:["machine"],laterality:"bilateral",bw:0,metric:"time",aliases:[]},{id:"e-z-press",name:"Z Press",type:"compound_upper",pattern:"vertical_push",primary:["front_delts"],secondary:["triceps","abs"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-zercher-squat",name:"Zercher Squat",type:"compound_lower",pattern:"squat",primary:["quads","glutes"],secondary:["abs","upper_back"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-zottman-curl",name:"Zottman Curl",type:"isolation_upper",pattern:"isolation",primary:["forearms"],secondary:[],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Stand up with your torso upright and a dumbbell in each hand being held at arms length. The elbows should be close to the torso.","Make sure the palms of the hands are facing each other. This will be your starting position.","While holding the upper arm stationary, curl the weights while contracting the biceps as you breathe out. Only the forearms should move. Your wrist should rotate so that you have a supinated (palms up) grip. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level.","Hold the contracted position for a second as you squeeze the biceps.","Now during the contracted position, rotate your wrist until you now have a pronated (palms facing down) grip with the thumb at a higher position than the pinky.","Slowly begin to bring the dumbbells back down using the pronated grip.","As the dumbbells close your thighs, start rotating the wrist so that you go back to a neutral (palms facing your body) grip.","Repeat for the recommended amount of repetitions."]},{id:"g-zottman-preacher-curl",name:"Zottman Preacher Curl",type:"isolation_upper",pattern:"isolation",primary:["forearms"],secondary:[],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Grab a dumbbell in each hand and place your upper arms on top of the preacher bench or the incline bench. The dumbbells should be held at shoulder height and the elbows should be flexed. Hold the dumbbells with the palms of your hands facing down. This will be your starting position.","As you breathe in, slowly lower the dumbbells keeping the palms down until your upper arm is extended and your biceps are fully stretched.","Now rotate your wrists once you are at the bottom of the movement so that the palms of the hands are facing up.","As you exhale, use your biceps to curl the weights up until they are fully contracted and the dumbbells are at shoulder height. Again, remember that to ensure full contraction you need to bring that small finger higher than the thumb.","Squeeze the biceps hard for a second at the contracted position and rotate your wrists so that the palms are facing down again.","Repeat for the recommended amount of repetitions."]}],t1=Object.freeze(Object.defineProperty({__proto__:null,default:e1},Symbol.toStringTag,{value:"Module"}));function r1(e){const t=[];let r=[],n="",o=!1;const a=e.replace(/^﻿/,"");for(let l=0;l<a.length;l++){const h=a[l];o?h==='"'&&a[l+1]==='"'?(n+='"',l++):h==='"'?o=!1:n+=h:h==='"'?o=!0:h===","||h===";"&&!a.slice(0,a.indexOf(`
