Dumbbell Curl",type:"isolation_upper",pattern:"isolation",primary:["biceps"],secondary:[],equipment:["dumbbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Sit on a flat bench with a dumbbell on each hand being held at arms length. The elbows should be close to the torso.","Rotate the palms of the hands so that they are facing your torso. This will be your starting position.","While holding the upper arm stationary, curl the weights and start twisting the wrists once the dumbbells pass your thighs so that the palms of your hands face forward at the end of the movement. Make sure that you contract the biceps as you breathe out and make sure that only the forearms move. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a second as you squeeze the biceps.","Slowly begin to bring the dumbbells back to the starting position as your breathe in and as you rotate the wrists back to a neutral grip.","Repeat for the recommended amount of repetitions."]},{id:"g-seated-dumbbell-inner-biceps-curl",name:"Seated Dumbbell Inner Biceps Curl",type:"isolation_upper",pattern:"isolation",primary:["biceps"],secondary:[],equipment:["dumbbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Sit on the end of a flat bench with a dumbbell in each hand being held at arms length. The elbows should be close to the torso.","Rotate the palms of the hands so that they are facing inward in a neutral position. This will be your starting position.","While holding the upper arms stationary, curl the dumbbells out and up, turning the palms out as you lift and keeping your forearms in line with your outer deltoids. Tips:","Only the forearms should move. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a second as you squeeze the biceps.","Slowly begin to bring the dumbbells back to the starting position as your breathe in. Remember to rotate your arms as you lower the dumbbells so that you can switch back to a neutral grip.","Repeat for the recommended amount of repetitions."]},{id:"g-seated-dumbbell-press",name:"Seated Dumbbell Press",type:"compound_upper",pattern:"horizontal_push",primary:["front_delts"],secondary:["triceps"],equipment:["dumbbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Grab a couple of dumbbells and sit on a military press bench or a utility bench that has a back support on it as you place the dumbbells upright on top of your thighs.","Clean the dumbbells up one at a time by using your thighs to bring the dumbbells up to shoulder height at each side.","Rotate the wrists so that the palms of your hands are facing forward. This is your starting position.","As you exhale, push the dumbbells up until they touch at the top.","After a second pause, slowly come down back to the starting position as you inhale.","Repeat for the recommended amount of repetitions."]},{id:"g-seated-flat-bench-leg-pull-in",name:"Seated Flat Bench Leg Pull-In",type:"core",pattern:"core",primary:["abs"],secondary:[],equipment:["bench"],laterality:"bilateral",bw:.6,metric:"weight_reps",steps:["Sit on a bench with the legs stretched out in front of you slightly below parallel and your arms holding on to the sides of the bench. Your torso should be leaning backwards around a 45-degree angle from the bench. This will be your starting position.","Bring the knees in toward you as you move your torso closer to them at the same time. Breathe out as you perform this movement.","After a second pause, go back to the starting position as you inhale.","Repeat for the recommended amount of repetitions."]},{id:"g-seated-good-mornings",name:"Seated Good Mornings",type:"compound_upper",pattern:"hinge",primary:["lower_back"],secondary:["glutes"],equipment:["barbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Set up a box in a power rack. The pins should be set at an appropriate height. Begin by stepping under the bar and placing it across the back of the shoulders, not on top of your traps. Squeeze your shoulder blades together and rotate your elbows forward, attempting to bend the bar across your shoulders.","Remove the bar from the rack, creating a tight arch in your lower back. Keep your head facing forward. With your back, shoulders, and core tight, push your knees and butt out and you begin your descent. Sit back with your hips until you are seated on the box. This will be your starting position.","Keeping the bar tight, bend forward at the hips as much as possible. If you set the pins to what would be parallel, you not only have a safety if you fail, but know when to stop.","Pause just above the pins and reverse the motion until your torso it upright."]},{id:"g-seated-leg-tucks",name:"Seated Leg Tucks",type:"core",pattern:"core",primary:["abs"],secondary:[],equipment:["bodyweight"],laterality:"bilateral",bw:.3,metric:"weight_reps",steps:["Sit on a bench with the legs stretched out in front of you slightly below parallel and your arms holding on to the sides of the bench. Your torso should be leaning backwards around a 45-degree angle from the bench. This will be your starting position.","Bring the knees in toward you as you move your torso closer to them at the same time. Breathe out as you perform this movement.","After a second pause, go back to the starting position as you inhale.","Repeat for the recommended amount of repetitions."]},{id:"g-seated-machine-row",name:"Seated Machine Row",type:"compound_upper",pattern:"vertical_pull",primary:["lats"],secondary:["biceps"],equipment:["machine"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Load an appropriate weight onto the pins and adjust the seat height so that the handles are at chest level. Grasp the handles with either a neutral or pronated grip. This will be your starting position.","Pull the handles towards your torso, retracting your shoulder blades as you flex the elbow.","Pause at the bottom of the motion, and then slowly return the handles to the starting position. For multiple repetitions, avoid completely returning the weight to the stops to keep tension on the muscles being worked."]},{id:"g-seated-one-arm-cable-pulley-rows",name:"Seated One-arm Cable Pulley Rows",type:"compound_upper",pattern:"horizontal_pull",primary:["upper_back"],secondary:["biceps","lats"],equipment:["cable"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["To get into the starting position, first sit down on the machine and place your feet on the front platform or crossbar provided making sure that your knees are slightly bent and not locked.","Lean over as you keep the natural alignment of your back and grab the single handle attachment with your left arm using a palms-down grip.","With your arm extended pull back until your torso is at a 90-degree angle from your legs. Your back should be slightly arched and your chest should be sticking out. You should be feeling a nice stretch on your lat as you hold the bar in front of you. The right arm can be kept by the waist. This is the starting position of the exercise.","Keeping the torso stationary, pull the handles back towards your torso while keeping the arms close to it as you rotate the wrist, so that by the time your hand is by your abdominals it is in a neutral position (palms facing the torso). Breathe out as you perform that movement. At that point you should be squeezing your back muscles hard.","Hold that contraction for a second and slowly go back to the original position while breathing in. Tip: Remember to rotate the wrist as you go back to the starting position so that the palms are facing down again.","Repeat for the recommended amount of repetitions and then perform the same movement with the right hand."]},{id:"g-seated-side-lateral-raise",name:"Seated Side Lateral Raise",type:"isolation_upper",pattern:"isolation",primary:["side_delts"],secondary:[],equipment:["dumbbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Pick a couple of dumbbells and sit at the end of a flat bench with your feet firmly on the floor. Hold the dumbbells with your palms facing in and your arms straight down at your sides at arms' length. This will be your starting position.","While maintaining the torso stationary (no swinging), lift the dumbbells to your side with a slight bend on the elbow and the hands slightly tilted forward as if pouring water in a glass. Continue to go up until you arms are parallel to the floor. Exhale as you execute this movement and pause for a second at the top.","Lower the dumbbells back down slowly to the starting position as you inhale.","Repeat for the recommended amount of repetitions."]},{id:"g-seated-triceps-press",name:"Seated Triceps Press",type:"isolation_upper",pattern:"horizontal_push",primary:["triceps"],secondary:[],equipment:["dumbbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Sit down on a bench with back support and grasp a dumbbell with both hands and hold it overhead at arm's length. Tip: a better way is to have somebody hand it to you especially if it is very heavy. The resistance should be resting in the palms of your hands with your thumbs around it. The palm of the hand should be facing inward. This will be your starting position.","Keeping your upper arms close to your head (elbows in) and perpendicular to the floor, lower the resistance in a semi-circular motion behind your head until your forearms touch your biceps. Tip: The upper arms should remain stationary and only the forearms should move. Breathe in as you perform this step.","Go back to the starting position by using the triceps to raise the dumbbell. Breathe out as you perform this step.","Repeat for the recommended amount of repetitions."]},{id:"g-see-saw-press-alternating-side-press",name:"See-Saw Press (Alternating Side Press)",type:"compound_upper",pattern:"horizontal_push",primary:["front_delts"],secondary:["obliques","triceps"],equipment:["dumbbell"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["Grab a dumbbell with each hand and stand up erect.","Clean (lift) the dumbbells to the chest/shoulder level and then rotate your wrists so that your palms are facing towards you as if you were getting ready to perform an Arnold Press. This will be your starting position.","Now start extending your left arm overhead as you rotate the wrist so that the palm of your hand faces forward as you go up. Your elbows should come out also as you lift the weight. Simultaneously, you will also be bending from your hip to your opposite side. Tip: If you perform the exercise correctly, is should look as if you are trying to reach for something overhead on the right hand side of your body, but with your left arm. Breathe out as you perform this movement.","Once you reach the top position breathe in. Then, with the weight fully extended overhead and you bent over to your right hand side, begin the movement to the left side.","Repeat for the recommended amount of repetitions."]},{id:"g-shotgun-row",name:"Shotgun Row",type:"compound_upper",pattern:"horizontal_pull",primary:["upper_back"],secondary:["biceps","lats"],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Attach a single handle to a low cable.","After selecting the correct weight, stand a couple feet back with a wide-split stance. Your arm should be extended and your shoulder forward. This will be your starting position.","Perform the movement by retracting the shoulder and flexing the elbow. As you pull, supinate the wrist, turning the palm upward as you go.","After a brief pause, return to the starting position."]},{id:"g-shoulder-press-with-bands",name:"Shoulder Press - with Bands",type:"compound_upper",pattern:"vertical_push",primary:["front_delts"],secondary:["triceps"],equipment:["band"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["To begin, stand on an exercise band so that tension begins at arm's length. Grasp the handles and lift them so that the hands are at shoulder height at each side.","Rotate the wrists so that the palms of your hands are facing forward. Your elbows should be bent, with the upper arms and forearms in line to the torso. This is your starting position.","As you exhale, lift the handles up until your arms are fully extended overhead."]},{id:"g-side-bridge",name:"Side Bridge",type:"core",pattern:"hinge",primary:["obliques"],secondary:["front_delts"],equipment:["bodyweight"],laterality:"bilateral",bw:.3,metric:"weight_reps",steps:["Lie on your side with your forearm on the floor, elbow under your shoulder and legs stacked.","Lift your hips until your body forms a straight line from head to feet.","Hold the position, then lower your hips and switch sides."]},{id:"g-side-jackknife",name:"Side Jackknife",type:"core",pattern:"core",primary:["obliques"],secondary:[],equipment:["bodyweight"],laterality:"bilateral",bw:.6,metric:"weight_reps",steps:["Lie on your side with your legs straight and your top hand behind your head.","Lift your legs and upper body toward each other, bringing your elbow toward your hip.","Lower back down slowly and switch sides after the set."]},{id:"g-side-laterals-to-front-raise",name:"Side Laterals to Front Raise",type:"isolation_upper",pattern:"isolation",primary:["side_delts"],secondary:["lats"],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["In a standing position, hold a pair of dumbbells at your side. This will be your starting position.","Keeping your elbows slightly bent, raise the weights directly in front of you to shoulder height, avoiding any swinging or cheating.","At the top of the exercise move the weights out in front of you, keeping your arms extended.","Lower the weights with a controlled motion.","On the next repetition, raise the weights in front of you to shoulder height before moving the weights laterally to your sides.","Lower the weights to the starting position."]},{id:"g-single-dumbbell-raise",name:"Single Dumbbell Raise",type:"isolation_upper",pattern:"isolation",primary:["front_delts"],secondary:["lats"],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["With a wide stance, hold a dumbell with both hands, grasping the head of the dumbbell instead of the handle. Your arms should be extended and hanging at the waist. This will be your starting position.","Raise the weight until it is above shoulder level, keeping your arms extended. Your torso and hips should remain stationary throughout the movement.","Return to the starting position and repeat for the recommended amount of repetitions."]},{id:"g-single-leg-glute-bridge",name:"Single Leg Glute Bridge",type:"isolation_lower",pattern:"hinge",primary:["glutes"],secondary:["hamstrings"],equipment:["bodyweight"],laterality:"unilateral",bw:.3,metric:"weight_reps",steps:["Lay on the floor with your feet flat and knees bent.","Raise one leg off of the ground, pulling the knee to your chest. This will be your starting position.","Execute the movement by driving through the heel, extending your hip upward and raising your glutes off of the ground.","Extend as far as possible, pause and then return to the starting position."]},{id:"g-single-arm-cable-crossover",name:"Single-Arm Cable Crossover",type:"isolation_upper",pattern:"isolation",primary:["chest"],secondary:[],equipment:["cable"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["Begin by moving the pulleys to the high position, select the resistance to be used, and take a handle in each hand.","Step forward in front of both pulleys with your arms extended in front of you, bringing your hands together. Your head and chest should be up as you lean forward, while your feet should be staggered. This will be your starting position.","Keeping your left arm in place, allow your right arm to extend out to the side, maintaining a slight bend at the elbow. The right arm should be perpendicular to the body at approximately shoulder level.","Return your arm back to the starting position by pulling your hand back to the midline of the body.","Hold for a second at the starting position and repeat the movement on the opposite side. Continue alternating back and forth for the prescribed number of repetitions."]},{id:"e-single-arm-cable-pushdown",name:"Single-Arm Cable Pushdown",type:"isolation_upper",pattern:"isolation",primary:["triceps"],secondary:[],equipment:["cable"],laterality:"unilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-single-arm-lat-pulldown",name:"Single-Arm Lat Pulldown",type:"compound_upper",pattern:"vertical_pull",primary:["lats"],secondary:["biceps"],equipment:["cable"],laterality:"unilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-single-arm-linear-jammer",name:"Single-Arm Linear Jammer",type:"compound_upper",pattern:"horizontal_push",primary:["front_delts"],secondary:["chest","triceps"],equipment:["barbell"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["Position a bar into a landmine or securely anchor it in a corner. Load the bar to an appropriate weight.","Raise the bar from the floor, taking it to your shoulders with one or both hands. Adopt a wide stance. This will be your starting position.","Perform the movement by extending the elbow, pressing the weight up. Move explosively, extending the hips and knees fully to produce maximal force.","Return to the starting position."]},{id:"g-single-arm-push-up",name:"Single-Arm Push-Up",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["front_delts","triceps"],equipment:["bodyweight"],laterality:"unilateral",bw:.65,metric:"weight_reps",steps:["Begin laying prone on the ground. Move yourself into a position supporting your weight on your toes and one arm. Your working arm should be placed directly under the shoulder, fully extended. Your legs should be extended, and for this movement you may need a wider base, placing your feet further apart than in a normal push-up.","Maintain good posture, and place your free hand behind your back. This will be your starting position.","Lower yourself by allowing the elbow to flex until you touch the ground.","Descend slowly, and reverse direction be extending the arm to return to the starting position."]},{id:"e-single-leg-hip-thrust",name:"Single-Leg Hip Thrust",type:"compound_lower",pattern:"hinge",primary:["glutes"],secondary:["hamstrings"],equipment:["bodyweight","bench"],laterality:"unilateral",bw:.5,metric:"weight_reps",aliases:[]},{id:"g-single-leg-leg-extension",name:"Single-Leg Leg Extension",type:"isolation_lower",pattern:"isolation",primary:["quads"],secondary:[],equipment:["machine"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["Seat yourself in the machine and adjust it so that you are positioned properly. The pad should be against the lower part of the shin but not in contact with the ankle. Adjust the seat so that the pivot point is in line with your knee. Select a weight appropriate for your abilities.","Maintaining good posture, fully extend one leg, pausing at the top of the motion.","Return to the starting position without letting the weight stop, keeping tension on the muscle.","Repeat for the desired number of repetitions."]},{id:"e-single-leg-leg-press",name:"Single-Leg Leg Press",type:"compound_lower",pattern:"squat",primary:["quads","glutes"],secondary:[],equipment:["machine"],laterality:"unilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-sissy-squat",name:"Sissy Squat",type:"isolation_lower",pattern:"squat",primary:["quads"],secondary:[],equipment:["bodyweight"],laterality:"bilateral",bw:.6,metric:"weight_reps",aliases:[]},{id:"g-sit-up",name:"Sit-Up",type:"core",pattern:"core",primary:["abs"],secondary:[],equipment:["bodyweight"],laterality:"bilateral",bw:.3,metric:"weight_reps",steps:["Lie down on the floor placing your feet either under something that will not move or by having a partner hold them. Your legs should be bent at the knees.","Place your hands behind your head and lock them together by clasping your fingers. This is the starting position.","Elevate your upper body so that it creates an imaginary V-shape with your thighs. Breathe out when performing this part of the exercise.","Once you feel the contraction for a second, lower your upper body back down to the starting position while inhaling.","Repeat for the recommended amount of repetitions."]},{id:"e-ski-erg",name:"Ski Erg",type:"cardio",pattern:"vertical_pull",primary:["lats","triceps"],secondary:["abs"],equipment:["machine"],laterality:"bilateral",bw:0,metric:"time",aliases:[]},{id:"e-sled-pull",name:"Sled Pull",type:"compound_lower",pattern:"carry",primary:["hamstrings","glutes"],secondary:["upper_back"],equipment:["machine"],laterality:"bilateral",bw:0,metric:"time",aliases:[]},{id:"e-sled-push",name:"Sled Push",type:"compound_lower",pattern:"carry",primary:["quads","glutes"],secondary:["calves"],equipment:["machine"],laterality:"bilateral",bw:0,metric:"time",aliases:[]},{id:"g-smith-incline-shoulder-raise",name:"Smith Incline Shoulder Raise",type:"isolation_upper",pattern:"isolation",primary:["front_delts"],secondary:["chest"],equipment:["smith","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Place an incline bench underneath the smith machine. Place the barbell at a height that you can reach when lying down and your arms are almost fully extended. Once the weight you need is selected, lie down on the incline bench and make sure your shoulders are aligned right under the barbell.","Using a shoulder width pronated (palms forward) grip, lift the bar from the rack and hold it straight over you with a slight bend at the elbows. This will be your starting position.","As you breathe out, lift the bar up until your arms are fully extended. Note: The contraction should be felt around the shoulders.","After a second pause, bring the bar back down to the starting position as you breathe in.","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the bar back in the rack."]},{id:"g-smith-machine-behind-the-back-shrug",name:"Smith Machine behind the Back Shrug",type:"isolation_upper",pattern:"vertical_pull",primary:["traps"],secondary:["front_delts"],equipment:["smith","machine"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["With the bar at thigh level, load an appropriate weight.","Stand with the bar behind you, taking a shoulder-width, pronated grip on the bar and unhook the weight. You should be standing up straight with your head and chest up and your arms extended. This will be your starting position.","Initiate the movement by shrugging your shoulders straight up. Do not flex the arms or wrist during the movement.","After a brief pause return the weight to the starting position.","Repeat for the desired number of repetitions before engaging the hooks to rack the weight."]},{id:"g-smith-machine-bent-over-row",name:"Smith Machine Bent Over Row",type:"compound_upper",pattern:"vertical_pull",primary:["lats"],secondary:["biceps","front_delts"],equipment:["smith","machine"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Set the barbell attached to the smith machine to a height that is about 2 inches below your knees.","Bend your knees slightly and bring your torso forward, by bending at the waist, while keeping the back straight until it is almost parallel to the floor. Tip: Make sure that you keep the head up.","Now grasp the barbell using an overhand (pronated) grip and unlock it from the smith machine rack. Then let it hang directly in front of you as your arms hang extended perpendicular to the floor and your torso. This is your starting position.","While keeping the torso stationary, lift the barbell as you breathe out, keeping the elbows close to the body and not doing any force with the forearm other than holding the weights. On the top contracted position, squeeze the back muscles and hold for a second.","Slowly lower the weight again to the starting position as you inhale.","Repeat for the recommended amount of repetitions."]},{id:"g-smith-machine-calf-raise",name:"Smith Machine Calf Raise",type:"isolation_lower",pattern:"vertical_pull",primary:["calves"],secondary:[],equipment:["smith","machine"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Place a block or weight plate below the bar on the Smith machine. Set the bar to a position that best matches your height. Once the correct height is chosen and the bar is loaded, step onto the plates with the balls of your feet and place the bar on the back of your shoulders.","Take the bar with both hands facing forward. Rotate the bar to unrack it. This will be your starting position.","Raise your heels as high as possible by pushing off of the balls of your feet, flexing your calf at the top of the contraction. Your knees should remain extended. Hold the contracted position for a second before you start to go back down.","Return slowly to the starting position as you breathe in while lowering your heels.","Repeat for the recommended amount of repetitions."]},{id:"g-smith-machine-close-grip-bench-press",name:"Smith Machine Close-Grip Bench Press",type:"compound_upper",pattern:"vertical_pull",primary:["triceps"],secondary:["chest","front_delts"],equipment:["smith","bench","machine"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Place a flat bench underneath the smith machine. Place the barbell at a height that you can reach when lying down and your arms are almost fully extended. Once the weight you need is selected, lie down on the flat bench. Using a close and pronated grip (palms facing forward) that is around shoulder width, unlock the bar from the rack and hold it straight over you with your arms locked. This will be your starting position.","As you breathe in, come down slowly until you feel the bar on your middle chest. Tip: Make sure that as opposed to a regular bench press, you keep the elbows close to the torso at all times in order to maximize triceps involvement.","After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your triceps muscles. Lock your arms in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up.","Repeat the movement for the prescribed amount of repetitions.","When you are done, lock the bar back in the rack."]},{id:"g-smith-machine-decline-press",name:"Smith Machine Decline Press",type:"compound_upper",pattern:"vertical_pull",primary:["chest"],secondary:["front_delts","triceps"],equipment:["smith","bench","machine"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Position a decline bench in the rack so that the bar will be above your chest. Load an appropriate weight and take your place on the bench.","Rotate the bar to unhook it from the rack and fully extend your arms. Your back should be slightly arched and your shoulder blades retracted. This will be your starting position.","Begin the movement by flexing your arms, lowering the bar to your chest.","Pause briefly, and then extend your arms to push the weight back to the starting position.","After completing the desired number of repetitions, rotate the bar to rack the weight."]},{id:"g-smith-machine-hang-power-clean",name:"Smith Machine Hang Power Clean",type:"compound_lower",pattern:"hinge",primary:["hamstrings"],secondary:["glutes","lats","quads","front_delts"],equipment:["smith","machine"],laterality:"bilateral",bw:0,metric:"time",steps:["Position the bar at knee height and load it to an appropriate weight.","Take a pronated grip on the bar outside of shoulder width and unhook the bar from the machine. Your arms should be fully extended with your head and chest up. Your elbows should be pointed out with your shoulders back and down. Your hips should be back, loading the tension into the hamstrings. This will be your starting position.","Initate the movement by forcefully extending the hips and knees, accelerating into the bar. Ensure that you keep your arms straight during this part of the motion.","Upon full extension, rebend the hips and knees to lower your receiving position.","Allow the arms to flex at this point, rotating the elbows around the bar to receive it on your shoulders.","Extend through the hips and knees to come to a standing position with the bar racked on your shoulders to complete the movement."]},{id:"g-smith-machine-hip-raise",name:"Smith Machine Hip Raise",type:"core",pattern:"vertical_pull",primary:["abs"],secondary:[],equipment:["smith","machine"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Position a bench in the rack and load the bar to an appropriate weight. Lie down on the bench, placing the bottom of your feet against the bar. Unlock the bar and extend your legs. You may need to use your hands to assist you. For added stability grasp the sides of the Smith Machine. This will be your starting position.","Initiate the movement by rotating your pelvis, flexing your spine to raise your hips off of the bench. Maintain a slight bend in the knees throughout the motion.","After a brief pause, return the hips to the bench.","Repeat for the desired number of repetitions."]},{id:"e-smith-machine-hip-thrust",name:"Smith Machine Hip Thrust",type:"compound_lower",pattern:"hinge",primary:["glutes"],secondary:["hamstrings"],equipment:["smith","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-smith-machine-incline-bench-press",name:"Smith Machine Incline Bench Press",type:"compound_upper",pattern:"vertical_pull",primary:["chest"],secondary:["front_delts","triceps"],equipment:["smith","bench","machine"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Place an incline bench underneath the smith machine. Place the barbell at a height that you can reach when lying down and your arms are almost fully extended. Once the weight you need is selected, lie down on the incline bench and make sure your upper chest is aligned with the barbell. Using a pronated grip (palms facing forward) that is wider than shoulder width, unlock the bar from the rack and hold it straight over you with your arms locked. This will be your starting position.","As you breathe in, come down slowly until you feel the bar on your upper chest.","After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up.","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the bar back in the rack."]},{id:"g-smith-machine-leg-press",name:"Smith Machine Leg Press",type:"compound_lower",pattern:"vertical_pull",primary:["quads"],secondary:["calves","glutes","hamstrings"],equipment:["smith","machine"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Position a Smith machine bar a couple feet off of the ground. Ensure that it is resting on the safeties. After loading the bar to an appropriate weight, lie underneath the bar. Place the middle of your feet on the bar, tucking your knees to your chest. This will be your starting position.","Begin the movement by driving through your feet to move the bar upward, extending the hips and knees. Do not lock out your knees.","At the top of the motion, pause briefly before returning to the starting position."]},{id:"g-smith-machine-one-arm-upright-row",name:"Smith Machine One-Arm Upright Row",type:"compound_upper",pattern:"vertical_pull",primary:["side_delts"],secondary:["biceps","lats"],equipment:["smith","machine"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["With the bar at thigh level, load an appropriate weight.","Take a wide grip on the bar and unhook the weight, removing your off hand from the bar. Your arm should be extended as you stand up straight with your head and chest up. This will be your starting position.","Begin the movement by flexing the elbow, raising the upper arm with the elbow pointed out. Continue until your upper arm is parallel to the floor.","After a brief pause, return the weight to the starting position.","Repeat for the desired number of repetitions before engaging the hooks to rack the weight."]},{id:"g-smith-machine-overhead-shoulder-press",name:"Smith Machine Overhead Shoulder Press",type:"compound_upper",pattern:"vertical_pull",primary:["front_delts"],secondary:["triceps"],equipment:["smith","machine"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["To begin, place a flat bench (or preferably one with back support) underneath a smith machine. Position the barbell at a height so that when seated on the flat bench, the arms must be almost fully extended to reach the barbell.","Once you have the correct height, sit slightly in behind the barbell so that there is an imaginary straight line from the tip of your nose to the barbell. Your feet should be stationary. Grab the barbell with the palms facing forward, unlock it and lift it up so that your arms are fully extended. This is the starting position.","Slowly begin to lower the barbell until it is level with your chin while inhaling.","Then lift the barbell back to the starting position using your shoulders while exhaling.","Repeat for the recommended amount of repetitions."]},{id:"g-smith-machine-pistol-squat",name:"Smith Machine Pistol Squat",type:"compound_lower",pattern:"squat",primary:["quads"],secondary:["calves","glutes","hamstrings"],equipment:["smith","machine"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["To begin, first set the bar to a position that best matches your height. Step under it and position the bar across the back of your shoulders.","Take the bar with your hands facing forward, unlock it and lift it off the rack by extending your legs. 3","Move one foot forward about 12 inches in front of the bar. Extend the other leg out in front of you, holding it off the ground. Look forward at all times and maintain a neutral or slightly arched spine. This will be your starting position.","Maintaining good posture, lower yourself by flexing the knee and hip, going down as far as flexibility allows.","Pause briefly at the bottom and then return to the starting position by driving through the heel of your foot, extending the knee and hip."]},{id:"g-smith-machine-reverse-calf-raises",name:"Smith Machine Reverse Calf Raises",type:"isolation_lower",pattern:"vertical_pull",primary:["calves"],secondary:[],equipment:["smith","machine"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Adjust the barbell on the smith machine to fit your height and align a raised platform right under the bar.","Stand on the platform with the heels of your feet secured on top of it with the balls of your feet extending off it. Position your toes facing forward with a shoulder width stance.","Now, place your shoulders under the barbell while maintaining the foot positioning described and push the barbell up by extending your hips and knees until your torso is standing erect. The knees should be kept with a slight bend; never locked. This will be your starting position. Tip: The barbell on your back is only for balance purposes.","Raise the balls of your feet as you breathe out by extending your toes as high as possible and flexing your calf. Ensure that the knee is kept stationary at all times. There should be no bending at any time. Hold the contracted position for a second before you start to go back down.","Slowly go back down to the starting position as you breathe in by lowering the balls of your feet and toes.","Repeat for the recommended amount of repetitions."]},{id:"e-smith-machine-shoulder-press",name:"Smith Machine Shoulder Press",type:"compound_upper",pattern:"vertical_push",primary:["front_delts"],secondary:["triceps"],equipment:["smith","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-smith-machine-shrug",name:"Smith Machine Shrug",type:"isolation_upper",pattern:"isolation",primary:["traps"],secondary:[],equipment:["smith"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-smith-machine-split-squat",name:"Smith Machine Split Squat",type:"compound_lower",pattern:"lunge",primary:["quads","glutes"],secondary:[],equipment:["smith"],laterality:"unilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-smith-machine-stiff-legged-deadlift",name:"Smith Machine Stiff-Legged Deadlift",type:"compound_lower",pattern:"hinge",primary:["hamstrings"],secondary:["glutes","lower_back"],equipment:["smith","machine"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["To begin, set the bar on the smith machine to a height that is around the middle of your thighs. Once the correct height is chosen and the bar is loaded, grasp the bar using a pronated (palms forward) grip that is shoulder width apart. You may need some wrist wraps if using a significant amount of weight.","Lift the bar up by fully extending your arms while keeping your back straight. Stand with your torso straight and your legs spaced using a shoulder width or narrower stance. The knees should be slightly bent. This is your starting position.","Keeping the knees stationary, lower the barbell to over the top of your feet by bending at the waist while keeping your back straight. Keep moving forward as if you were going to pick something from the floor until you feel a stretch on the hamstrings. Exhale as you perform this movement","Start bringing your torso up straight again as soon as you feel the hamstrings stretch by extending your hips and waist until you are back at the starting position. Inhale as you perform this movement.","Repeat for the recommended amount of repetitions."]},{id:"g-smith-machine-upright-row",name:"Smith Machine Upright Row",type:"compound_upper",pattern:"vertical_pull",primary:["lats"],secondary:["biceps","side_delts"],equipment:["smith","machine"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["To begin, set the bar on the smith machine to a height that is around the middle of your thighs. Once the correct height is chosen and the bar is loaded, grasp the bar using a pronated (palms forward) grip that is shoulder width apart. You may need some wrist wraps if using a significant amount of weight.","Lift the barbell up and fully extend your arms with your back straight. There should be a slight bend at the elbows. This is the starting position.","Use your side shoulders to lift the bar as you exhale. The bar should be close to the body as you move it up. Continue to lift it until it nearly touches your chin. Tip: Your elbows should drive the motion. As you lift the bar, your elbows should always be higher than your forearms. Also, keep your torso stationary and pause for a second at the top of the movement.","Lower the bar back down slowly to the starting position. Inhale as you perform this portion of the movement.","Repeat for the recommended amount of repetitions."]},{id:"g-smith-single-leg-split-squat",name:"Smith Single-Leg Split Squat",type:"compound_lower",pattern:"lunge",primary:["quads"],secondary:["calves","glutes","hamstrings"],equipment:["smith"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["To begin, place a flat bench 2-3 feet behind the smith machine. Then, set the bar on the height that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.","Hold on to the bar using both arms at each side (palms facing forward), unlock it and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Position your legs by placing one foot slightly forward under the bar and extending your other leg back and place the top of your foot on the bench. This will be your starting position","Begin to slowly lower the bar by bending the knee as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calf becomes slightly less than 90-degrees (which is the point in which the upper legs are below parallel to the floor). Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knee should make an imaginary straight line with the toes that is perpendicular to the front. If your knee is past that imaginary line (if it is past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise the bar as you exhale by pushing the floor with the heel of your foot mainly as you straighten your leg again and go back to the starting position.","Repeat for the recommended amount of repetitions.","Switch legs and repeat the movement."]},{id:"g-snatch-pull",name:"Snatch Pull",type:"compound_lower",pattern:"hinge",primary:["hamstrings"],secondary:["calves","glutes","upper_back","quads"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["With a barbell on the floor close to the shins, take a wide snatch grip. Lower your hips with the weight focused on the heels, back straight, head facing forward, chest up, with your shoulders just in front of the bar. This will be your starting position.","Begin the first pull by driving through the heels, extending your knees. Your back angle should stay the same, and your arms should remain straight. Move the weight with control as you continue to above the knees.","Next comes the second pull, the main source of acceleration for the pull. As the bar approaches the mid-thigh position, begin extending through the hips. In a jumping motion, accelerate by extending the hips, knees, and ankles, using speed to move the bar upward.","There should be no need to actively pull through the arms to accelerate the weight; at the end of the second pull, the body should be fully extended, leaning slightly back. Full extension should be violent and abrupt, and ensure that you do not prolong the extension for longer than necessary."]},{id:"e-snatch-grip-deadlift",name:"Snatch-Grip Deadlift",type:"compound_lower",pattern:"hinge",primary:["hamstrings","upper_back"],secondary:["glutes","traps"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-speed-band-overhead-triceps",name:"Speed Band Overhead Triceps",type:"isolation_upper",pattern:"isolation",primary:["triceps"],secondary:[],equipment:["band"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["For this exercise anchor a band to the ground. We used an incline bench and anchored the band to the base, standing over the bench. Alternatively, this could be performed standing on the band.","To begin, pull the band behind your head, holding it with a pronated grip and your elbows up. This will be your starting position.","To perform the movement, extend through the elbow to to straighten your arms, ensuring that you keep your upper arm in place.","Pause, and then return to the starting position."]},{id:"g-speed-box-squat",name:"Speed Box Squat",type:"compound_lower",pattern:"squat",primary:["quads"],secondary:["calves","glutes","hamstrings"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Attach bands to the bar that are securely anchored near the ground. You may need to choke the bands to get adequate tension.","Use a box of an appropriate height for this exercise. Load the bar to a weight that still requires effort, but isn't so heavy that speed is compromised. Typically, that will be between 50-70% of your one rep max.","Position the bar on your upper back, shoulder blades retracted, back arched and everything tight head to toe. This will be the starting position.","Unrack the bar and position yourself in front of the box. Sit back with your hips until you are seated on the box, ensuring that you descend under control and don't crash onto the surface.","Pause briefly, and explode off of the box, extending through the hips and knees."]},{id:"g-spell-caster",name:"Spell Caster",type:"core",pattern:"core",primary:["abs"],secondary:["glutes","front_delts"],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Hold a dumbbell in each hand with a pronated grip. Your feet should be wide with your hips and knees extended. This will be your starting position.","Begin the movement by pulling both of the dumbbells to one side next to your hip, rotating your torso.","Keeping your arms straight and the dumbbells parallel to the ground, rotate your torso to swing the weights to your opposite side.","Continue alternating, rotating from one side to the other until the set is complete."]},{id:"g-spider-crawl",name:"Spider Crawl",type:"core",pattern:"core",primary:["abs"],secondary:["chest","front_delts","triceps"],equipment:["bodyweight"],laterality:"bilateral",bw:.6,metric:"weight_reps",steps:["Begin in a prone position on the floor. Support your weight on your hands and toes, with your feet together and your body straight. Your arms should be bent to 90 degrees. This will be your starting position.","Initiate the movement by raising one foot off of the ground. Externally rotate the leg and bring the knee toward your elbow, as far forward as possible.","Return this leg to the starting position and repeat on the opposite side."]},{id:"g-spider-curl",name:"Spider Curl",type:"isolation_upper",pattern:"isolation",primary:["biceps"],secondary:[],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Start out by setting the bar on the part of the preacher bench that you would normally sit on. Make sure to align the barbell properly so that it is balanced and will not fall off.","Move to the front side of the preacher bench (the part where the arms usually lay) and position yourself to lay at a 45 degree slant with your torso and stomach pressed against the front side of the preacher bench.","Make sure that your feet (especially the toes) are well positioned on the floor and place your upper arms on top of the pad located on the inside part of the preacher bench.","Use your arms to grab the barbell with a supinated grip (palms facing up) at about shoulder width apart or slightly closer from each other.","Slowly begin to lift the barbell upwards and exhale. Hold the contracted position for a second as you squeeze the biceps.","Slowly begin to bring the barbell back to the starting position as your breathe in. .","Repeat for the recommended amount of repetitions."]},{id:"e-split-jerk",name:"Split Jerk",type:"compound_upper",pattern:"vertical_push",primary:["front_delts"],secondary:["quads","triceps"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-split-squat-with-dumbbells",name:"Split Squat with Dumbbells",type:"compound_lower",pattern:"lunge",primary:["quads"],secondary:["glutes","hamstrings"],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Position yourself into a staggered stance with the rear foot elevated and front foot forward.","Hold a dumbbell in each hand, letting them hang at the sides. This will be your starting position.","Begin by descending, flexing your knee and hip to lower your body down. Maintain good posture througout the movement. Keep the front knee in line with the foot as you perform the exercise.","At the bottom of the movement, drive through the heel to extend the knee and hip to return to the starting position."]},{id:"e-spoto-press",name:"Spoto Press",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["triceps"],equipment:["barbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-squat-clean",name:"Squat Clean",type:"compound_lower",pattern:"squat",primary:["quads","glutes"],secondary:["traps"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-squat-with-bands",name:"Squat with Bands",type:"compound_lower",pattern:"squat",primary:["quads"],secondary:["calves","glutes","hamstrings","lats"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Set up the bands on the sleeves, secured to either band pegs, the rack, or dumbbells so that there is appropriate tension.","Begin by stepping under the bar and placing it across the back of the shoulders. Squeeze your shoulder blades together and rotate your elbows forward, attempting to bend the bar across your shoulders. Remove the bar from the rack, creating a tight arch in your lower back, and step back into position. Place your feet wide for more emphasis on the back, glutes, adductors, and hamstrings. Keep your head facing forward.","With your back, shoulders, and core tight, push your knees and butt out and you begin your descent. Sit back with your hips as much as possible. Ideally, your shins should be perpendicular to the ground. Lower bar position necessitates a greater torso lean to keep the bar over the heels. Continue until you break parallel, which is defined as the crease of the hip being in line with the top of the knee.","Keeping the weight on your heels and pushing your feet and knees out, drive upward as you lead the movement with your head. Continue upward, maintaining tightness head to toe, until you have returned to the starting position."]},{id:"g-squat-with-chains",name:"Squat with Chains",type:"compound_lower",pattern:"squat",primary:["quads"],secondary:["calves","glutes","hamstrings","lats"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["To set up the chains, begin by looping the leader chain over the sleeves of the bar. The heavy chain should be attached using a snap hook. Adjust the length of the lead chain so that a few links are still on the floor at the top of the movement.","Begin by stepping under the bar and placing it across the back of the shoulders. Squeeze your shoulder blades together and rotate your elbows forward, attempting to bend the bar across your shoulders. Remove the bar from the rack, creating a tight arch in your lower back, and step back into position. Place your feet wide for more emphasis on the back, glutes, adductors, and hamstrings. Keep your head facing forward.","With your back, shoulders, and core tight, push your knees and butt out and you begin your descent. Sit back with your hips as much as possible. Ideally, your shins should be perpendicular to the ground. Lower bar position necessitates a greater torso lean to keep the bar over the heels. Continue until you break parallel, which is defined as the crease of the hip being in line with the top of the knee.","Keeping the weight on your heels and pushing your feet and knees out, drive upward as you lead the movement with your head. Continue upward, maintaining tightness head to toe, until you have returned to the starting position."]},{id:"g-squat-with-plate-movers",name:"Squat with Plate Movers",type:"compound_lower",pattern:"squat",primary:["quads"],secondary:["calves","glutes","hamstrings"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["To begin, first set the bar on a rack to just below shoulder level. Position a weight plate on the ground a couple feet back from the rack. Once the bar is loaded, step under it and place the back of your shoulders across it.","Hold on to the bar with both hands and lift it off the rack by first pushing with your legs and at the same time straighten your torso.","Step away from the rack and adopt a wide stance with the toes slightly pointed out, with one foot on the weight plate. Keep your head up at all times. This will be your starting position.","Begin to slowly lower the bar by bending the knees and hips. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees.","Raise the bar as you exhale by pushing the floor with the heels of your feet as you extend the hips and knees.","At the top of the movement, side step, bringing your feet together on the opposite side of the plate.","Using your inside foot, push the weight plate, sliding it across the floor to where you were just standing.","Place your inside foot on the weight plate, adopting a wide stance for the next repetition."]},{id:"e-stair-climber",name:"Stair Climber",type:"cardio",pattern:"lunge",primary:["glutes","quads"],secondary:["calves"],equipment:["machine"],laterality:"bilateral",bw:0,metric:"time",aliases:["stairmaster","stair master"]},{id:"g-standing-alternating-dumbbell-press",name:"Standing Alternating Dumbbell Press",type:"compound_upper",pattern:"horizontal_push",primary:["front_delts"],secondary:["triceps"],equipment:["dumbbell"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["Stand with a dumbbell in each hand. Raise the dumbbells to your shoulders with your palms facing forward and your elbows pointed out. This will be your starting position.","Extend one arm to press the dumbbell straight up, keeping your off hand in place. Do not lean or jerk the weight during the movement.","After a brief pause, return the weight to the starting position.","Repeat for the opposite side, continuing to alternate between arms."]},{id:"g-standing-barbell-calf-raise",name:"Standing Barbell Calf Raise",type:"isolation_lower",pattern:"isolation",primary:["calves"],secondary:[],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place the bar on the back of your shoulders (slightly below the neck).","Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance and also maintain a straight back. The knees should be kept with a slight bend; never locked. This will be your starting position. Tip: For better range of motion you may also place the ball of your feet on a wooden block but be careful as this option requires more balance and a sturdy block.","Raise your heels as you breathe out by extending your ankles as high as possible and flexing your calf. Ensure that the knee is kept stationary at all times. There should be no bending at any time. Hold the contracted position by a second before you start to go back down.","Go back slowly to the starting position as you breathe in by lowering your heels as you bend the ankles until calves are stretched.","Repeat for the recommended amount of repetitions."]},{id:"g-standing-barbell-press-behind-neck",name:"Standing Barbell Press behind Neck",type:"compound_upper",pattern:"horizontal_push",primary:["front_delts"],secondary:["triceps"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["This exercise is best performed inside a squat rack for easier pick up of the bar. To begin, first set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.","Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Your back should be kept straight while performing this exercise. This will be your starting position.","Elevate the barbell overhead by fully extending your arms while breathing out.","Hold the contraction for a second and lower the barbell back down to the starting position by inhaling.","Repeat for the recommended amount of repetitions."]},{id:"g-standing-bent-over-one-arm-dumbbell-triceps-extension",name:"Standing Bent-Over One-Arm Dumbbell Triceps Extension",type:"isolation_upper",pattern:"isolation",primary:["triceps"],secondary:["front_delts"],equipment:["dumbbell"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["With a dumbbell in one hand and the palm facing your torso, bend your knees slightly and bring your torso forward, by bending at the waist, while keeping the back straight until it is almost parallel to the floor. Make sure that you keep the head up.","The upper arm should be close to the torso and parallel to the floor while the forearm is pointing towards the floor as the hand holds the weight. Tip: There should be a 90-degree angle between the forearm and the upper arm. This is your starting position.","Keeping the upper arms stationary, use the triceps to lift the weights as you exhale until the forearms are parallel to the floor and the whole arm is extended. Like many other arm exercises, only the forearm moves.","After a second contraction at the top, slowly lower the dumbbell back to the starting position as you inhale.","Repeat the movement for the prescribed amount of repetitions.","Switch arms and repeat the exercise."]},{id:"g-standing-bent-over-two-arm-dumbbell-triceps-extension",name:"Standing Bent-Over Two-Arm Dumbbell Triceps Extension",type:"isolation_upper",pattern:"isolation",primary:["triceps"],secondary:[],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["With a dumbbell in each hand and the palms facing your torso, bend your knees slightly and bring your torso forward, by bending at the waist, while keeping the back straight until it is almost parallel to the floor. Make sure that you keep the head up. The upper arms should be close to the torso and parallel to the floor while the forearms are pointing towards the floor as the hands hold the weights. Tip: There should be a 90-degree angle between the forearms and the upper arm. This is your starting position.","Keeping the upper arms stationary, use the triceps to lift the weights as you exhale until the forearms are parallel to the floor and the whole arms are extended. Like many other arm exercises, only the forearm moves.","After a second contraction at the top, slowly lower the dumbbells back to their starting position as you inhale.","Repeat the movement for the prescribed amount of repetitions."]},{id:"g-standing-bradford-press",name:"Standing Bradford Press",type:"compound_upper",pattern:"horizontal_push",primary:["front_delts"],secondary:["triceps"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Place a loaded bar at shoulder level in a rack. With a pronated grip at shoulder width, begin with the bar racked across the front of your shoulders. This is your starting position.","Initiate the lift by extending the elbows to press the bar overhead. Avoid locking out the elbow as you move the weight behind your head.","Lower the bar down to the back of the head until your elbow forms a right angle.","Lift the bar back over your head by extending the elbows","Lower the bar down to the starting position.","Alternate in this manner until you complete the recommended amount of repetitions."]},{id:"g-standing-cable-chest-press",name:"Standing Cable Chest Press",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["front_delts","triceps"],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Position dual pulleys to chest height and select an appropriate weight. Stand a foot or two in front of the cables, holding one in each hand. You can stagger your stance for better stability.","Position the upper arm at a 90 degree angle with the shoulder blades together. This will be your starting position.","Keeping the rest of the body stationary, extend through the elbows to press the handles forward, drawing them together in front of you.","Pause at the top of the motion, and return to the starting position."]},{id:"g-standing-cable-lift",name:"Standing Cable Lift",type:"core",pattern:"core",primary:["obliques"],secondary:["front_delts"],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Connect a standard handle on a tower, and move the cable to the lowest pulley position.","With your side to the cable, grab the handle with one hand and step away from the tower. You should be approximately arm's length away from the pulley, with the tension of the weight on the cable. Your outstretched arm should be aligned with the cable.","With your feet positioned shoulder width apart, squat down and grab the handle with both hands. Your arms should still be fully extended.","In one motion, pull the handle up and across your body until your arms are in a fully-extended position above your head.","Keep your back straight and your arms close to your body as you pivot your back foot and straighten your legs to get a full range of motion.","Retract your arms and then your body. Return to the neutral position in a slow and controlled manner.","Repeat to failure.","Then, reposition and repeat the same series of movements on the opposite side."]},{id:"g-standing-cable-wood-chop",name:"Standing Cable Wood Chop",type:"core",pattern:"core",primary:["obliques"],secondary:["front_delts"],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Connect a standard handle to a tower, and move the cable to the highest pulley position.","With your side to the cable, grab the handle with one hand and step away from the tower. You should be approximately arm's length away from the pulley, with the tension of the weight on the cable. Your outstretched arm should be aligned with the cable.","With your feet positioned shoulder width apart, reach upward with your other hand and grab the handle with both hands. Your arms should still be fully extended.","In one motion, pull the handle down and across your body to your front knee while rotating your torso.","Keep your back and arms straight and core tight while you pivot your back foot and bend your knees to get a full range of motion.","Maintain your stance and straight arms. Return to the neutral position in a slow and controlled manner.","Repeat to failure.","Then, reposition and repeat the same series of movements on the opposite side."]},{id:"g-standing-concentration-curl",name:"Standing Concentration Curl",type:"isolation_upper",pattern:"isolation",primary:["biceps"],secondary:[],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Taking a dumbbell in your working hand, lean forward. Allow your working arm to hang perpendicular to the ground with the elbow pointing out. This will be your starting position.","Flex the elbow to curl the weight, keeping the upper arm stationary. At the top of the repetition, flex the biceps and pause.","Lower the dumbbell back to the starting position.","Repeat the movement for the prescribed amount of repetitions."]},{id:"g-standing-dumbbell-press",name:"Standing Dumbbell Press",type:"compound_upper",pattern:"horizontal_push",primary:["front_delts"],secondary:["triceps"],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Standing with your feet shoulder width apart, take a dumbbell in each hand. Raise the dumbbells to head height, the elbows out and about 90 degrees. This will be your starting position.","Maintaining strict technique with no leg drive or leaning back, extend through the elbow to raise the weights together directly above your head.","Pause, and slowly return the weight to the starting position."]},{id:"g-standing-dumbbell-reverse-curl",name:"Standing Dumbbell Reverse Curl",type:"isolation_upper",pattern:"isolation",primary:["forearms"],secondary:[],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["To begin, stand straight with a dumbbell in each hand using a pronated grip (palms facing down). Your arms should be fully extended while your feet are shoulder width apart from each other. This is the starting position.","While holding the upper arms stationary, curl the weights while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a second as you squeeze the muscle.","Slowly begin to bring the dumbbells back to starting position as your breathe in.","Repeat for the recommended amount of repetitions."]},{id:"g-standing-dumbbell-straight-arm-front-delt-raise-above-head",name:"Standing Dumbbell Straight-Arm Front Delt Raise Above Head",type:"isolation_upper",pattern:"isolation",primary:["front_delts"],secondary:[],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Hold the dumbbells in front of your thighs, palms facing your thighs.","Keep your arms straight with a slight bend at the elbows but keep them locked. This will be your starting position.","Raise the dumbbells in a semicircular motion to arm's length overhead as you exhale.","Slowly return to the starting position using the same path as you inhale.","Repeat for the recommended amount of repetitions."]},{id:"g-standing-dumbbell-upright-row",name:"Standing Dumbbell Upright Row",type:"compound_upper",pattern:"horizontal_push",primary:["upper_back"],secondary:["biceps","side_delts","lats"],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Grasp a dumbbell in each hand with a pronated (palms forward) grip that is slightly less than shoulder width. The dumbbells should be resting on top of your thighs. Your arms should be extended with a slight bend at the elbows and your back should be straight. This will be your starting position.","Use your side shoulders to lift the dumbbells as you exhale. The dumbbells should be close to the body as you move it up and the elbows should drive the motion. Continue to lift them until they nearly touch your chin. Tip: Your elbows should drive the motion. As you lift the dumbbells, your elbows should always be higher than your forearms. Also, keep your torso stationary and pause for a second at the top of the movement.","Lower the dumbbells back down slowly to the starting position. Inhale as you perform this portion of the movement.","Repeat for the recommended amount of repetitions."]},{id:"g-standing-front-barbell-raise-over-head",name:"Standing Front Barbell Raise Over Head",type:"isolation_upper",pattern:"isolation",primary:["front_delts"],secondary:[],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["To begin, stand straight with a barbell in your hands. You should grip the bar with palms facing down and a closer than shoulder width grip apart from each other.","Your feet should be shoulder width apart from each other. Your elbows should be slightly bent. This is the starting position.","Lift the barbell up until it is directly over your head while exhaling. Make sure to keep your elbows slightly bent when performing each repetition.","Once you feel the contraction, begin to lower the barbell back down to the starting position as you inhale.","Repeat for the recommended amount of repetitions."]},{id:"g-standing-inner-biceps-curl",name:"Standing Inner-Biceps Curl",type:"isolation_upper",pattern:"isolation",primary:["biceps"],secondary:[],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Stand up with a dumbbell in each hand being held at arms length. The elbows should be close to the torso. Your legs should be at about shoulder's width apart from each other.","Rotate the palms of the hands so that they are facing inward in a neutral position. This will be your starting position.","While holding the upper arms stationary, curl the weights out while contracting the biceps as you breathe out. Your wrist should turn so that when the weights are fully elevated you have supinated grip (palms facing up).","Only the forearms should move. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level. Tip: Keep the forearms aligned with your outer deltoids.","Hold the contracted position for a second as you squeeze the biceps.","Slowly begin to bring the dumbbells back to the starting position as your breathe in. Remember to rotate the wrists as you lower the weight in order to switch back to a neutral grip.","Repeat for the recommended amount of repetitions."]},{id:"g-standing-leg-curl",name:"Standing Leg Curl",type:"isolation_lower",pattern:"isolation",primary:["hamstrings"],secondary:[],equipment:["machine"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Adjust the machine lever to fit your height and lie with your torso bent at the waist facing forward around 30-45 degrees (since an angled position is more favorable for hamstrings recruitment) with the pad of the lever on the back of your right leg (just a few inches under the calves) and the front of the right leg on top of the machine pad.","Keeping the torso bent forward, ensure your leg is fully stretched and grab the side handles of the machine. Position your toes straight. This will be your starting position.","As you exhale, curl your right leg up as far as possible without lifting the upper leg from the pad. Once you hit the fully contracted position, hold it for a second.","As you inhale, bring the legs back to the initial position. Repeat for the recommended amount of repetitions.","Perform the same exercise now for the left leg."]},{id:"g-standing-low-pulley-deltoid-raise",name:"Standing Low-Pulley Deltoid Raise",type:"isolation_upper",pattern:"isolation",primary:["side_delts"],secondary:[],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Start by standing to the right side of a low pulley row. Use your left hand to come across the body and grab a single handle attached to the low pulley with a pronated grip (palms facing down). Rest your arm in front of you. Your right hand should grab the machine for better support and balance.","Make sure that your back is erect and your feet are shoulder width apart from each other. This is the starting position.","Begin to use the left hand and come across your body out until it is elevated to shoulder height while exhaling.","Feel the contraction at the top for a second and begin to slowly lower the handle back down to the original starting position while inhaling.","Repeat for the recommended amount of repetitions.","Switch arms and repeat the exercise."]},{id:"g-standing-low-pulley-one-arm-triceps-extension",name:"Standing Low-Pulley One-Arm Triceps Extension",type:"isolation_upper",pattern:"isolation",primary:["triceps"],secondary:["chest","front_delts"],equipment:["cable"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["Grab a single handle with your left arm next to the low pulley machine. Turn away from the machine keeping the handle to the side of your body with your arm fully extended. Now use both hands to elevate the single handle directly above the head with the palm facing forward. Keep your upper arm completely vertical (perpendicular to the floor) and put your right hand on your left elbow to help keep it steady. This is the starting position.","Keeping your upper arms close to your head (elbows in) and perpendicular to the floor, lower the resistance in a semicircular motion behind your head until your forearms touch your biceps. Tip: The upper arms should remain stationary and only the forearms should move. Breathe in as you perform this step.","Go back to the starting position by using the triceps to raise the single handle. Breathe out as you perform this step.","Repeat for the recommended amount of repetitions.","Switch arms and repeat the exercise."]},{id:"g-standing-military-press",name:"Standing Military Press",type:"compound_upper",pattern:"vertical_push",primary:["front_delts"],secondary:["triceps"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Start by placing a barbell that is about chest high on a squat rack. Once you have selected the weights, grab the barbell using a pronated (palms facing forward) grip. Make sure to grip the bar wider than shoulder width apart from each other.","Slightly bend the knees and place the barbell on your collar bone. Lift the barbell up keeping it lying on your chest. Take a step back and position your feet shoulder width apart from each other.","Once you pick up the barbell with the correct grip length, lift the bar up over your head by locking your arms. Hold at about shoulder level and slightly in front of your head. This is your starting position.","Lower the bar down to the collarbone slowly as you inhale.","Lift the bar back up to the starting position as you exhale.","Repeat for the recommended amount of repetitions."]},{id:"g-standing-one-arm-cable-curl",name:"Standing One-Arm Cable Curl",type:"isolation_upper",pattern:"isolation",primary:["biceps"],secondary:[],equipment:["cable"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["Start out by grabbing single handle next to the low pulley machine. Make sure you are far enough from the machine so that your arm is supporting the weight.","Make sure that your upper arm is stationary, perpendicular to the floor with elbows in and palms facing forward. Your non lifting arm should be grabbing your waist. This will allow you to keep your balance.","Slowly begin to curl the single handle upwards while keeping the upper arm stationary until your forearm touches your bicep while exhaling. Tip: Only the forearm should move.","Hold the contraction position as you squeeze the bicep and then lower the single handle back down to the starting position as you inhale.","Repeat for the recommended amount of repetitions.","Switch arms while performing this exercise."]},{id:"g-standing-one-arm-dumbbell-curl-over-incline-bench",name:"Standing One-Arm Dumbbell Curl Over Incline Bench",type:"isolation_upper",pattern:"isolation",primary:["biceps"],secondary:[],equipment:["dumbbell","bench"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["Stand on the back side of an incline bench as if you were going to be a spotter for someone. Have a dumbbell in one hand and rest it across the incline bench with a supinated (palms up) grip.","Position your non lifting hand at the corner or side of the incline bench. The chest should be pressed against the top part of the incline and your feet should be pressed against the floor at a wide stance. This is the starting position.","While holding the upper arm stationary, curl the dumbbell upward while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the dumbbell is at shoulder level. Hold the contracted position for a second.","Slowly begin to bring the dumbbells back to starting position as your breathe in.","Repeat for the recommended amount of repetitions.","Switch arms while performing this exercise."]},{id:"g-standing-one-arm-dumbbell-triceps-extension",name:"Standing One-Arm Dumbbell Triceps Extension",type:"isolation_upper",pattern:"isolation",primary:["triceps"],secondary:["chest","front_delts"],equipment:["dumbbell"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["To begin, stand up with a dumbbell held in one hand. Your feet should be about shoulder width apart from each other. Now fully extend the arm with the dumbbell over your head. Tip: The small finger of your hand should be facing the ceiling and the palm of your hand should be facing forward. The dumbbell should be above your head.","This will be your starting position.","Keeping your upper arm close to your head (elbows in) and perpendicular to the floor, lower the resistance in a semicircular motion behind your head until your forearm touch your bicep. Tip: The upper arm should remain stationary and only the forearm should move. Breathe in as you perform this step.","Go back to the starting position by using the triceps to raise the dumbbell. Breathe out as you perform this step.","Repeat for the recommended amount of repetitions.","Switch arms and repeat the exercise."]},{id:"g-standing-overhead-barbell-triceps-extension",name:"Standing Overhead Barbell Triceps Extension",type:"isolation_upper",pattern:"isolation",primary:["triceps"],secondary:["front_delts"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["To begin, stand up holding a barbell or e-z bar using a pronated grip (palms facing forward) with your hands closer than shoulder width apart from each other. Your feet should be about shoulder width apart.","Now elevate the barbell above your head until your arms are fully extended. Keep your elbows in. This will be your starting position.","Keeping your upper arms close to your head and elbows in, perpendicular to the floor, lower the resistance in a semicircular motion behind your head until your forearms touch your biceps. Tip: The upper arms should remain stationary and only the forearms should move. Breathe in as you perform this step.","Go back to the starting position by using the triceps to raise the barbell. Breathe out as you perform this step.","Repeat for the recommended amount of repetitions."]},{id:"g-standing-palm-in-one-arm-dumbbell-press",name:"Standing Palm-In One-Arm Dumbbell Press",type:"compound_upper",pattern:"horizontal_push",primary:["front_delts"],secondary:["triceps"],equipment:["dumbbell"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["Start by having a dumbbell in one hand with your arm fully extended to the side using a neutral grip. Use your other arm to hold on to an incline bench to keep your balance.","Your feet should be shoulder width apart from each other. Now slowly lift the dumbbell up until you create a 90 degree angle with your arm. Note: Your forearm should be perpendicular to the floor. Continue to maintain a neutral grip throughout the entire exercise.","Slowly lift the dumbbell up until your arm is fully extended. This the starting position.","While inhaling lower the weight down until your arm is at a 90 degree angle again.","Feel the contraction for a second and then lift the weight back up towards the starting position while exhaling. Remember to hold on to the incline bench and keep your feet positioned to keep balance during the exercise.","Repeat for the recommended amount of repetitions.","Switch arms and repeat the exercise."]},{id:"g-standing-palms-in-dumbbell-press",name:"Standing Palms-In Dumbbell Press",type:"compound_upper",pattern:"horizontal_push",primary:["front_delts"],secondary:["triceps"],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Start by having a dumbbell in each hand with your arm fully extended to the side using a neutral grip. Your feet should be shoulder width apart from each other. Now slowly lift the dumbbells up until you create a 90 degree angle with your arms. Note: Your forearms should be perpendicular to the floor. This the starting position.","Continue to maintain a neutral grip throughout the entire exercise. Slowly lift the dumbbells up until your arms are fully extended.","While inhaling lower the weights down until your arm is at a 90 degree angle again.","Repeat for the recommended amount of repetitions."]},{id:"g-standing-rope-crunch",name:"Standing Rope Crunch",type:"core",pattern:"core",primary:["abs"],secondary:[],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Attach a rope to a high pulley and select an appropriate weight.","Stand with your back to the cable tower. Take the rope with both
