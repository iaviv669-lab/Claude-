aise",name:"Lying One-Arm Lateral Raise",type:"isolation_upper",pattern:"isolation",primary:["side_delts"],secondary:[],equipment:["dumbbell"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["While holding a dumbbell in one hand, lay with your chest down on a flat bench. The other hand can be used to hold to the leg of the bench for stability.","Position the palm of the hand that is holding the dumbbell in a neutral manner (palms facing your torso) as you keep the arm extended with the elbow slightly bent. This will be your starting position.","Now raise the arm with the dumbbell to the side until your elbow is at shoulder height and your arm is roughly parallel to the floor as you exhale. Tip: Maintain your arm perpendicular to the torso while keeping your arm extended throughout the movement. Also, keep the contraction at the top for a second.","Slowly lower the dumbbell to the starting position as you inhale.","Repeat for the recommended amount of repetitions."]},{id:"g-lying-rear-delt-raise",name:"Lying Rear Delt Raise",type:"isolation_upper",pattern:"isolation",primary:["rear_delts"],secondary:[],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["While holding a dumbbell in each hand, lay with your chest down on a flat bench.","Position the palms of the hands in a neutral manner (palms facing your torso) as you keep the arms extended with the elbows slightly bent. This will be your starting position.","Now raise the arms to the side until your elbows are at shoulder height and your arms are roughly parallel to the floor as you exhale. Tip: Maintain your arms perpendicular to the torso while keeping them extended throughout the movement. Also, keep the contraction at the top for a second.","Slowly lower the dumbbells to the starting position as you inhale.","Repeat for the recommended amount of repetitions and then switch to the other arm."]},{id:"g-lying-supine-dumbbell-curl",name:"Lying Supine Dumbbell Curl",type:"isolation_upper",pattern:"isolation",primary:["biceps"],secondary:[],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Lie down on a flat bench face up while holding a dumbbell in each arm on top of your thighs.","Bring the dumbbells to the sides with the arms extended and the palms of the hands facing your thighs (neutral grip).","While keeping the arms close to your torso and elbows in, slowly lower your arms (as you keep them extended with a slight bend at the elbows) as far down towards the floor as you can go. Once you cannot go down any further, lock your upper arms in that position and that will be your starting position.","As you breathe out, slowly begin to curl the weights up as you simultaneously rotate your wrists so that the palms of the hands face up. Continue curling the weight until your biceps are fully contracted and squeeze hard at the top position for a second. Tip: Only the forearms should move. Upper arms should remain stationary and elbows should stay in throughout the movement.","Return back to the starting position very slowly."]},{id:"g-lying-triceps-press",name:"Lying Triceps Press",type:"isolation_upper",pattern:"horizontal_push",primary:["triceps"],secondary:[],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Lie on a flat bench with either an e-z bar (my preference) or a straight bar placed on the floor behind your head and your feet on the floor.","Grab the bar behind you, using a medium overhand (pronated) grip, and raise the bar in front of you at arms length. Tip: The arms should be perpendicular to the torso and the floor. The elbows should be tucked in. This is the starting position.","As you breathe in, slowly lower the weight until the bar lightly touches your forehead while keeping the upper arms and elbows stationary.","At that point, use the triceps to bring the weight back up to the starting position as you breathe out.","Repeat for the recommended amount of repetitions."]},{id:"g-machine-bench-press",name:"Machine Bench Press",type:"compound_upper",pattern:"vertical_pull",primary:["chest"],secondary:["front_delts","triceps"],equipment:["machine"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Sit down on the Chest Press Machine and select the weight.","Step on the lever provided by the machine since it will help you to bring the handles forward so that you can grab the handles and fully extend the arms.","Grab the handles with a palms-down grip and lift your elbows so that your upper arms are parallel to the floor to the sides of your torso. Tip: Your forearms will be pointing forward since you are grabbing the handles. Once you bring the handles forward and extend the arms you will be at the starting position.","Now bring the handles back towards you as you breathe in.","Push the handles away from you as you flex your pecs and you breathe out. Hold the contraction for a second before going back to the starting position.","Repeat for the recommended amount of reps.","When finished step on the lever again and slowly get the handles back to their original place."]},{id:"e-machine-bicep-curl",name:"Machine Bicep Curl",type:"isolation_upper",pattern:"isolation",primary:["biceps"],secondary:[],equipment:["machine"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-machine-rear-delt-row",name:"Machine Rear Delt Row",type:"isolation_upper",pattern:"horizontal_pull",primary:["rear_delts"],secondary:["upper_back"],equipment:["machine"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-machine-triceps-extension",name:"Machine Triceps Extension",type:"isolation_upper",pattern:"isolation",primary:["triceps"],secondary:[],equipment:["machine"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-meadows-row",name:"Meadows Row",type:"compound_upper",pattern:"horizontal_pull",primary:["lats","upper_back"],secondary:["rear_delts","biceps"],equipment:["barbell"],laterality:"unilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-medicine-ball-slam",name:"Medicine Ball Slam",type:"core",pattern:"core",primary:["abs"],secondary:["lats","front_delts"],equipment:["bodyweight"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-middle-back-shrug",name:"Middle Back Shrug",type:"isolation_upper",pattern:"isolation",primary:["traps"],secondary:[],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Lie facedown on an incline bench while holding a dumbbell in each hand. Your arms should be fully extended hanging down and pointing towards the floor. The palms of your hands should be facing each other. This will be your starting position.","As you exhale, squeeze your shoulder blades together and hold the contraction for a full second. Tip: This movement is just like the reverse action of a hug, or trying to perform rear laterals as if you had no arms.","As you inhale go back to the starting position.","Repeat for the recommended amount of repetitions."]},{id:"e-mountain-climber",name:"Mountain Climber",type:"core",pattern:"core",primary:["abs"],secondary:["front_delts","quads"],equipment:["bodyweight"],laterality:"bilateral",bw:0,metric:"time",aliases:[]},{id:"e-muscle-up",name:"Muscle-Up",type:"compound_upper",pattern:"vertical_pull",primary:["lats"],secondary:["triceps","chest"],equipment:["pullup_bar"],laterality:"bilateral",bw:1,metric:"weight_reps",aliases:[]},{id:"g-narrow-stance-leg-press",name:"Narrow Stance Leg Press",type:"compound_lower",pattern:"horizontal_pull",primary:["quads"],secondary:["calves","glutes","hamstrings"],equipment:["machine"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Using a leg press machine, sit down on the machine and place your legs on the platform directly in front of you at a less-than-shoulder-width narrow stance with the toes slightly pointed out. Your feet should be around 3 inches or less apart. Tip: Keep your head up at all times and also maintain the back on the pad at all times.","Lower the safety bars holding the weighted platform in place and press the platform all the way up until your legs are fully extended in front of you. Tip: Make sure that you do not lock your knees. Your torso and the legs should make a perfect 90-degree angle. This will be your starting position.","As you inhale, slowly lower the platform until your upper and lower legs make a 90-degree angle.","Pushing mainly with the heels of your feet and using the quadriceps go back to the starting position as you exhale.","Repeat for the recommended amount of repetitions and ensure to lock the safety pins properly once you are done. You do not want that platform falling on you fully loaded."]},{id:"g-narrow-stance-squats",name:"Narrow Stance Squats",type:"compound_lower",pattern:"squat",primary:["quads"],secondary:["calves","glutes","hamstrings","upper_back"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.","Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a less-than-shoulder-width narrow stance with the toes slightly pointed out. Feet should be around 3-6 inches apart. Keep your head up at all times (looking down will get you off balance) and maintain a straight back. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances discussed in the foot stances section).","Begin to slowly lower the bar by bending the knees as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees (which is the point in which the upper legs are below parallel to the floor). Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise the bar as you exhale by pushing the floor with the heel of your foot mainly as you straighten the legs again and go back to the starting position.","Repeat for the recommended amount of repetitions."]},{id:"g-natural-glute-ham-raise",name:"Natural Glute Ham Raise",type:"compound_lower",pattern:"hinge",primary:["hamstrings"],secondary:["calves","glutes","lats"],equipment:["bodyweight"],laterality:"bilateral",bw:.6,metric:"weight_reps",steps:["Using the leg pad of a lat pulldown machine or a preacher bench, position yourself so that your ankles are under the pads, knees on the seat, and you are facing away from the machine. You should be upright and maintaining good posture.","This will be your starting position. Lower yourself under control until your knees are almost completely straight.","Remaining in control, raise yourself back up to the starting position.","If you are unable to complete a rep, use a band, a partner, or push off of a box to aid in completing a repetition."]},{id:"g-neck-press",name:"Neck Press",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["front_delts","triceps"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Lie back on a flat bench. Using a medium-width grip (a grip that creates a 90-degree angle in the middle of the movement between the forearms and the upper arms), lift the bar from the rack and hold it straight over your neck with your arms locked. This will be your starting position.","As you breathe in, come down slowly until you feel the bar on your neck.","After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms and squeeze your chest in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up).","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the bar back in the rack."]},{id:"e-neutral-grip-lat-pulldown",name:"Neutral-Grip Lat Pulldown",type:"compound_upper",pattern:"vertical_pull",primary:["lats"],secondary:["biceps"],equipment:["cable","machine"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-neutral-grip-pull-up",name:"Neutral-Grip Pull-Up",type:"compound_upper",pattern:"vertical_pull",primary:["lats"],secondary:["biceps"],equipment:["pullup_bar"],laterality:"bilateral",bw:1,metric:"weight_reps",aliases:[]},{id:"g-oblique-crunches",name:"Oblique Crunches",type:"core",pattern:"core",primary:["obliques"],secondary:[],equipment:["bodyweight"],laterality:"bilateral",bw:.3,metric:"weight_reps",steps:["Lie flat on the floor with your lower back pressed to the ground. For this exercise, you will need to put one hand beside your head and the other to the side against the floor.","Make sure your feet are elevated and resting on a flat surface.","Now lift the shoulder in which your hand is touching your head.","Simply elevate your shoulder and body upward until you touch your knee. For example, if you have your right hand besides your head, then you want to elevate your body upwards until your right elbow touches your left knee. The same variation can be applied doing the inverse and using your left elbow to touch your right knee.","After your knee touches your elbow, lower your body until you have reached the starting position.","Remember to breathe in during the eccentric (lowering) part of the exercise and to breathe out during the concentric (upward) part of the exercise.","Continue alternating in this manner until all of the recommended repetitions for each side have been completed."]},{id:"g-oblique-crunches-on-the-floor",name:"Oblique Crunches - on the Floor",type:"core",pattern:"core",primary:["obliques"],secondary:[],equipment:["bodyweight"],laterality:"bilateral",bw:.3,metric:"weight_reps",steps:["Start out by lying on your right side with your legs lying on top of each other. Make sure your knees are bent a little bit.","Place your left hand behind your head.","Once you are in this set position, begin by moving your left elbow up as you would perform a normal crunch except this time the main emphasis is on your obliques.","Crunch as high as you can, hold the contraction for a second and then slowly drop back down into the starting position.","Remember to breathe in during the eccentric (lowering) part of the exercise and to breathe out during the concentric (elevation) part of the exercise."]},{id:"g-one-arm-dumbbell-bench-press",name:"One Arm Dumbbell Bench Press",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["front_delts","triceps"],equipment:["dumbbell","bench"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["Lie down on a flat bench with a dumbbell in one hand on top of your thigh.","By using your thigh to help you get the dumbbell up, clean the dumbbell up so that you can hold it in front of you at shoulder width. Use the hand you are not lifting with to help position the dumbbell over you properly.","Once at shoulder width, rotate your wrist forward so that the palm of your hand is facing away from you. This will be your starting position.","Bring down the weights slowly to your side as you breathe in. Keep full control of the dumbbell at all times. Tip: Use the hand that you are not lifting with to help keep the dumbbell balance as you may struggle a bit at first. Only use your non-lifting hand if it is needed. Otherwise, keep it resting to the side.","As you breathe out, push the dumbbells up using your pectoral muscles. Lock your arms in the contracted position, squeeze your chest, hold for a second and then start coming down slowly. Tip: It should take at least twice as long to go down than to come up.","Repeat the movement for the prescribed amount of repetitions of your training program.","Switch arms and repeat the movement."]},{id:"g-one-arm-dumbbell-preacher-curl",name:"One Arm Dumbbell Preacher Curl",type:"isolation_upper",pattern:"isolation",primary:["biceps"],secondary:[],equipment:["dumbbell"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["Grab a dumbbell with the right arm and place the upper arm on top of the preacher bench or the incline bench. The dumbbell should be held at shoulder length. This will be your starting position.","As you breathe in, slowly lower the dumbbell until your upper arm is extended and the biceps is fully stretched.","As you exhale, use the biceps to curl the weight up until your biceps is fully contracted and the dumbbell is at shoulder height. Again, remember that to ensure full contraction you need to bring that small finger higher than the thumb.","Squeeze the biceps hard for a second at the contracted position and repeat for the recommended amount of repetitions.","Switch arms and repeat the movement."]},{id:"g-one-arm-floor-press",name:"One Arm Floor Press",type:"compound_upper",pattern:"horizontal_push",primary:["triceps"],secondary:["chest","front_delts"],equipment:["barbell"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["Lie down on a flat surface with your back pressing against the floor or an exercise mat. Make sure your knees are bent.","Have a partner hand you the bar on one hand. When starting, your arm should be just about fully extended, similar to the starting position of a barbell bench press. However, this time your grip will be neutral (palms facing your torso).","Make sure the hand you are not using to lift the weight is placed by your side.","Begin the exercise by lowering the barbell until your elbow touches the ground. Make sure to breathe in as this is the eccentric (lowering part of the exercise).","Then start lifting the barbell back up to the original starting position. Remember to breathe out during the concentric (lifting part of the exercise).","Repeat until you have performed your recommended repetitions.","Switch arms and repeat the movement."]},{id:"g-one-arm-lat-pulldown",name:"One Arm Lat Pulldown",type:"compound_upper",pattern:"vertical_pull",primary:["lats"],secondary:["biceps"],equipment:["machine","cable"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["Select an appropriate weight and adjust the knee pad to help keep you down. Grasp the handle with a pronated grip. This will be your starting position.","Pull the handle down, squeezing your elbow to your side as you flex the elbow.","Pause at the bottom of the motion, and then slowly return the handle to the starting position.","For multiple repetitions, avoid completely returning the weight to keep tension on the muscles being worked."]},{id:"g-one-arm-pronated-dumbbell-triceps-extension",name:"One Arm Pronated Dumbbell Triceps Extension",type:"isolation_upper",pattern:"isolation",primary:["triceps"],secondary:[],equipment:["dumbbell"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["Lie flat on a bench while holding a dumbbell at arms length. Your arm should be perpendicular to your body. The palm of your hand should be facing towards your feet as a pronated grip is required to perform this exercise.","Place your non lifting hand on your bicep for support.","Slowly begin to lower the dumbbell down as you breathe in.","Then, begin lifting the dumbbell upward as you contract the triceps. Remember to breathe out during the concentric (lifting part of the exercise).","Repeat until you have performed your set repetitions.","Switch arms and repeat the movement."]},{id:"g-one-arm-supinated-dumbbell-triceps-extension",name:"One Arm Supinated Dumbbell Triceps Extension",type:"isolation_upper",pattern:"isolation",primary:["triceps"],secondary:[],equipment:["dumbbell"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["Lie flat on a bench while holding a dumbbell at arms length. Your arm should be perpendicular to your body. The palm of your hand should be facing towards your face as a supinated grip is required to perform this exercise.","Place your non lifting hand on your bicep for support.","Slowly begin to lower the dumbbell down as you breathe in.","Then, begin lifting the dumbbell upward as you contract the triceps. Remember to breathe out during the concentric (lifting part of the exercise).","Repeat until you have performed your set repetitions.","Switch arms and repeat the movement.","Switch arms again and repeat the movement."]},{id:"g-one-arm-flat-bench-dumbbell-flye",name:"One-Arm Flat Bench Dumbbell Flye",type:"isolation_upper",pattern:"isolation",primary:["chest"],secondary:[],equipment:["dumbbell","bench"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["Lie down on a flat bench with a dumbbell in one hand resting on top of your thigh. The palm of your hand with the dumbbell in it should be at a neutral grip.","By using your thighs to help you get the dumbbell up, clean the dumbbell so that you can hold it in front of you with your lifting arm being fully extended. Remember to maintain a neutral grip with this exercise. Your non lifting hand should be to the side holding the flat bench for better support. This will be your starting position.","Your arm with the weight should have a slight bend on your elbow in order to prevent stress at the biceps tendon. Begin by lowering your arm with the weight in it out in a wide arc until you feel a stretch on your chest. Breathe in as you perform this portion of the movement. Tip: Keep in mind that throughout the movement, your lifting arm should remain stationary; the movement should only occur at the shoulder joint.","Return your lifting arm back to the starting position as you squeeze your chest muscles and breathe out. Tip: Make sure to use the same arc of motion used to lower the weights.","Hold for a second at the contracted position and repeat the movement for the prescribed amount of repetitions.","Switch arms and repeat the exercise."]},{id:"g-one-arm-high-pulley-cable-side-bends",name:"One-Arm High-Pulley Cable Side Bends",type:"core",pattern:"core",primary:["obliques"],secondary:[],equipment:["cable"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["Connect a standard handle to a tower. Move cable to highest pulley position.","Stand with side to cable. With one hand, reach up and grab handle with underhand grip.","Pull down cable until elbow touches your side and the handle is by your shoulder.","Position feet hip-width apart. Place free hand on hip to help gauge pivot point.","Keep arm in static position. Contract oblique to bring the weight down in a side crunch.","Once you reach maximum contraction, slowly release the weight to the starting position. The weight stack should never be unloaded in a resting position. The aim is constant tension during the set.","Repeat to failure.","Then, reposition and repeat the same series of movements on the opposite side."]},{id:"g-one-arm-incline-lateral-raise",name:"One-Arm Incline Lateral Raise",type:"isolation_upper",pattern:"isolation",primary:["side_delts"],secondary:[],equipment:["dumbbell","bench"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["Lie down sideways on an incline bench press with a dumbbell in the hand. Make sure the shoulder is pressing against the incline bench and the arm is lying across your body with the palm around your navel.","Hold a dumbbell in your uppermost arm while keeping it extended in front of you parallel to the floor. This is your starting position.","While keeping the dumbbell parallel to the floor at all times, perform a lateral raise. Your arm should travel straight up until it is pointing at the ceiling. Tip: Exhale as you perform this movement. Hold the dumbbell in the position and feel the contraction in the shoulders for a second.","While inhaling lower the weight across your body back into the starting position.","Repeat the movement for the prescribed amount of repetitions.","Switch arms and repeat the movement."]},{id:"g-one-arm-kettlebell-clean",name:"One-Arm Kettlebell Clean",type:"compound_lower",pattern:"hinge",primary:["hamstrings"],secondary:["glutes","lats","front_delts"],equipment:["kettlebell"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["Place a kettlebell between your feet. As you bend down to grab the kettlebell, push your butt back and keep your eyes looking forward.","Clean the kettlebell to your shoulders by extending through the legs and hips as you raise the kettlebell towards your shoulder. The wrist should rotate as you do so.","Return the weight to the starting position."]},{id:"g-one-arm-kettlebell-clean-and-jerk",name:"One-Arm Kettlebell Clean and Jerk",type:"compound_upper",pattern:"hinge",primary:["front_delts"],secondary:[],equipment:["kettlebell"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["Hold a kettlebell by the handle.","Clean the kettlebell to your shoulder by extending through the legs and hips as you pull the kettlebell towards your shoulder. Rotate your wrist as you do so, so that the palm faces forward.","Dip your body by bending the knees, keeping your torso upright.","Immediately reverse direction, driving through the heels, in essence jumping to create momentum. As you do so, press the kettlebell overhead to lockout by extending the arms, using your body's momentum to move the weight.","Receive the weight overhead by returning to a squat position underneath the weight.","Keeping the weight overhead, return to a standing position. Lower the weight to the floor to perform the next repetition."]},{id:"g-one-arm-kettlebell-floor-press",name:"One-Arm Kettlebell Floor Press",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["triceps"],equipment:["kettlebell"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["Lie on the floor holding a kettlebell with one hand, with your upper arm supported by the floor. The palm should be facing in.","Press the kettlebell straight up toward the ceiling, rotating your wrist.","Lower the kettlebell back to the starting position and repeat."]},{id:"g-one-arm-kettlebell-jerk",name:"One-Arm Kettlebell Jerk",type:"compound_upper",pattern:"vertical_push",primary:["front_delts"],secondary:["calves","quads","triceps"],equipment:["kettlebell"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["Hold a kettlebell by the handle. Clean the kettlebell to your shoulder by extending through the legs and hips as you pull the kettlebell towards your shoulder. Rotate your wrist as you do so, so that the palm faces forward. This will be your starting position.","Dip your body by bending the knees, keeping your torso upright.","Immediately reverse direction, driving through the heels, in essence jumping to create momentum. As you do so, press the kettlebell overhead to lockout by extending the arms, using your body's momentum to move the weight. Receive the weight overhead by returning to a squat position underneath the weight. Keeping the weight overhead, return to a standing position.","Lower the weight to perform the next repetition."]},{id:"g-one-arm-kettlebell-military-press-to-the-side",name:"One-Arm Kettlebell Military Press to the Side",type:"compound_upper",pattern:"vertical_push",primary:["front_delts"],secondary:["triceps"],equipment:["kettlebell"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["Clean a kettlebell to your shoulder. Clean the kettlebell to your shoulder by extending through the legs and hips as you pull the kettlebell towards your shoulder. Rotate your wrist as you do so, so that the palm faces inward. This will be your starting position.","Look at the kettlebell and press it up and out until it is locked out overhead.","Lower the kettlebell back to your shoulder under control and repeat. Make sure to contract your lat, butt, and stomach forcefully for added stability and strength."]},{id:"g-one-arm-kettlebell-para-press",name:"One-Arm Kettlebell Para Press",type:"compound_upper",pattern:"horizontal_push",primary:["front_delts"],secondary:["triceps"],equipment:["kettlebell"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["Clean a kettlebell to your shoulder. Clean the kettlebell to your shoulder by extending through the legs and hips as you pull the kettlebell towards your shoulder. Rotate your wrist as you do so, so that the palm faces forward. This will be your starting position.","Hold the kettlebell with the elbow out to the side, and press it up and out until it is locked out overhead.","Lower the kettlebell back to your shoulder under control and repeat. Make sure to contract your lat, butt, and stomach forcefully for added stability and strength."]},{id:"g-one-arm-kettlebell-push-press",name:"One-Arm Kettlebell Push Press",type:"compound_upper",pattern:"vertical_push",primary:["front_delts"],secondary:["calves","quads","triceps"],equipment:["kettlebell"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["Hold a kettlebell by the handle. Clean the kettlebell to your shoulder by extending through the legs and hips as you pull the kettlebell towards your shoulder. Rotate your wrist as you do so, so that the palm faces forward. This will be your starting position.","Dip your body by bending the knees, keeping your torso upright.","Immediately reverse direction, driving through the heels, in essence jumping to create momentum. As you do so, press the kettlebell overhead to lockout by extending the arms, using your body's momentum to move the weight. Lower the weight to perform the next repetition."]},{id:"g-one-arm-kettlebell-row",name:"One-Arm Kettlebell Row",type:"compound_upper",pattern:"horizontal_pull",primary:["upper_back"],secondary:["biceps","lats"],equipment:["kettlebell"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["Place a kettlebell in front of your feet.","Bend your knees slightly and then push your butt out as much as possible as you bend over to get in the starting position.","Grab the kettlebell and pull it to your stomach, retracting your shoulder blade and flexing the elbow.","Keep your back straight.","Lower and repeat."]},{id:"g-one-arm-kettlebell-split-jerk",name:"One-Arm Kettlebell Split Jerk",type:"compound_upper",pattern:"lunge",primary:["front_delts"],secondary:["glutes","hamstrings","quads","triceps"],equipment:["kettlebell"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["Hold a kettlebell by the handle. Clean the kettlebell to your shoulder by extending through the legs and hips as you pull the kettlebell towards your shoulder. Rotate your wrist as you do so, so that the palm faces forward. This will be your starting position.","Dip your body by bending the knees, keeping your torso upright.","Immediately reverse direction, driving through the heels, in essence jumping to create momentum. As you do so, press the kettlebell overhead to lockout by extending the arms, using your body's momentum to move the weight.","Receive the weight overhead by returning to a squat position underneath the weight, positioning one leg in front of you and one leg behind you.","Keeping the weight overhead, return to a standing position and bring your feet together. Lower the weight to perform the next repetition."]},{id:"g-one-arm-long-bar-row",name:"One-Arm Long Bar Row",type:"compound_upper",pattern:"horizontal_pull",primary:["upper_back"],secondary:["biceps","lats"],equipment:["barbell"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["Position a bar into a landmine or in a corner to keep it from moving. Load an appropriate weight onto your end.","Stand next to the bar, and take a grip with one hand close to the collar. Using your hips and legs, rise to a standing position.","Assume a bent-knee stance with your hips back and your chest up. Your arm should be extended. This will be your starting position.","Pull the weight to your side by retracting the shoulder and flexing the elbow. Do not jerk the weight or cheat during the movement.","After a brief pause, return to the starting position."]},{id:"g-one-arm-open-palm-kettlebell-clean",name:"One-Arm Open Palm Kettlebell Clean",type:"compound_lower",pattern:"hinge",primary:["hamstrings"],secondary:["glutes","lats","quads","front_delts"],equipment:["kettlebell"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["Place one kettlebell between your feet.","Grab the handle with one hand and raise the kettlebell rapidly, let it flip so that the ball of the kettlebell lands in the palm of your hand.","Throw the kettlebell out in front of you and catch the handle with one hand.","Take the kettlebell to the floor and repeat. Make sure to work both arms."]},{id:"g-one-arm-side-laterals",name:"One-Arm Side Laterals",type:"isolation_upper",pattern:"isolation",primary:["side_delts"],secondary:[],equipment:["dumbbell"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["Pick a dumbbell and place it in one of your hands. Your non lifting hand should be used to grab something steady such as an incline bench press. Lean towards your lifting arm and away from the hand that is gripping the incline bench as this will allow you to keep your balance.","Stand with a straight torso and have the dumbbell by your side at arm's length with the palm of the hand facing you. This will be your starting position.","While maintaining the torso stationary (no swinging), lift the dumbbell to your side with a slight bend on the elbow and your hand slightly tilted forward as if pouring water in a glass. Continue to go up until you arm is parallel to the floor. Exhale as you execute this movement and pause for a second at the top.","Lower the dumbbell back down slowly to the starting position as you inhale.","Repeat for the recommended amount of repetitions.","Switch arms and repeat the exercise."]},{id:"e-outdoor-run",name:"Outdoor Run",type:"cardio",pattern:"carry",primary:["quads","calves"],secondary:["hamstrings","glutes"],equipment:["bodyweight"],laterality:"bilateral",bw:0,metric:"time",aliases:["jog","running"]},{id:"g-overhead-cable-curl",name:"Overhead Cable Curl",type:"isolation_upper",pattern:"isolation",primary:["biceps"],secondary:[],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["To begin, set a weight that is comfortable on each side of the pulley machine. Note: Make sure that the amount of weight selected is the same on each side.","Now adjust the height of the pulleys on each side and make sure that they are positioned at a height higher than that of your shoulders.","Stand in the middle of both sides and use an underhand grip (palms facing towards the ceiling) to grab each handle. Your arms should be fully extended and parallel to the floor with your feet positioned shoulder width apart from each other. Your body should be evenly aligned the handles. This is the starting position.","While exhaling, slowly squeeze the biceps on each side until your forearms and biceps touch.","While inhaling, move your forearms back to the starting position. Note: Your entire body is stationary during this exercise except for the forearms.","Repeat for the recommended amount of repetitions prescribed in your program."]},{id:"g-overhead-dumbbell-extension",name:"Overhead Dumbbell Extension",type:"isolation_upper",pattern:"isolation",primary:["triceps"],secondary:[],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["To begin, stand up with a dumbbell held by both hands. Your feet should be about shoulder width apart from each other. Slowly use both hands to grab the dumbbell and lift it over your head until both arms are fully extended.","The resistance should be resting in the palms of your hands with your thumbs around it. The palm of the hands should be facing up towards the ceiling. This will be your starting position.","Keeping your upper arms close to your head with elbows in and perpendicular to the floor, lower the resistance in a semicircular motion behind your head until your forearms touch your biceps. Tip: The upper arms should remain stationary and only the forearms should move. Breathe in as you perform this step.","Go back to the starting position by using the triceps to raise the dumbbell. Breathe out as you perform this step.","Repeat for the recommended amount of repetitions."]},{id:"e-overhead-squat",name:"Overhead Squat",type:"compound_lower",pattern:"squat",primary:["quads","glutes"],secondary:["front_delts","abs"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-pallof-press-with-rotation",name:"Pallof Press with Rotation",type:"core",pattern:"horizontal_push",primary:["obliques"],secondary:["chest","rear_delts","triceps"],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Connect a standard handle to a tower, and position the cable to shoulder height.","With your side to the cable, grab the handle with one hand and step away from the tower. You should be approximately arm's length away from the pulley, with the tension of the weight on the cable. Align outstretched arm with cable.","With your feet positioned hip-width apart, pull the cable into your chest and grab the handle with your other hand. Both hands should be on the handle at this time.","Facing forward, press the cable away from your chest. You core should be tight and engaged.","Keeping your hips straight, twist your torso away from the pulley until you get a full quarter rotation.","Maintain your rigid stance and straight arms. Return to the neutral position in a slow and controlled manner. Your arms should be extended in front of you.","With the side tension still engaging your core, bring your hands to your chest and immediately press outward to a fully extended position. This constitutes one rep.","Repeat to failure.","Then, reposition and repeat the same series of movements on the opposite side."]},{id:"e-pause-squat",name:"Pause Squat",type:"compound_lower",pattern:"squat",primary:["quads","glutes"],secondary:["adductors"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-pec-deck-fly",name:"Pec Deck Fly",type:"isolation_upper",pattern:"isolation",primary:["chest"],secondary:[],equipment:["machine"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Sit on the machine with your back flat on the pad.","Take hold of the handles. Tip: Your upper arms should be positioned parallel to the floor; adjust the machine accordingly. This will be your starting position.","Push the handles together slowly as you squeeze your chest in the middle. Breathe out during this part of the motion and hold the contraction for a second.","Return back to the starting position slowly as you inhale until your chest muscles are fully stretched.","Repeat for the recommended amount of repetitions."]},{id:"e-pendlay-row",name:"Pendlay Row",type:"compound_upper",pattern:"horizontal_pull",primary:["upper_back","lats"],secondary:["rear_delts","lower_back"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-pendulum-squat",name:"Pendulum Squat",type:"compound_lower",pattern:"squat",primary:["quads"],secondary:["glutes"],equipment:["machine"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-pike-push-up",name:"Pike Push-up",type:"compound_upper",pattern:"vertical_push",primary:["front_delts"],secondary:["triceps"],equipment:["bodyweight"],laterality:"bilateral",bw:.65,metric:"weight_reps",steps:["Start in a push-up position, then walk your feet in and lift your hips high so your body forms an upside-down V.","Bend your elbows and lower the top of your head toward the floor between your hands.","Press back up until your arms are straight, keeping the hips high."]},{id:"g-pin-presses",name:"Pin Presses",type:"compound_upper",pattern:"horizontal_push",primary:["triceps"],secondary:["chest","lats","front_delts"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Pin presses remove the eccentric phase of the bench press, developing starting strength. They also allow you to train a desired range of motion.","The bench should be set up in a power rack. Set the pins to the desired point in your range of motion, whether it just be lockout or an inch off of your chest. The bar should be moved to the pins and prepared for lifting.","Begin by lying on the bench, with the bar directly above the contact point during your regular bench. Tuck your feet underneath you and arch your back. Using the bar to help support your weight, lift your shoulder off the bench and retract them, squeezing the shoulder blades together. Use your feet to drive your traps into the bench. Maintain this tight body position throughout the movement.","You can take a standard bench grip, or shoulder width to focus on the triceps. The bar, wrist, and elbow should stay in line at all times. Focus on squeezing the bar and trying to pull it apart.","Drive the bar up with as much force as possible. The elbows should be tucked in until lockout.","Return the bar to the pins, pausing before beginning the next repetition."]},{id:"e-pistol-squat",name:"Pistol Squat",type:"compound_lower",pattern:"squat",primary:["quads","glutes"],secondary:[],equipment:["bodyweight"],laterality:"unilateral",bw:1,metric:"weight_reps",aliases:[]},{id:"g-plie-dumbbell-squat",name:"Plie Dumbbell Squat",type:"compound_lower",pattern:"squat",primary:["quads"],secondary:["abs","calves","glutes","hamstrings"],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Hold a dumbbell at the base with both hands and stand straight up. Move your legs so that they are wider than shoulder width apart from each other with your knees slightly bent.","Your toes should be facing out. Note: Your arms should be stationary while performing the exercise. This is the starting position.","Slowly bend the knees and lower your legs until your thighs are parallel to the floor. Make sure to inhale as this is the eccentric part of the exercise.","Press mainly with the heel of the foot to bring the body back to the starting position while exhaling.","Repeat for the recommended amount of repetitions."]},{id:"g-power-clean",name:"Power Clean",type:"compound_lower",pattern:"hinge",primary:["hamstrings"],secondary:["calves","glutes","lats","quads","front_delts","triceps"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Stand with your feet slightly wider than shoulder width apart and toes pointing out slightly.","Squat down and grasp bar with a closed, pronated grip. Your hands should be slightly wider than shoulder width apart outside knees with elbows fully extended.","Place the bar about 1 inch in front of your shins and over the balls of your feet.","Your back should be flat or slightly arched, your chest held up and out and your shoulder blades should be retracted.","Keep your head in a neutral position (in line with vertebral column and not tilted or rotated) with your eyes focused straight ahead. Inhale during this phase.","Lift the bar from the floor by forcefully extending the hips and the knees as you exhale. Tip: The upper torso should maintain the same angle. Do not bend at the waist yet and do not let the hips rise before the shoulders (this would have the effect of pushing the glutes in the air and stretching the hamstrings.","Keep elbows fully extended with the head in a neutral position and the shoulders over the bar.","As the bar raises keep it as close to the shins as possible.","As the bar passes the knees, thrust your hips forward and slightly bend the knees to avoid locking them. Tip: At this point your thighs should be against the bar.","Keep the back flat or slightly arched, elbows fully extended and your head neutral. Tip: You will hold your breath until the next phase.","Inhale and then forcefully and quickly extend your hips and knees and stand on your toes.","Keep the bar as close to your body as possible. Tip: Your back should be flat with the elbows pointed out to the sides and your head in a neutral position. Also, keep your shoulders over the bar and arms straight as long as possible.","When your lower body joints are fully extended, shrug the shoulders upward rapidly without letting the elbows flex yet. Exhale during this portion of the movement.","As the shoulders reach their highest elevation flex your elbows to begin pulling your body under the bar.","Continue to pull the arms as high and as long as possible. Tip: Due to the explosive nature of this phase, your torso will be erect or with an arched back, your head will be tilted back slightly and your feet may lose contact with the floor.","After the lower body has fully extended and the bar reaches near maximal height, pull your body under the bar and rotate the arms around and under the bar.","Simultaneously, flex the hips and knees into a quarter squat position.","Once the arms are under the bar, inhale and then lift your elbows to position the upper arms parallel to the floor. Rack the bar across the front of your collar bones and front shoulder muscles.","Catch the bar with an erect and tight torso, a neutral head position and flat feet. Exhale during this movement.","Stand up by extending the hips and knees to a fully erect position.","Lower the bar by gradually reducing the muscular tension of the arms to allow a controlled descent of the bar to the thighs. Inhale during this movement.","Simultaneously flex the hips and knees to cushion the impact of the bar on the thighs.","Squat down with the elbows fully extended until the bar touches the floor.","Start over at Phase 1 and repeat for the recommended amount of repetitions."]},{id:"g-power-partials",name:"Power Partials",type:"isolation_upper",pattern:"isolation",primary:["front_delts"],secondary:[],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Stand up with your torso upright and a dumbbell on each hand being held at arms length. The elbows should be close to the torso.","The palms of the hands should be facing your torso. Your feet should be about shoulder width apart. This will be your starting position.","Keeping your arms straight and the torso stationary, lift the weights out to your sides until they are about shoulder level height while exhaling.","Feel the contraction for a second and begin to lower the weights back down to the starting position while inhaling. Tip: Keep the palms facing down with the little finger slightly higher while lifting and lowering the weights as it will concentrate the stress on your shoulders mainly.","Repeat for the recommended amount of repetitions."]},{id:"e-power-snatch",name:"Power Snatch",type:"compound_lower",pattern:"hinge",primary:["glutes","quads"],secondary:["traps","front_delts"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-preacher-hammer-dumbbell-curl",name:"Preacher Hammer Dumbbell Curl",type:"isolation_upper",pattern:"isolation",primary:["forearms"],secondary:[],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Place the upper part of both arms on top of the preacher bench as you hold a dumbbell in each hand with the palms facing each other (neutral grip).","As you breathe in, slowly lower the dumbbells until your upper arm is extended and the biceps is fully stretched.","As you exhale, use the biceps to curl the weight up until your biceps is fully contracted and the dumbbells are at shoulder height.","Squeeze the biceps hard for a second at the contracted position and repeat for the recommended amount of repetitions."]},{id:"e-prone-y-t-w-raise",name:"Prone Y-T-W Raise",type:"isolation_upper",pattern:"isolation",primary:["rear_delts","traps"],secondary:[],equipment:["dumbbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-pull-through",name:"Pull Through",type:"compound_lower",pattern:"hinge",primary:["glutes"],secondary:["hamstrings","upper_back"],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Begin standing a few feet in front of a low pulley with a rope or handle attached. Face away from the machine, straddling the cable, with your feet set wide apart.","Begin the movement by reaching through your legs as far as possible, bending at the hips. Keep your knees slightly bent. Keeping your arms straight, extend through the hip to stand straight up. Avoid pulling upward through the shoulders; all of the motion should originate through the hips."]},{id:"e-push-press",name:"Push Press",type:"compound_upper",pattern:"vertical_push",primary:["front_delts"],secondary:["triceps","quads"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-push-up-to-side-plank",name:"Push Up to Side Plank",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["obliques","front_delts","triceps"],equipment:["bodyweight"],laterality:"bilateral",bw:.65,metric:"time",steps:["Get into pushup position on the toes with your hands just outside of shoulder width.","Perform a pushup by allowing the elbows to flex. As you descend, keep your body straight.","Do one pushup and as you come up, shift your weight on the left side of the body, twist to the side while bringing the right arm up towards the ceiling in a side plank.","Lower the arm back to the floor for another pushup and then twist to the other side.","Repeat the series, alternating each side, for 10 or more reps."]},{id:"g-push-up-wide",name:"Push-Up Wide",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["abs","front_delts","triceps"],equipment:["bodyweight"],laterality:"bilateral",bw:.65,metric:"weight_reps",steps:["With your hands wide apart, support your body on your toes and hands in a plank position. Your elbows should be extended and your body straight. Do not allow your hips to sag. This will be your starting position.","To begin, allow the elbows to flex, lowering your chest to the floor as you inhale.","Using your pectoral muscles, press your upper body back up to the starting position by extending the elbows. Exhale as you perform this step.","After pausing at the contracted position, repeat the movement for the prescribed amount of repetitions."]},{id:"g-push-ups-with-feet-elevated",name:"Push-Ups with Feet Elevated",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["front_delts","triceps"],equipment:["bodyweight"],laterality:"bilateral",bw:.65,metric:"weight_reps",steps:["Lie on the floor face down and place your hands about 36 inches apart from each other holding your torso up at arms length.","Place your toes on top of a flat bench. This will allow your body to be elevated. Note: The higher the elevation of the flat bench, the higher the resistance of the exercise is.","Lower yourself until your chest almost touches the floor as you inhale.","Using your pectoral muscles, press your upper body back up to the starting position and squeeze your chest. Breathe out as you perform this step.","After a second pause at the contracted position, repeat the movement for the prescribed amount of repetitions."]},{id:"g-pushups-close-and-wide-hand-positions",name:"Pushups (Close and Wide Hand Positions)",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["front_delts","triceps"],equipment:["bodyweight"],laterality:"bilateral",bw:.65,metric:"weight_reps",steps:["Lie on the floor face down and body straight with your toes on the floor and the hands wider than shoulder width for a wide hand position and closer than shoulder width for a close hand position. Make sure you are holding your torso up at arms length.","Lower yourself until your chest almost touches the floor as you inhale.","Using your pectoral muscles, press your upper body back up to the starting position and squeeze your chest. Breathe out as you perform this step.","After a second pause at the contracted position, repeat the movement for the prescribed amount of repetitions."]},{id:"g-rack-pull-with-bands",name:"Rack Pull with Bands",type:"compound_upper",pattern:"horizontal_push",primary:["lower_back"],secondary:["glutes","hamstrings","quads"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Set up in a power rack with the bar on the pins. The pins should be set to the desired point; just below the knees, just above, or in the mid thigh position. Attach bands to the base of the rack, or secure them with dumbbells. Attach the other end to the bar. You may need to choke the bands to provide tension.","Position yourself against the bar in proper deadlifting position. Your feet should be under your hips, your grip shoulder width, back arched, and hips back to engage the hamstrings. Since the weight is typically heavy, you may use a mixed grip, a hook grip, or use straps to aid in holding the weight.","With your head looking forward, extend through the hips and knees, pulling the weight up and back until lockout. Be sure to pull your shoulders back as you complete the movement. Return the weight to the pins and repeat."]},{id:"g-rack-pulls",name:"Rack Pulls",type:"compound_upper",pattern:"horizontal_push",primary:["lower_back"],secondary:["glutes","hamstrings"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Set up in a power rack with the bar on the pins. The pins should be set to the desired point; just below the knees, just above, or in the mid thigh position. Position yourself against the bar in proper deadlifting position. Your feet should be under your hips, your grip shoulder width, back arched, and hips back to engage the hamstrings. Since the weight is typically heavy, you may use a mixed grip, a hook grip, or use straps to aid in holding the weight.","With your head looking forward, extend through the hips and knees, pulling the weight up and back until lockout. Be sure to pull your shoulders back as you complete the movement.","Return the weight to the pins and repeat."]},{id:"e-rear-delt-cable-fly",name:"Rear Delt Cable Fly",type:"isolation_upper",pattern:"isolation",primary:["rear_delts"],secondary:[],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-reverse-band-bench-press",name:"Reverse Band Bench Press",type:"compound_upper",pattern:"horizontal_push",primary:["triceps"],secondary:["chest","lats","front_delts"],equipment:["barbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Position a bench inside a power rack, with the bar set to the correct height. Begin by anchoring bands either to band pegs or to the top of the rack. Ensure that you will be position properly under the bands. Attach the other end to the barbell.","Lie on the bench, tuck your feet underneath you and arch your back. Using the bar to help support your weight, lift your shoulder off the bench and retract them, squeezing the shoulder blades together. Use your feet to drive your traps into the bench. Maintain this tight body position throughout the movement. However wide your grip, it should cover the ring on the bar.","Pull the bar out of the rack without protracting your shoulders. Focus on squeezing the bar and trying to pull it apart. Lower the bar to your lower chest or upper stomach. The bar, wrist, and elbow should stay in line at all times.","Pause when the barbell touches your torso, and then drive the bar up with as much force as possible. The elbows should be tucked in until lockout."]},{id:"g-reverse-band-box-squat",name:"Reverse Band Box Squat",type:"compound_lower",pattern:"squat",primary:["quads"],secondary:["calves","glutes","hamstrings","lats"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Begin in a power rack with a box at the appropriate height behind you. Set up the bands either on band pegs or attached to the top of the rack, ensuring they will be directly above the bar during the squat. Attach the other end to the bar.","Begin by stepping under the bar and placing it across the back of the shoulders. Squeeze your shoulder blades together and rotate your elbows forward, attempting to bend the bar across your shoulders. Remove the bar from the rack, creating a tight arch in your lower back, and step back into position. Place your feet wider for more emphasis on the back, glutes, adductors, and hamstrings, or closer together for more quad development. Keep your head facing forward.","With your back, shoulders, and core tight, push your knees and butt out and you begin your descent. Sit back with your hips until you are seated on the box. Ideally, your shins should be perpendicular to the ground. Pause when you reach the box, and relax the hip flexors. Never bounce off of a box.","Keeping the weight on your heels and pushing your feet and knees out, drive upward off of the box as you lead the movement with your head. Continue upward, maintaining tightness head to toe. Use care to return the barbell to the rack."]},{id:"g-reverse-barbell-curl",name:"Reverse Barbell Curl",type:"isolation_upper",pattern:"isolation",primary:["forearms"],secondary:[],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Stand up with your torso upright while holding a barbell at shoulder width with the elbows close to the torso. The palm of your hands should be facing down (pronated grip). This will be your starting position.","While holding the upper arms stationary, curl the weights while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second as you squeeze the muscle.","Slowly begin to bring the bar back to starting position as your breathe in.","Repeat for the recommended amount of repetitions."]},{id:"g-reverse-barbell-preacher-curls",name:"Reverse Barbell Preacher Curls",type:"isolation_upper",pattern:"isolation",primary:["forearms"],secondary:[],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Grab an EZ-bar using a shoulder width and palms down (pronated) grip.","Now place the upper part of both arms on top of the preacher bench and have your arms extended. This will be your starting position.","As you exhale, use the biceps to curl the weight up until your biceps are fully contracted and the barbell is at shoulder height. Squeeze the biceps hard for a second at the contracted position.","As you breathe in, slowly lower the barbell until your upper arms are extended and the biceps is fully stretched.","Repeat for the recommended amount of repetitions."]},{id:"g-reverse-cable-curl",name:"Reverse Cable Curl",type:"isolation_upper",pattern:"isolation",primary:["forearms"],secondary:[],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Stand up with your torso upright while holding a bar attachment that is attached to a low pulley using a pronated (palms down) and shoulder width grip. Make sure also that you keep the elbows close to the torso. This will be your starting position.","While holding the upper arms stationary, curl the weights while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second as you squeeze the muscle.","Slowly begin to bring the bar back to starting position as your breathe in.","Repeat for the recommended amount of repetitions."]},{id:"g-reverse-crunch",name:"Reverse Crunch",type:"core",pattern:"core",primary:["abs"],secondary:[],equipment:["bodyweight"],laterality:"bilateral",bw:.3,metric:"weight_reps",steps:["Lie down on the floor with your legs fully extended and arms to the side of your torso with the palms on the floor. Your arms should be stationary for the entire exercise.","Move your legs up so that your thighs are perpendicular to the floor and feet are together and parallel to the floor. This is the starting position.","While inhaling, move your legs towards the torso as you roll your pelvis backwards and you raise your hips off the floor. At the end of this movement your knees will be touching your chest.","Hold the contraction for a second and move your legs back to the starting position while exhaling.","Repeat for the recommended amount of repetitions."]},{id:"e-reverse-curl",name:"Reverse Curl",type:"isolation_upper",pattern:"isolation",primary:["forearms"],secondary:["biceps"],equipment:["barbell","ez_bar"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-reverse-flyes",name:"Reverse Flyes",type:"isolation_upper",pattern:"isolation",primary:["rear_delts"],secondary:[],equipment:["dumbbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["To begin, lie down on an incline bench with the chest and stomach pressing against the incline. Have the dumbbells in each hand with the palms facing each other (neutral grip).","Extend the arms in front of you so that they are perpendicular to the angle of the bench. The legs should be stationary while applying pressure with the ball of your toes. This is the starting position.","Maintaining the slight bend of the elbows, move the weights out and away from each other (to the side) in an arc motion while exhaling. Tip: Try to squeeze your shoulder blades together to get the best results from this exercise.","The arms should be elevated until they are parallel to the floor.","Feel the contraction and slowly lower the weights back down to the starting position while inhaling.","Repeat for the recommended amount of repetitions."]},{id:"g-reverse-flyes-with-external-rotation",name:"Reverse Flyes with External Rotation",type:"isolation_upper",pattern:"isolation",primary:["rear_delts"],secondary:[],equipment:["dumbbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["To begin, lie down on an incline bench set at a 30-degree angle with the chest and stomach pressing against the incline.","Have the dumbbells in each hand with the palms facing down to the floor. Your arms should be in front of you so that they are perpendicular to the angle of the bench. Tip: Your elbows should have a slight bend. The legs should be stationary while applying pressure with the ball of your toes (your heels should not be touching the floor). This is the starting position.","Maintaining the slight bend of the elbows, move the weights out and away from each other in an arc motion while exhaling.","As you lift the weight, your wrist should externally rotate by 90-degrees so that you go from a palms down (pronated) grip to a palms facing each other (neutral) grip. Tip: Try to squeeze your shoulder blades together to get the best results from this exercise.","The arms should be elevated until they are level with the head.","Feel the contraction and slowly lower the weights back down to the starting position while inhaling.","Repeat for the recommended amount of repetitions."]},{id:"g-reverse-grip-bent-over-rows",name:"Reverse Grip Bent-Over Rows",type:"compound_upper",pattern:"horizontal_pull",primary:["upper_back"],secondary:["forearms","front_delts","lats"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Stand erect while holding a barbell with a supinated grip (palms facing up).","Bend your knees slightly and bring your torso forward, by bending at the waist, while keeping the back straight until it is almost parallel to the floor. Tip: Make sure that you keep the head up. The barbell should hang directly in front of you as your arms hang perpendicular to the floor and your torso. This is your starting position.","While keeping the torso stationary, lift the barbell as you breathe out, keeping the elbows close to the body and not doing any force with the forearm other than holding the weights. On the top contracted position, squeeze the back muscles and hold for a second.","Slowly lower the weight again to the starting position as you inhale.","Repeat for the recommended amount of repetitions."]},{id:"g-reverse-grip-triceps-pushdown",name:"Reverse Grip Triceps Pushdown",type:"isolation_upper",pattern:"isolation",primary:["triceps"],secondary:[],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Start by setting a bar attachment (straight or e-z) on a high pulley machine.","Facing the bar attachment, grab it with the palms facing up (supinated grip) at shoulder width. Lower the bar by using your lats until your arms are fully extended by your sides. Tip: Elbows should be in by your sides and your feet should be shoulder width apart from each other. This is the starting position.","Slowly elevate the bar attachment up as you inhale so it is aligned with your chest. Only the forearms should move and the elbows/upper arms should be stationary by your side at all times.","Then begin to lower the cable bar back down to the original staring position while exhaling and contracting the triceps hard.","Repeat for the recommended amount of repetitions."]},{id:"e-reverse-hyperextension",name:"Reverse Hyperextension",type:"isolation_lower",pattern:"hinge",primary:["glutes","lower_back"],secondary:["hamstrings"],equipment:["machine"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-reverse-triceps-bench-press",name:"Reverse Triceps Bench Press",type:"compound_upper",pattern:"horizontal_push",primary:["triceps"],secondary:["chest","front_delts"],equipment:["barbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Lie back on a flat bench. Using a close, supinated grip (around shoulder width), lift the bar from the rack and hold it straight over you with your arms locked extended in front of you and perpendicular to the floor. This will be your starting position.","As you breathe in, come down slowly until you feel the bar on your middle chest. Tip: Make sure that as opposed to a regular bench press, you keep the elbows close to the torso at all times in order to maximize triceps involvement.","After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your triceps muscles. Lock your arms in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up.","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the bar back in the rack."]},{id:"e-reverse-wrist-curl",name:"Reverse Wrist Curl",type:"isolation_upper",pattern:"isolation",primary:["forearms"],secondary:[],equipment:["dumbbell","barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-ring-push-up",name:"Ring Push-Up",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["triceps","abs"],equipment:["bodyweight"],laterality:"bilateral",bw:.65,metric:"weight_reps",aliases:[]},{id:"g-rocking-standing-calf-raise",name:"Rocking Standing Calf Raise",type:"isolation_lower",pattern:"isolation",primary:["calves"],secondary:[],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place it on the back of your shoulders (slightly below the neck).","Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance. Also maintain a straight back and keep the knees with a slight bend; never locked. This will be your starting position.","Raise your heels as you breathe out by extending your ankles as high as possible and flexing your calf. Ensure that the knee is kept stationary at all times. There should be no bending (other than the slight initial bend we created during positioning) at any time. Hold the contracted position by a second before you start to go back down.","Go back slowly to the starting position as you breathe in by lowering your heels as you bend the ankles until calves are stretched.","Now lift your toes by contracting the tibia muscles in the front of the calves as you breathe out.","Hold for a second and bring them back down as you breathe in.","Repeat for the recommended amount of repetitions."]},{id:"g-rope-crunch",name:"Rope Crunch",type:"core",pattern:"core",primary:["abs"],secondary:[],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Kneel 1-2 feet in front of a cable system with a rope attached.","After selecting an appropriate weight, grasp the rope with both hands reaching overhead. Your torso should be upright in the starting position.","To begin, flex at the spine, attempting to bring your rib cage to your legs as you pull the cable down.","Pause at the bottom of the motion, and then slowly return to the starting position.","These can be done with twists or to the side to hit the obliques."]},{id:"e-rope-hammer-curl",name:"Rope Hammer Curl",type:"isolation_upper",pattern:"isolation",primary:["biceps","forearms"],secondary:[],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-rope-straight-arm-pulldown",name:"Rope Straight-Arm Pulldown",type:"isolation_upper",pattern:"vertical_pull",primary:["lats"],secondary:[],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Attach a rope to a high pulley and make your weight selection. Stand a couple feet back from the pulley with your feet staggered and take the rope with both hands. Lean forward from the hip, keeping your back straight, with your arms extended up in front of you. This will be your starting position.","Keeping your arms straight, extend the shoulder to pull the rope down to your thighs.","Pause at the bottom of the motion, squeezing your lats.","Return to the starting position without allowing the weight to fully rest on the stack."]},{id:"e-rowing-machine",name:"Rowing Machine",type:"cardio",pattern:"horizontal_pull",primary:["upper_back","quads"],secondary:["lats","hamstrings"],equipment:["machine"],laterality:"bilateral",bw:0,metric:"time",aliases:["erg","rower"]},{id:"e-safety-bar-squat",name:"Safety Bar Squat",type:"compound_lower",pattern:"squat",primary:["quads","glutes"],secondary:["upper_back"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:["ssb squat"]},{id:"e-sandbag-carry",name:"Sandbag Carry",type:"compound_lower",pattern:"carry",primary:["abs","upper_back"],secondary:["quads"],equipment:["bodyweight"],laterality:"bilateral",bw:0,metric:"time",aliases:[]},{id:"e-scapular-pull-up",name:"Scapular Pull-Up",type:"isolation_upper",pattern:"vertical_pull",primary:["lats","traps"],secondary:[],equipment:["pullup_bar"],laterality:"bilateral",bw:1,metric:"weight_reps",aliases:[]},{id:"e-seal-row",name:"Seal Row",type:"compound_upper",pattern:"horizontal_pull",primary:["upper_back","lats"],secondary:["rear_delts"],equipment:["barbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-seated-barbell-military-press",name:"Seated Barbell Military Press",type:"compound_upper",pattern:"vertical_push",primary:["front_delts"],secondary:["triceps"],equipment:["barbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Sit on a Military Press Bench with a bar behind your head and either have a spotter give you the bar (better on the rotator cuff this way) or pick it up yourself carefully with a pronated grip (palms facing forward). Tip: Your grip should be wider than shoulder width and it should create a 90-degree angle between the forearm and the upper arm as the barbell goes down.","Once you pick up the barbell with the correct grip length, lift the bar up over your head by locking your arms. Hold at about shoulder level and slightly in front of your head. This is your starting position.","Lower the bar down to the collarbone slowly as you inhale.","Lift the bar back up to the starting position as you exhale.","Repeat for the recommended amount of repetitions."]},{id:"g-seated-barbell-twist",name:"Seated Barbell Twist",type:"core",pattern:"core",primary:["obliques"],secondary:[],equipment:["barbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Start out by sitting at the end of a flat bench with a barbell placed on top of your thighs. Your feet should be shoulder width apart from each other.","Grip the bar with your palms facing down and make sure your hands are wider than shoulder width apart from each other. Begin to lift the barbell up over your head until your arms are fully extended.","Now lower the barbell behind your head until it is resting along the base of your neck. This is the starting position.","While keeping your feet and head stationary, move your waist from side to side so that your oblique muscles feel the contraction. Only move from side to side as far as your waist will allow you to go. Stretching or moving too far can cause an injury to occur. Tip: Use a slow and controlled motion.","Remember to breathe out while twisting your body to the side and in when moving back to the starting position.","Repeat for the recommended amount of repetitions."]},{id:"g-seated-bent-over-one-arm-dumbbell-triceps-extension",name:"Seated Bent-Over One-Arm Dumbbell Triceps Extension",type:"isolation_upper",pattern:"isolation",primary:["triceps"],secondary:[],equipment:["dumbbell","bench"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["Sit down at the end of a flat bench with a dumbbell in one arm using a neutral grip (palms of the hand facing you).","Bend your knees slightly and bring your torso forward, by bending at the waist, while keeping the back straight until it is almost parallel to the floor. Make sure that you keep the head up.","The upper arm with the dumbbell should be close to the torso and aligned with it (lifted up until it is parallel to the floor while the forearms are pointing towards the floor as the hands hold the weights). Tip: There should be a 90-degree angle between the forearms and the upper arm. This is your starting position.","Keeping the upper arm stationary, use the triceps to lift the weight as you exhale until the forearm is parallel to the floor and the whole arm is extended. Like many other arm exercises, only the forearm moves.","After a second contraction at the top, slowly lower the dumbbell back to the starting position as you inhale.","Repeat the movement for the prescribed amount of repetitions.","Switch arms and repeat the exercise."]},{id:"g-seated-bent-over-rear-delt-raise",name:"Seated Bent-Over Rear Delt Raise",type:"isolation_upper",pattern:"isolation",primary:["rear_delts"],secondary:[],equipment:["dumbbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Place a couple of dumbbells looking forward in front of a flat bench.","Sit on the end of the bench with your legs together and the dumbbells behind your calves.","Bend at the waist while keeping the back straight in order to pick up the dumbbells. The palms of your hands should be facing each other as you pick them. This will be your starting position.","Keeping your torso forward and stationary, and the arms slightly bent at the elbows, lift the dumbbells straight to the side until both arms are parallel to the floor. Exhale as you lift the weights. (Note: avoid swinging the torso or bringing the arms back as opposed to the side.)","After a one second contraction at the top, slowly lower the dumbbells back to the starting position.","Repeat for the recommended amount of repetitions."]},{id:"g-seated-bent-over-two-arm-dumbbell-triceps-extension",name:"Seated Bent-Over Two-Arm Dumbbell Triceps Extension",type:"isolation_upper",pattern:"isolation",primary:["triceps"],secondary:[],equipment:["dumbbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Sit down at the end of a flat bench with a dumbbell in both arms using a neutral grip (palms of the hand facing you).","Bend your knees slightly and bring your torso forward, by bending at the waist, while keeping the back straight until it is almost parallel to the floor. Make sure that you keep the head up.","The upper arms with the dumbbells should be close to the torso and aligned with it (lifted up until they are parallel to the floor while the forearms are pointing towards the floor as the hands hold the weights). Tip: There should be a 90-degree angle between the forearms and the upper arm. This is your starting position.","Keeping the upper arms stationary, use the triceps to lift the weight as you exhale until the forearms are parallel to the floor and the whole arm is extended. Like many other arm exercises, only the forearm moves.","After a second contraction at the top, slowly lower the dumbbells back to the starting position as you inhale.","Repeat the movement for the prescribed amount of repetitions."]},{id:"g-seated-cable-shoulder-press",name:"Seated Cable Shoulder Press",type:"compound_upper",pattern:"vertical_push",primary:["front_delts"],secondary:["triceps"],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Adjust the weight to an appropriate amount and be seated, grasping the handles. Your upper arms should be about 90 degrees to the body, with your head and chest up. The elbows should also be bent to about 90 degrees. This will be your starting position.","Begin by extending through the elbow, pressing the handles together above your head.","After pausing at the top, return the handles to the starting position. Ensure that you maintain tension on the cables.","You can also execute this movement with your back off the pad and alternate hands."]},{id:"g-seated-close-grip-concentration-barbell-curl",name:"Seated Close-Grip Concentration Barbell Curl",type:"isolation_upper",pattern:"isolation",primary:["biceps"],secondary:[],equipment:["barbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Sit down on a flat bench with a barbell or E-Z Bar in front of you in between your legs. Your legs should be spread with the knees bent and the feet on the floor.","Use your arms to pick the barbell up and place the back of your upper arms on top of your inner thighs (around three and a half inches away from the front of the knee). A supinated grip closer than shoulder width is needed to perform this exercise. Tip: Your arm should be extended at arms length and the barbell should be above the floor. This will be your starting position.","While holding the upper arms stationary, curl the weights forward while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a second as you squeeze the biceps.","Slowly begin to bring the barbell back to starting position as your breathe in. Tip: Avoid swinging motions at any time.","Repeat for the recommended amount of repetitions."]},{id:"g-seated-dumbbell-curl",name:"Seated
