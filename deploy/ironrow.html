t one will be rotated clockwise. Breathe in as you perform this portion of the movement.","Repeat for the recommended amount of repetitions."]},{id:"g-around-the-worlds",name:"Around the Worlds",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["front_delts"],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Lay down on a flat bench holding a dumbbell in each hand with the palms of the hands facing towards the ceiling. Tip: Your arms should be parallel to the floor and next to your thighs. To avoid injury, make sure that you keep your elbows slightly bent. This will be your starting position.","Now move the dumbbells by creating a semi-circle as you displace them from the initial position to over the head. All of the movement should happen with the arms parallel to the floor at all times. Breathe in as you perform this portion of the movement.","Reverse the movement to return the weight to the starting position as you exhale."]},{id:"e-assisted-dip-machine",name:"Assisted Dip Machine",type:"compound_upper",pattern:"vertical_push",primary:["chest","triceps"],secondary:[],equipment:["machine"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-atlas-stone-lift",name:"Atlas Stone Lift",type:"compound_lower",pattern:"hinge",primary:["glutes","lower_back"],secondary:["biceps","upper_back"],equipment:["bodyweight"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-back-flyes-with-bands",name:"Back Flyes - with Bands",type:"compound_upper",pattern:"horizontal_push",primary:["rear_delts"],secondary:["lats","triceps"],equipment:["band"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Run a band around a stationary post like that of a squat rack.","Grab the band by the handles and stand back so that the tension in the band rises.","Extend and lift the arms straight in front of you. Tip: Your arms should be straight and parallel to the floor while perpendicular to your torso. Your feet should be firmly planted on the floor spread at shoulder width. This will be your starting position.","As you exhale, move your arms to the sides and back. Keep your arms extended and parallel to the floor. Continue the movement until the arms are extended to your sides.","After a pause, go back to the original position as you inhale.","Repeat for the recommended amount of repetitions."]},{id:"g-band-curl",name:"Band Curl",type:"isolation_upper",pattern:"isolation",primary:["biceps"],secondary:[],equipment:["band"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Stand on the middle of the band with feet hip-width apart, holding an end in each hand, palms forward.","Keep your elbows pinned to your sides and curl your hands up to your shoulders.","Lower slowly until your arms are straight."]},{id:"e-band-dislocates",name:"Band Dislocates",type:"isolation_upper",pattern:"isolation",primary:["rear_delts"],secondary:["front_delts"],equipment:["band"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:["shoulder dislocates","pass-throughs"]},{id:"e-band-face-pull",name:"Band Face Pull",type:"isolation_upper",pattern:"horizontal_pull",primary:["rear_delts"],secondary:["upper_back"],equipment:["band"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-band-good-morning",name:"Band Good Morning",type:"compound_lower",pattern:"hinge",primary:["hamstrings"],secondary:["glutes","lower_back"],equipment:["band"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Using a 41 inch band, stand on one end, spreading your feet a small amount. Bend at the hips to loop the end of the band behind your neck. This will be your starting position.","Keeping your legs straight, extend through the hips to come to a near vertical position.","Ensure that you do not round your back as you go down back to the starting position."]},{id:"g-band-good-morning-pull-through",name:"Band Good Morning (Pull Through)",type:"compound_lower",pattern:"hinge",primary:["hamstrings"],secondary:["glutes","lower_back"],equipment:["band"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Loop the band around a post. Standing a little ways away, loop the opposite end around the neck. Your hands can help hold the band in position.","Begin by bending at the hips, getting your butt back as far as possible. Keep your back flat and bend forward to about 90 degrees. Your knees should be only slightly bent.","Return to the starting position be driving through with the hips to come back to a standing position."]},{id:"g-band-lateral-walk",name:"Band Lateral Walk",type:"isolation_lower",pattern:"carry",primary:["glutes"],secondary:[],equipment:["band"],laterality:"bilateral",bw:0,metric:"time",steps:["Place a band around both ankles and another around both knees. There should be enough tension that they are tight when your feet are shoulder width apart.","To begin, take short steps forward alternating your left and right foot.","After several steps, do just the opposite and walk backward to where you started."]},{id:"g-band-leg-curl",name:"Band Leg Curl",type:"isolation_lower",pattern:"isolation",primary:["hamstrings"],secondary:[],equipment:["band"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Anchor the band low and loop it around one ankle, then lie face down with your legs straight.","Curl your heel toward your glutes, keeping your hips pressed into the floor.","Lower your leg slowly until it is straight, then switch sides after the set."]},{id:"g-band-pushdown",name:"Band Pushdown",type:"isolation_upper",pattern:"isolation",primary:["triceps"],secondary:[],equipment:["band"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Anchor the band above head height and hold it with both hands, elbows bent and tucked at your sides.","Push down until your arms are fully straight, moving only at the elbows.","Let your hands rise back to chest height under control."]},{id:"g-band-row",name:"Band Row",type:"compound_upper",pattern:"horizontal_pull",primary:["upper_back"],secondary:["biceps","lats"],equipment:["band"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Anchor the band at chest height and step back until it is taut, arms straight in front of you.","Pull the handles to your lower ribs, driving the elbows back and squeezing the shoulder blades together.","Pause, then let your arms straighten slowly against the band."]},{id:"g-band-skull-crusher",name:"Band Skull Crusher",type:"isolation_upper",pattern:"isolation",primary:["triceps"],secondary:[],equipment:["band"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Secure a band to the base of a rack or the bench. Lay on the bench so that the band is lined up with your head.","Take hold of the band, raising your elbows so that the upper arm is perpendicular to the floor. With the elbow flexed, the band should be above your head. This will be your starting position.","Extend through the elbow to straighten your arm, keeping your upper arm in place. Pause at the top of the motion, and return to the starting position."]},{id:"e-banded-lateral-walk",name:"Banded Lateral Walk",type:"isolation_lower",pattern:"isolation",primary:["abductors","glutes"],secondary:[],equipment:["band"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-barbell-ab-rollout",name:"Barbell Ab Rollout",type:"core",pattern:"core",primary:["abs"],secondary:["lats","front_delts"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["For this exercise you will need to get into a pushup position, but instead of having your hands of the floor, you will be grabbing on to an Olympic barbell (loaded with 5-10 lbs on each side) instead. This will be your starting position.","While keeping a slight arch on your back, lift your hips and roll the barbell towards your feet as you exhale. Tip: As you perform the movement, your glutes should be coming up, you should be keeping the abs tight and should maintain your back posture at all times. Also your arms should be staying perpendicular to the floor throughout the movement. If you don't, you will work out your shoulders and back more than the abs.","After a second contraction at the top, start to roll the barbell back forward to the starting position slowly as you inhale.","Repeat for the recommended amount of repetitions."]},{id:"g-barbell-back-squat",name:"Barbell Back Squat",type:"compound_lower",pattern:"squat",primary:["quads"],secondary:["glutes","hamstrings"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack to just below shoulder level. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.","Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times and also maintain a straight back. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances discussed in the foot stances section).","Begin to slowly lower the bar by bending the knees and hips as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees. Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise the bar as you exhale by pushing the floor with the heel of your foot as you straighten the legs again and go back to the starting position.","Repeat for the recommended amount of repetitions."]},{id:"g-barbell-bent-over-row",name:"Barbell Bent-over Row",type:"compound_upper",pattern:"horizontal_pull",primary:["upper_back"],secondary:["biceps","hamstrings","lats"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Holding a barbell with a pronated grip (palms facing down), bend your knees slightly and bring your torso forward, by bending at the waist, while keeping the back straight until it is almost parallel to the floor. Tip: Make sure that you keep the head up. The barbell should hang directly in front of you as your arms hang perpendicular to the floor and your torso. This is your starting position.","Now, while keeping the torso stationary, breathe out and lift the barbell to you. Keep the elbows close to the body and only use the forearms to hold the weight. At the top contracted position, squeeze the back muscles and hold for a brief pause.","Then inhale and slowly lower the barbell back to the starting position.","Repeat for the recommended amount of repetitions."]},{id:"g-barbell-curls-lying-against-an-incline",name:"Barbell Curls Lying Against An Incline",type:"isolation_upper",pattern:"isolation",primary:["biceps"],secondary:[],equipment:["barbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Lie against an incline bench, with your arms holding a barbell and hanging down in a horizontal line. This will be your starting position.","While keeping the upper arms stationary, curl the weight up as high as you can while squeezing the biceps. Breathe out as you perform this portion of the movement. Tip: Only the forearms should move. Do not swing the arms.","After a second contraction, slowly go back to the starting position as you inhale. Tip: Make sure that you go all of the way down.","Repeat for the recommended amount of repetitions."]},{id:"g-barbell-deadlift",name:"Barbell Deadlift",type:"compound_upper",pattern:"hinge",primary:["lower_back"],secondary:["calves","glutes","hamstrings","quads"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Stand in front of a loaded barbell.","While keeping the back as straight as possible, bend your knees, bend forward and grasp the bar using a medium (shoulder width) overhand grip. This will be the starting position of the exercise. Tip: If it is difficult to hold on to the bar with this grip, alternate your grip or use wrist straps.","While holding the bar, start the lift by pushing with your legs while simultaneously getting your torso to the upright position as you breathe out. In the upright position, stick your chest out and contract the back by bringing the shoulder blades back. Think of how the soldiers in the military look when they are in standing in attention.","Go back to the starting position by bending at the knees while simultaneously leaning the torso forward at the waist while keeping the back straight. When the weights on the bar touch the floor you are back at the starting position and ready to perform another repetition.","Perform the amount of repetitions prescribed in the program."]},{id:"g-barbell-full-squat",name:"Barbell Full Squat",type:"compound_lower",pattern:"squat",primary:["quads"],secondary:["calves","glutes","hamstrings","lats"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack just above shoulder level. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.","Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a shoulder-width medium stance with the toes slightly pointed out. Keep your head up at all times and maintain a straight back. This will be your starting position.","Begin to slowly lower the bar by bending the knees and sitting back with your hips as you maintain a straight posture with the head up. Continue down until your hamstrings are on your calves. Inhale as you perform this portion of the movement.","Begin to raise the bar as you exhale by pushing the floor with the heel or middle of your foot as you straighten the legs and extend the hips to go back to the starting position.","Repeat for the recommended amount of repetitions."]},{id:"g-barbell-glute-bridge",name:"Barbell Glute Bridge",type:"compound_lower",pattern:"hinge",primary:["glutes"],secondary:["calves","hamstrings"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Begin seated on the ground with a loaded barbell over your legs. Using a fat bar or having a pad on the bar can greatly reduce the discomfort caused by this exercise. Roll the bar so that it is directly above your hips, and lay down flat on the floor.","Begin the movement by driving through with your heels, extending your hips vertically through the bar. Your weight should be supported by your upper back and the heels of your feet.","Extend as far as possible, then reverse the motion to return to the starting position."]},{id:"g-barbell-guillotine-bench-press",name:"Barbell Guillotine Bench Press",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["front_delts","triceps"],equipment:["barbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Using a medium width grip (a grip that creates a 90-degree angle in the middle of the movement between the forearms and the upper arms), lift the bar from the rack and hold it straight over your neck with your arms locked. This will be your starting position.","As you breathe in, bring the bar down slowly until it is about 1 inch from your neck.","After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms and squeeze your chest in the contracted position, hold for a second and then start coming down slowly again. It should take at least twice as long to go down than to come up.","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the bar back in the rack."]},{id:"g-barbell-hack-squat",name:"Barbell Hack Squat",type:"compound_lower",pattern:"squat",primary:["quads"],secondary:["calves","hamstrings"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Stand up straight while holding a barbell behind you at arms length and your feet at shoulder width. Tip: A shoulder width grip is best with the palms of your hands facing back. You can use wrist wraps for this exercise for a better grip. This will be your starting position.","While keeping your head and eyes up and back straight, squat until your upper thighs are parallel to the floor. Breathe in as you slowly go down.","Pressing mainly with the heel of the foot and squeezing the thighs, go back up as you breathe out.","Repeat for the recommended amount of repetitions."]},{id:"g-barbell-incline-bench-press-medium-grip",name:"Barbell Incline Bench Press - Medium Grip",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["front_delts","triceps"],equipment:["barbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Lie back on an incline bench. Using a medium-width grip (a grip that creates a 90-degree angle in the middle of the movement between the forearms and the upper arms), lift the bar from the rack and hold it straight over you with your arms locked. This will be your starting position.","As you breathe in, come down slowly until you feel the bar on you upper chest.","After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms in the contracted position, squeeze your chest, hold for a second and then start coming down slowly again. Tip: it should take at least twice as long to go down than to come up.","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the bar back in the rack."]},{id:"g-barbell-incline-shoulder-raise",name:"Barbell Incline Shoulder Raise",type:"compound_upper",pattern:"horizontal_push",primary:["front_delts"],secondary:["chest"],equipment:["barbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Lie back on an Incline Bench. Using a medium width grip (a grip that is slightly wider than shoulder width), lift the bar from the rack and hold it straight over you with your arms straight. This will be your starting position.","While keeping the arms straight, lift the bar by protracting your shoulder blades, raising the shoulders from the bench as you breathe out.","Bring back the bar to the starting position as you breathe in.","Repeat for the recommended amount of repetitions."]},{id:"g-barbell-lunge",name:"Barbell Lunge",type:"compound_lower",pattern:"lunge",primary:["quads"],secondary:["calves","glutes","hamstrings"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack just below shoulder level. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.","Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and step forward with your right leg and squat down through your hips, while keeping the torso upright and maintaining balance. Inhale as you go down. Note: Do not allow your knee to go forward beyond your toes as you come down, as this will put undue stress on the knee joint. li>","Using mainly the heel of your foot, push up and go back to the starting position as you exhale.","Repeat the movement for the recommended amount of repetitions and then perform with the left leg."]},{id:"g-barbell-overhead-press",name:"Barbell Overhead Press",type:"compound_upper",pattern:"vertical_push",primary:["front_delts"],secondary:["triceps"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Sit on a bench with back support in a squat rack. Position a barbell at a height that is just above your head. Grab the barbell with a pronated grip (palms facing forward).","Once you pick up the barbell with the correct grip width, lift the bar up over your head by locking your arms. Hold at about shoulder level and slightly in front of your head. This is your starting position.","Lower the bar down to the shoulders slowly as you inhale.","Lift the bar back up to the starting position as you exhale.","Repeat for the recommended amount of repetitions."]},{id:"g-barbell-rear-delt-row",name:"Barbell Rear Delt Row",type:"compound_upper",pattern:"horizontal_pull",primary:["rear_delts"],secondary:["biceps","upper_back"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Stand up straight while holding a barbell using a wide (higher than shoulder width) and overhand (palms facing your body) grip.",'Bend knees slightly and bend over as you keep the natural arch of your back. Let the arms hang in front of you as they hold the bar. Once your torso is parallel to the floor, flare the elbows out and away from your body. Tip: Your torso and your arms should resemble the letter "T". Now you are ready to begin the exercise.',"While keeping the upper arms perpendicular to the torso, pull the barbell up towards your upper chest as you squeeze the rear delts and you breathe out. Tip: When performed correctly, this exercise should resemble a bench press in reverse. Also, refrain from using your biceps to do the work. Focus on targeting the rear delts; the arms should only act as hooks.","Slowly go back to the initial position as you breathe in.","Repeat for the recommended amount of repetitions."]},{id:"g-barbell-rollout-from-bench",name:"Barbell Rollout from Bench",type:"core",pattern:"core",primary:["abs"],secondary:["glutes","hamstrings","lats","front_delts"],equipment:["barbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Place a loaded barbell on the ground, near the end of a bench. Kneel with both legs on the bench, and take a medium to narrow grip on the barbell. This will be your starting position.","To begin, extend through the hips to slowly roll the bar forward. As you roll out, flex the shoulder to roll the bar above your head. Ensure that your arms remain extended throughout the movement.","When the bar has been moved as far forward as possible, return to the starting position."]},{id:"g-barbell-romanian-deadlift",name:"Barbell Romanian Deadlift",type:"compound_lower",pattern:"hinge",primary:["hamstrings"],secondary:["glutes","lower_back"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Put a barbell in front of you on the ground and grab it using a pronated (palms facing down) grip that a little wider than shoulder width. Tip: Depending on the weight used, you may need wrist wraps to perform the exercise and also a raised platform in order to allow for better range of motion.","Bend the knees slightly and keep the shins vertical, hips back and back straight. This will be your starting position.","Keeping your back and arms completely straight at all times, use your hips to lift the bar as you exhale. Tip: The movement should not be fast but steady and under control.","Once you are standing completely straight up, lower the bar by pushing the hips back, only slightly bending the knees, unlike when squatting. Tip: Take a deep breath at the start of the movement and keep your chest up. Hold your breath as you lower and exhale as you complete the movement.","Repeat for the recommended amount of repetitions."]},{id:"g-barbell-seated-calf-raise",name:"Barbell Seated Calf Raise",type:"isolation_lower",pattern:"isolation",primary:["calves"],secondary:[],equipment:["barbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Place a block about 12 inches in front of a flat bench.","Sit on the bench and place the ball of your feet on the block.","Have someone place a barbell over your upper thighs about 3 inches above your knees and hold it there. This will be your starting position.","Raise up on your toes as high as possible as you squeeze the calves and as you breathe out.","After a second contraction, slowly go back to the starting position. Tip: To get maximum benefit stretch your calves as far as you can.","Repeat for the recommended amount of repetitions."]},{id:"g-barbell-shrug-behind-the-back",name:"Barbell Shrug behind the Back",type:"isolation_upper",pattern:"isolation",primary:["traps"],secondary:[],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Stand up straight with your feet at shoulder width as you hold a barbell with both hands behind your back using a pronated grip (palms facing back). Tip: Your hands should be a little wider than shoulder width apart. You can use wrist wraps for this exercise for better grip. This will be your starting position.","Raise your shoulders up as far as you can go as you breathe out and hold the contraction for a second. Tip: Refrain from trying to lift the barbell by using your biceps. The arms should remain stretched out at all times.","Slowly return to the starting position as you breathe in.","Repeat for the recommended amount of repetitions."]},{id:"g-barbell-side-bend",name:"Barbell Side Bend",type:"core",pattern:"core",primary:["obliques"],secondary:["lats"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Stand up straight while holding a barbell placed on the back of your shoulders (slightly below the neck). Your feet should be shoulder width apart. This will be your starting position.","While keeping your back straight and your head up, bend only at the waist to the right as far as possible. Breathe in as you bend to the side. Then hold for a second and come back up to the starting position as you exhale. Tip: Keep the rest of the body stationary.","Now repeat the movement but bending to the left instead. Hold for a second and come back to the starting position.","Repeat for the recommended amount of repetitions."]},{id:"g-barbell-side-split-squat",name:"Barbell Side Split Squat",type:"compound_lower",pattern:"lunge",primary:["quads"],secondary:["calves","hamstrings","lats"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Stand up straight while holding a barbell placed on the back of your shoulders (slightly below the neck). Your feet should be placed wide apart with the foot of the lead leg angled out to the side. This will be your starting position.","Lower your body towards the side of your angled foot by bending the knee and hip of your lead leg and while keeping the opposite leg only slightly bent. Breathe in as you lower your body.","Return to the starting position by extending the hip and knee of the lead leg. Breathe out as you perform this movement.","After performing the recommended amount of reps, repeat the movement with the opposite leg."]},{id:"g-barbell-step-ups",name:"Barbell Step Ups",type:"compound_lower",pattern:"lunge",primary:["quads"],secondary:["calves","glutes","hamstrings"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Stand up straight while holding a barbell placed on the back of your shoulders (slightly below the neck) and stand upright behind an elevated platform (such as the one used for spotting behind a flat bench). This is your starting position.","Place the right foot on the elevated platform. Step on the platform by extending the hip and the knee of your right leg. Use the heel mainly to lift the rest of your body up and place the foot of the left leg on the platform as well. Breathe out as you execute the force required to come up.","Step down with the left leg by flexing the hip and knee of the right leg as you inhale. Return to the original standing position by placing the right foot of to next to the left foot on the initial position.","Repeat with the right leg for the recommended amount of repetitions and then perform with the left leg."]},{id:"g-barbell-walking-lunge",name:"Barbell Walking Lunge",type:"compound_lower",pattern:"lunge",primary:["quads"],secondary:["calves","glutes","hamstrings"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"time",steps:["Begin standing with your feet shoulder width apart and a barbell across your upper back.","Step forward with one leg, flexing the knees to drop your hips. Descend until your rear knee nearly touches the ground. Your posture should remain upright, and your front knee should stay above the front foot.","Drive through the heel of your lead foot and extend both knees to raise yourself back up.","Step forward with your rear foot, repeating the lunge on the opposite leg."]},{id:"e-battle-ropes",name:"Battle Ropes",type:"cardio",pattern:"carry",primary:["front_delts"],secondary:["abs","forearms"],equipment:["bodyweight"],laterality:"bilateral",bw:0,metric:"time",aliases:[]},{id:"e-bayesian-cable-curl",name:"Bayesian Cable Curl",type:"isolation_upper",pattern:"isolation",primary:["biceps"],secondary:[],equipment:["cable"],laterality:"unilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-behind-the-neck-press",name:"Behind-the-Neck Press",type:"compound_upper",pattern:"vertical_push",primary:["front_delts","side_delts"],secondary:["triceps"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-belt-squat",name:"Belt Squat",type:"compound_lower",pattern:"squat",primary:["quads","glutes"],secondary:[],equipment:["machine"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-bench-press-powerlifting",name:"Bench Press - Powerlifting",type:"compound_upper",pattern:"horizontal_push",primary:["triceps"],secondary:["chest","lats","front_delts"],equipment:["barbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Begin by lying on the bench, getting your head beyond the bar if possible. Tuck your feet underneath you and arch your back. Using the bar to help support your weight, lift your shoulder off the bench and retract them, squeezing the shoulder blades together. Use your feet to drive your traps into the bench. Maintain this tight body position throughout the movement.","However wide your grip, it should cover the ring on the bar. Pull the bar out of the rack without protracting your shoulders. Focus on squeezing the bar and trying to pull it apart.","Lower the bar to your lower chest or upper stomach. The bar, wrist, and elbow should stay in line at all times.","Pause when the barbell touches your torso, and then drive the bar up with as much force as possible. The elbows should be tucked in until lockout."]},{id:"g-bench-press-with-bands",name:"Bench Press - with Bands",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["front_delts","triceps"],equipment:["band"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Using a flat bench secure a band under the leg of the bench that is nearest to your head.","Once the band is secure, grab it by both handles and lie down on the bench.","Extend your arms so that you are holding the band handles in front of you at shoulder width.","Once at shoulder width, rotate your wrists forward so that the palms of your hands are facing away from you. This will be your starting position.","Bring down the handles slowly until your elbow forms a 90 degree angle. Keep full control at all times.","As you breathe out, bring the handles up using your pectoral muscles. Lock your arms in the contracted position, squeeze your chest, hold for a second and then start coming down slowly. Tip: It should take at least twice as long to go down than to come up.","Repeat the movement for the prescribed amount of repetitions of your training program."]},{id:"g-bent-over-dumbbell-rear-delt-raise-with-head-on-bench",name:"Bent Over Dumbbell Rear Delt Raise with Head on Bench",type:"isolation_upper",pattern:"isolation",primary:["rear_delts"],secondary:[],equipment:["dumbbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Stand up straight while holding a dumbbell in each hand and with an incline bench in front of you.","While keeping your back straight and maintaining the natural arch of your back, lean forward until your forehead touches the bench in front of you. Let the arms hang in front of you perpendicular to the ground. The palms of your hands should be facing each other and your torso should be parallel to the floor. This will be your starting position.","Keeping your torso forward and stationary, and the arms straight with a slight bend at the elbows, lift the dumbbells straight to the side until both arms are parallel to the floor. Exhale as you lift the weights. Caution: avoid swinging the torso or bringing the arms back as opposed to the side.","After a one second contraction at the top, slowly lower the dumbbells back to the starting position.","Repeat the recommended amount of repetitions."]},{id:"g-bent-over-low-pulley-side-lateral",name:"Bent Over Low-Pulley Side Lateral",type:"isolation_upper",pattern:"isolation",primary:["side_delts"],secondary:["upper_back"],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Select a weight and hold the handle of the low pulley with your right hand.","Bend at the waist until your torso is nearly parallel to the floor. Your legs should be slightly bent with your left hand placed on your lower left thigh. Your right arm should be hanging from your shoulder in front of you and with a slight bend at the elbow. This will be your starting position.","Raise your right arm, elbow slightly bent, to the side until the arm is parallel to the floor and in line with your right ear. Breathe out as you perform this step.","Slowly lower the weight back to the starting position as you breathe in.","Repeat for the recommended amount of repetitions and repeat the movement with the other arm."]},{id:"g-bent-over-one-arm-long-bar-row",name:"Bent Over One-Arm Long Bar Row",type:"compound_upper",pattern:"horizontal_pull",primary:["upper_back"],secondary:["biceps","lats"],equipment:["barbell"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["Put weight on one of the ends of an Olympic barbell. Make sure that you either place the other end of the barbell in the corner of two walls; or put a heavy object on the ground so the barbell cannot slide backward.","Bend forward until your torso is as close to parallel with the floor as you can and keep your knees slightly bent.","Now grab the bar with one arm just behind the plates on the side where the weight was placed and put your other hand on your knee. This will be your starting position.","Pull the bar straight up with your elbow in (to maximize back stimulation) until the plates touch your lower chest. Squeeze the back muscles as you lift the weight up and hold for a second at the top of the movement. Breathe out as you lift the weight. Tip: Do not allow for any swinging of the torso. Only the arm should move.","Slowly lower the bar to the starting position getting a nice stretch on the lats. Tip: Do not let the plates touch the floor. To ensure the best range of motion, I recommend using small plates (25-lb ones) as opposed to larger plates (like 35-45lb ones).","Repeat for the recommended amount of repetitions and switch arms."]},{id:"g-bent-over-two-arm-long-bar-row",name:"Bent Over Two-Arm Long Bar Row",type:"compound_upper",pattern:"horizontal_pull",primary:["upper_back"],secondary:["biceps","lats"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Put weight on one of the ends of an Olympic barbell. Make sure that you either place the other end of the barbell in the corner of two walls; or put a heavy object on the ground so the barbell cannot slide backward.","Bend forward until your torso is as close to parallel with the floor as you can and keep your knees slightly bent.","Now grab the bar with both arms just behind the plates on the side where the weight was placed and put your other hand on your knee. This will be your starting position.","Pull the bar straight up with your elbows in (to maximize back stimulation) until the plates touch your lower chest. Squeeze the back muscles as you lift the weight up and hold for a second at the top of the movement. Breathe out as you lift the weight. Tip: Use a stirrup or double handle cable attachment by hooking it under the end of the bar.","Slowly lower the bar to the starting position getting a nice stretch on the lats. Tip: Do not let the plates touch the floor. To ensure the best range of motion, I recommend using small plates (25-lb ones) as opposed to larger plates (like 35-45lb ones).","Repeat for the recommended amount of repetitions."]},{id:"g-bent-over-two-dumbbell-row",name:"Bent Over Two-Dumbbell Row",type:"compound_upper",pattern:"horizontal_pull",primary:["upper_back"],secondary:["biceps","front_delts","lats"],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["With a dumbbell in each hand (palms facing your torso), bend your knees slightly and bring your torso forward by bending at the waist; as you bend make sure to keep your back straight until it is almost parallel to the floor. Tip: Make sure that you keep the head up. The weights should hang directly in front of you as your arms hang perpendicular to the floor and your torso. This is your starting position.","While keeping the torso stationary, lift the dumbbells to your side (as you breathe out), keeping the elbows close to the body (do not exert any force with the forearm other than holding the weights). On the top contracted position, squeeze the back muscles and hold for a second.","Slowly lower the weight again to the starting position as you inhale.","Repeat for the recommended amount of repetitions."]},{id:"g-bent-over-two-dumbbell-row-with-palms-in",name:"Bent Over Two-Dumbbell Row with Palms in",type:"compound_upper",pattern:"horizontal_pull",primary:["upper_back"],secondary:["biceps","lats"],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["With a dumbbell in each hand (palms facing each other), bend your knees slightly and bring your torso forward, by bending at the waist, while keeping the back straight until it is almost parallel to the floor. Tip: Make sure that you keep the head up. The weights should hang directly in front of you as your arms hang perpendicular to the floor and your torso. This is your starting position.","While keeping the torso stationary, lift the dumbbells to your side as you breathe out, squeezing your shoulder blades together. On the top contracted position, squeeze the back muscles and hold for a second.","Slowly lower the weight again to the starting position as you inhale.","Repeat for the recommended amount of repetitions."]},{id:"g-bent-arm-barbell-pullover",name:"Bent-Arm Barbell Pullover",type:"compound_upper",pattern:"horizontal_push",primary:["lats"],secondary:["chest","front_delts","triceps"],equipment:["barbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Lie on a flat bench with a barbell using a shoulder grip width.","Hold the bar straight over your chest with a bend in your arms. This will be your starting position.","While keeping your arms in the bent arm position, lower the weight slowly in an arc behind your head while breathing in until you feel a stretch on the chest.","At that point, bring the barbell back to the starting position using the arc through which the weight was lowered and exhale as you perform this movement.","Hold the weight on the initial position for a second and repeat the motion for the prescribed number of repetitions."]},{id:"g-bent-arm-dumbbell-pullover",name:"Bent-Arm Dumbbell Pullover",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["lats","front_delts","triceps"],equipment:["dumbbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Place a dumbbell standing up on a flat bench.","Ensuring that the dumbbell stays securely placed at the top of the bench, lie perpendicular to the bench (torso across it as in forming a cross) with only your shoulders lying on the surface. Hips should be below the bench and legs bent with feet firmly on the floor. The head will be off the bench as well.","Grasp the dumbbell with both hands and hold it straight over your chest with a bend in your arms. Both palms should be pressing against the underside one of the sides of the dumbbell. This will be your starting position. Caution: Always ensure that the dumbbell used for this exercise is secure. Using a dumbbell with loose plates can result in the dumbbell falling apart and falling on your face.","While keeping your arms locked in the bent arm position, lower the weight slowly in an arc behind your head while breathing in until you feel a stretch on the chest.","At that point, bring the dumbbell back to the starting position using the arc through which the weight was lowered and exhale as you perform this movement.","Hold the weight on the initial position for a second and repeat the motion for the prescribed number of repetitions."]},{id:"g-bent-knee-hip-raise",name:"Bent-Knee Hip Raise",type:"core",pattern:"core",primary:["abs"],secondary:[],equipment:["bodyweight"],laterality:"bilateral",bw:.6,metric:"weight_reps",steps:["Lay flat on the floor with your arms next to your sides.","Now bend your knees at around a 75 degree angle and lift your feet off the floor by around 2 inches.","Using your lower abs, bring your knees in towards you as you maintain the 75 degree angle bend in your legs. Continue this movement until you raise your hips off of the floor by rolling your pelvis backward. Breathe out as you perform this portion of the movement. Tip: At the end of the movement your knees will be over your chest.","Squeeze your abs at the top of the movement for a second and then return to the starting position slowly as you breathe in. Tip: Maintain a controlled motion at all times.","Repeat for the recommended amount of repetitions."]},{id:"e-bicycle-crunch",name:"Bicycle Crunch",type:"core",pattern:"core",primary:["abs","obliques"],secondary:[],equipment:["bodyweight"],laterality:"bilateral",bw:.25,metric:"weight_reps",aliases:[]},{id:"e-bird-dog",name:"Bird Dog",type:"core",pattern:"core",primary:["lower_back","abs"],secondary:["glutes"],equipment:["bodyweight"],laterality:"unilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-board-press",name:"Board Press",type:"compound_upper",pattern:"horizontal_push",primary:["triceps"],secondary:["chest","lats","front_delts"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Begin by lying on the bench, getting your head beyond the bar if possible. One to five boards, made out of 2x6's, can be screwed together and held in place by a training partner, bands, or just tucked under your shirt.","Tuck your feet underneath you and arch your back. Using the bar to help support your weight, lift your shoulder off the bench and retract them, squeezing the shoulder blades together. Use your feet to drive your traps into the bench. Maintain this tight body position throughout the movement.","You can take a standard bench grip, or shoulder width to focus on the triceps. Pull the bar out of the rack without protracting your shoulders. The bar, wrist, and elbow should stay in line at all times. Focus on squeezing the bar and trying to pull it apart.","Lower the bar to the boards, and then drive the bar up with as much force as possible. The elbows should be tucked in until lockout."]},{id:"g-body-tricep-press",name:"Body Tricep Press",type:"isolation_upper",pattern:"horizontal_push",primary:["triceps"],secondary:[],equipment:["bodyweight"],laterality:"bilateral",bw:.3,metric:"weight_reps",steps:["Position a bar in a rack at chest height.","Standing, take a shoulder width grip on the bar and step a yard or two back, feet together and arms extended so that you are leaning on the bar. This will be your starting position.","Begin by flexing the elbow, lowering yourself towards the bar.","Pause, and then reverse the motion by extending the elbows.","Progress from bodyweight by adding chains over your shoulders."]},{id:"g-body-up",name:"Body-Up",type:"isolation_upper",pattern:"isolation",primary:["triceps"],secondary:["abs"],equipment:["bodyweight"],laterality:"bilateral",bw:.3,metric:"weight_reps",steps:["Assume a plank position on the ground. You should be supporting your bodyweight on your toes and forearms, keeping your torso straight. Your forearms should be shoulder-width apart. This will be your starting position.","Pressing your palms firmly into the ground, extend through the elbows to raise your body from the ground. Keep your torso rigid as you perform the movement.","Slowly lower your forearms back to the ground by allowing the elbows to flex.","Repeat."]},{id:"g-bodyweight-flyes",name:"Bodyweight Flyes",type:"isolation_upper",pattern:"isolation",primary:["chest"],secondary:["abs","front_delts","triceps"],equipment:["barbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Position two equally loaded EZ bars on the ground next to each other. Ensure they are able to roll.","Assume a push-up position over the bars, supporting your weight on your toes and hands with your arms extended and body straight.","Place your hands on the bars. This will be your starting position.","Using a slow and controlled motion, move your hands away from the midline of your body, rolling the bars apart. Inhale during this portion of the motion.","After moving the bars as far apart as you can, return to the starting position by pulling them back together. Exhale as you perform this movement."]},{id:"g-bosu-ball-cable-crunch-with-side-bends",name:"Bosu Ball Cable Crunch with Side Bends",type:"core",pattern:"core",primary:["obliques"],secondary:[],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Connect a standard handle to each arm of a cable machine, and position them in the most downward position.","Grab a Bosu Ball and position it in front and center of the cable machine.","Lie down on the Bosu Ball with the small of your back arched around the ball. Your rear end should be close to the floor without touching it.","With both hands, reach back and grab the handle of each cable.","With your feet positioned in a wide stance, extend your arms straight out in front of you and in between your knees. Your hands should be at knee level.","Keep your arms straight and in-line with the upward angle of the cable. Elevate your torso in a crunching motion without dropping or bending your arms.","Maintain the rigid position with your arms. Slowly descend back to the starting position with your back arched around the Bosu Ball and your abdominals elongated.","Repeat the same series of movements to failure.","Once you reach failure, keep your abs tight and raise your torso into plank position so your back is elevated off the Bosu Ball.","Lower your arms down to your side; keep them straight. Start doing alternating side bends; reach for your heels! This finishing movement will focus on your obliques."]},{id:"g-bottoms-up",name:"Bottoms Up",type:"core",pattern:"core",primary:["abs"],secondary:[],equipment:["bodyweight"],laterality:"bilateral",bw:.6,metric:"weight_reps",steps:["Begin by lying on your back on the ground. Your legs should be straight and your arms at your side. This will be your starting position.","To perform the movement, tuck the knees toward your chest by flexing the hips and knees. Following this, extend your legs directly above you so that they are perpendicular to the ground. Rotate and elevate your pelvis to raise your glutes from the floor.","After a brief pause, return to the starting position."]},{id:"e-box-jump",name:"Box Jump",type:"compound_lower",pattern:"squat",primary:["quads","glutes"],secondary:["calves"],equipment:["bodyweight"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-box-squat",name:"Box Squat",type:"compound_lower",pattern:"squat",primary:["quads"],secondary:["calves","glutes","hamstrings","lats"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["The box squat allows you to squat to desired depth and develop explosive strength in the squat movement. Begin in a power rack with a box at the appropriate height behind you. Typically, you would aim for a box height that brings you to a parallel squat, but you can train higher or lower if desired.","Begin by stepping under the bar and placing it across the back of the shoulders. Squeeze your shoulder blades together and rotate your elbows forward, attempting to bend the bar across your shoulders. Remove the bar from the rack, creating a tight arch in your lower back, and step back into position. Place your feet wider for more emphasis on the back, glutes, adductors, and hamstrings, or closer together for more quad development. Keep your head facing forward.","With your back, shoulders, and core tight, push your knees and butt out and you begin your descent. Sit back with your hips until you are seated on the box. Ideally, your shins should be perpendicular to the ground. Pause when you reach the box, and relax the hip flexors. Never bounce off of a box.","Keeping the weight on your heels and pushing your feet and knees out, drive upward off of the box as you lead the movement with your head. Continue upward, maintaining tightness head to toe."]},{id:"g-bradford-rocky-presses",name:"Bradford/Rocky Presses",type:"compound_upper",pattern:"horizontal_push",primary:["front_delts"],secondary:["triceps"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Sit on a Military Press Bench with a bar at shoulder level with a pronated grip (palms facing forward). Tip: Your grip should be wider than shoulder width and it should create a 90-degree angle between the forearm and the upper arm as the barbell goes down. This is your starting position.","Once you pick up the barbell with the correct grip, lift the bar up over your head by locking your arms.","Now lower the bar down to the back of the head slowly as you inhale.","Lift the bar back up to the starting position as you exhale.","Lower the bar down to the starting position slowly as you inhale. This is one repetition.","Alternate in this manner until you complete the recommended amount of repetitions."]},{id:"e-broad-jump",name:"Broad Jump",type:"compound_lower",pattern:"squat",primary:["quads","glutes"],secondary:["calves"],equipment:["bodyweight"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-burpee",name:"Burpee",type:"cardio",pattern:"squat",primary:["quads","chest"],secondary:["abs","front_delts"],equipment:["bodyweight"],laterality:"bilateral",bw:.6,metric:"weight_reps",aliases:[]},{id:"g-butt-ups",name:"Butt-Ups",type:"core",pattern:"core",primary:["abs"],secondary:[],equipment:["bodyweight"],laterality:"bilateral",bw:.6,metric:"weight_reps",steps:["Begin a pushup position but with your elbows on the ground and resting on your forearms. Your arms should be bent at a 90 degree angle.","Arch your back slightly out rather than keeping your back completely straight.","Raise your glutes toward the ceiling, squeezing your abs tightly to close the distance between your ribcage and hips. The end result will be that you'll end up in a high bridge position. Exhale as you perform this portion of the movement.","Lower back down slowly to your starting position as you breathe in. Tip: Don't let your back sag downwards.","Repeat for the recommended amount of repetitions."]},{id:"g-cable-chest-press",name:"Cable Chest Press",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["front_delts","triceps"],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Adjust the weight to an appropriate amount and be seated, grasping the handles. Your upper arms should be about 45 degrees to the body, with your head and chest up. The elbows should be bent to about 90 degrees. This will be your starting position.","Begin by extending through the elbow, pressing the handles together straight in front of you. Keep your shoulder blades retracted as you execute the movement.","After pausing at full extension, return to th starting position, keeping tension on the cables.","You can also execute this movement with your back off the pad, at an incline or decline, or alternate hands."]},{id:"g-cable-deadlifts",name:"Cable Deadlifts",type:"compound_lower",pattern:"hinge",primary:["quads"],secondary:["glutes","hamstrings","lower_back"],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Move the cables to the bottom of the towers and select an appropriate weight. Stand directly in between the uprights.","To begin, squat down be flexing your hips and knees until you can reach the handles.","After grasping them, begin your ascent. Driving through your heels extend your hips and knees keeping your hands hanging at your side. Keep your head and chest up throughout the movement.","After reaching a full standing position, Return to the starting position and repeat."]},{id:"e-cable-external-rotation",name:"Cable External Rotation",type:"isolation_upper",pattern:"isolation",primary:["rear_delts"],secondary:[],equipment:["cable"],laterality:"unilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-cable-glute-kickback",name:"Cable Glute Kickback",type:"isolation_lower",pattern:"isolation",primary:["glutes"],secondary:[],equipment:["cable"],laterality:"unilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-cable-hammer-curls-rope-attachment",name:"Cable Hammer Curls - Rope Attachment",type:"isolation_upper",pattern:"isolation",primary:["forearms"],secondary:[],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Attach a rope attachment to a low pulley and stand facing the machine about 12 inches away from it.","Grasp the rope with a neutral (palms-in) grip and stand straight up keeping the natural arch of the back and your torso stationary.","Put your elbows in by your side and keep them there stationary during the entire movement. Tip: Only the forearms should move; not your upper arms. This will be your starting position.","Using your biceps, pull your arms up as you exhale until your biceps touch your forearms. Tip: Remember to keep the elbows in and your upper arms stationary.","After a 1 second contraction where you squeeze your biceps, slowly start to bring the weight back to the original position.","Repeat for the recommended amount of repetitions."]},{id:"e-cable-hip-abduction",name:"Cable Hip Abduction",type:"isolation_lower",pattern:"isolation",primary:["abductors","glutes"],secondary:[],equipment:["cable"],laterality:"unilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-cable-hip-adduction",name:"Cable Hip Adduction",type:"isolation_lower",pattern:"isolation",primary:["quads"],secondary:[],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Stand in front of a low pulley facing forward with one leg next to the pulley and the other one away.","Attach the ankle cuff to the cable and also to the ankle of the leg that is next to the pulley.","Now step out and away from the stack with a wide stance and grasp the bar of the pulley system.","Stand on the foot that does not have the ankle cuff (the far foot) and allow the leg with the cuff to be pulled towards the low pulley. This will be your starting position.","Now perform the movement by moving the leg with the ankle cuff in front of the far leg by using the inner thighs to abduct the hip. Breathe out during this portion of the movement.","Slowly return to the starting position as you breathe in.","Repeat for the recommended amount of repetitions and then repeat the same movement with the opposite leg."]},{id:"g-cable-incline-pushdown",name:"Cable Incline Pushdown",type:"isolation_upper",pattern:"isolation",primary:["lats"],secondary:[],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Lie on incline an bench facing away from a high pulley machine that has a straight bar attachment on it.","Grasp the straight bar attachment overhead with a pronated (overhand; palms down) shoulder width grip and extend your arms in front of you. The bar should be around 2 inches away from your upper thighs. This will be your starting position.","Keeping the upper arms stationary, lift your arms back in a semi circle until the bar is straight over your head. Breathe in during this portion of the movement.","Slowly go back to the starting position using your lats and hold the contraction once you reach the starting position. Breathe out during the execution of this movement.","Repeat for the recommended amount of repetitions."]},{id:"g-cable-incline-triceps-extension",name:"Cable Incline Triceps Extension",type:"isolation_upper",pattern:"isolation",primary:["triceps"],secondary:[],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Lie on incline an bench facing away from a high pulley machine that has a straight bar attachment on it.","Grasp the straight bar attachment overhead with a pronated (overhand; palms down) narrow grip (less than shoulder width) and keep your elbows tucked in to your sides. Your upper arms should create around a 25 degree angle when measured from the floor.","Keeping the upper arms stationary, extend the arms as you flex the triceps. Breathe out during this portion of the movement and hold the contraction for a second.","Slowly go back to the starting position.","Repeat for the recommended amount of repetitions."]},{id:"g-cable-internal-rotation",name:"Cable Internal Rotation",type:"compound_upper",pattern:"horizontal_push",primary:["rear_delts"],secondary:[],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Sit next to a low pulley sideways (with legs stretched in front of you or crossed) and grasp the single hand cable attachment with the arm nearest to the cable. Tip: If you can adjust the pulley's height, you can use a flat bench to sit on instead.","Position the elbow against your side with the elbow bent at 90° and the arm pointing towards the pulley. This will be your starting position.","Pull the single hand cable attachment toward your body by internally rotating your shoulder until your forearm is across your abs. You will be creating an imaginary semi-circle. Tip: The forearm should be perpendicular to your torso at all times.","Slowly go back to the initial position.","Repeat for the recommended amount of repetitions and then repeat the movement with the next arm."]},{id:"g-cable-iron-cross",name:"Cable Iron Cross",type:"isolation_upper",pattern:"isolation",primary:["chest"],secondary:[],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Begin by moving the pulleys to the high position, select the resistance to be used, and take a handle in each hand.",'Stand directly between both pulleys with your arms extended out to your sides. Your head and chest should be up while your arms form a "T". This will be your starting position.',"Keeping the elbows extended, pull your arms straight to your sides.","Return your arms back to the starting position after a pause at the peak contraction.","Continue the movement for the prescribed number of repetitions."]},{id:"g-cable-judo-flip",name:"Cable Judo Flip",type:"core",pattern:"core",primary:["abs"],secondary:[],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Connect a rope attachment to a tower, and move the cable to the lowest pulley position. Stand with your side to the cable with a wide stance, and grab the rope with both hands.","Twist your body away from the pulley as you bring the rope over your shoulder like you're performing a judo flip.","Shift your weight between your feet as you twist and crunch forward, pulling the cable downward.","Return to the starting position and repeat until failure.","Then, reposition and repeat the same series of movements on the opposite side."]},{id:"g-cable-kickback",name:"Cable Kickback",type:"isolation_lower",pattern:"isolation",primary:["glutes"],secondary:[],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Hook a leather ankle cuff to a low cable pulley and then attach the cuff to your ankle.","Face the weight stack from a distance of about two feet, grasping the steel frame for support.",'While keeping your knees and hips bent slightly and your abs tight, contract your glutes to slowly "kick" the working leg back in a semicircular arc as high as it will comfortably go as you breathe out. Tip: At full extension, squeeze your glutes for a second in order to achieve a peak contraction.',"Now slowly bring your working leg forward, resisting the pull of the cable until you reach the starting position.","Repeat for the recommended amount of repetitions.","Switch legs and repeat the movement for the other side."]},{id:"g-cable-lying-triceps-extension",name:"Cable Lying Triceps Extension",type:"isolation_upper",pattern:"isolation",primary:["triceps"],secondary:[],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Lie on a flat bench and grasp the straight bar attachment of a low pulley with a narrow overhand grip. Tip: The easiest way to do this is to have someone hand you the bar as you lay down.","With your arms extended, position the bar over your torso. Your arms and your torso should create a 90-degree angle. This will be your starting position.","Lower the bar by bending at the elbow while keeping the upper arms stationary and elbows in. Go down until the bar lightly touches your forehead. Breathe in as you perform this portion of the movement.","Flex the triceps as you lift the bar back to its starting position. Exhale as you perform this portion of the movement.","Hold for a second at the contracted position and repeat for the recommended amount of repetitions."]},{id:"g-cable-one-arm-tricep-extension",name:"Cable One Arm Tricep Extension",type:"isolation_upper",pattern:"isolation",primary:["triceps"],secondary:[],equipment:["cable"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["With your right hand, grasp a single handle attached to the high-cable pulley using a supinated (underhand; palms facing up) grip. You should be standing directly in front of the weight stack.","Now pull the handle down so that your upper arm and elbow are locked in to the side of your body. Your upper arm and forearm should form an acute angle (less than 90-degrees). You can keep the other arm by the waist and you can have one leg in front of you and the other one back for better balance. This will be your starting position.","As you contract the triceps, move the single handle attachment down to your side until your arm is straight. Breathe out as you perform this movement. Tip: Only the forearms should move. Your upper arms should remain stationary at all times.","Squeeze the triceps and hold for a second in this contracted position.","Slowly return the handle to the starting position.","Repeat for the recommended amount of repetitions and then perform the same movement with the other arm."]},{id:"g-cable-preacher-curl",name:"Cable Preacher Curl",type:"isolation_upper",pattern:"isolation",primary:["biceps"],secondary:[],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Place a preacher bench about 2 feet in front of a pulley machine.","Attach a straight bar to the low pulley.","Sit at the preacher bench with your elbow and upper arms firmly on top of the bench pad and have someone hand you the bar from the low pulley.","Grab the bar and fully extend your arms on top of the preacher bench pad. This will be your starting position.","Now start pilling the weight up towards your shoulders and squeeze the biceps hard at the top of the movement. Exhale as you perform this motion. Also, hold for a second at the top.","Now slowly lower the weight to the starting position.","Repeat for the recommended amount of repetitions."]},{id:"e-cable-pullover",name:"Cable Pullover",type:"isolation_upper",pattern:"isolation",primary:["lats"],secondary:[],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-cable-pushdown",name:"Cable Pushdown",type:"isolation_upper",pattern:"isolation",primary:["triceps"],secondary:[],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Attach a straight or angled bar to a high pulley and grab with an overhand grip (palms facing down) at shoulder width.","Standing upright with the torso straight and a very small inclination forward, bring the upper arms close to your body and perpendicular to the floor. The forearms should be pointing up towards the pulley as they hold the bar. This is your starting position.","Using the triceps, bring the bar down until it touches the front of your thighs and the arms are fully extended perpendicular to the floor. The upper arms should always remain stationary next to your torso and only the forearms should move. Exhale as you perform this movement.","After a second hold at the contracted position, bring the bar slowly up to the starting point. Breathe in as you perform this step.","Repeat for the recommended amount of repetitions."]},{id:"g-cable-rear-delt-fly",name:"Cable Rear Delt Fly",type:"isolation_upper",pattern:"isolation",primary:["rear_delts"],secondary:[],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Adjust the pulleys to the appropriate height and adjust the weight. The pulleys should be above your head.","Grab the left pulley with your right hand and the right pulley with your left hand, crossing them in front of you. This will be your starting position.","Initiate the movement by moving your arms back and outward, keeping your arms straight as you execute the movement.","Pause at the end of the motion before returning the handles to the start position."]},{id:"g-cable-reverse-crunch",name:"Cable Reverse Crunch",type:"core",pattern:"core",primary:["abs"],secondary:[],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Connect an ankle strap attachment to a low pulley cable and position a mat on the floor in front of it.","Sit down with your feet toward the pulley and attach the cable to your ankles.","Lie down, elevate your legs and bend your knees at a 90-degree angle. Your legs and the cable should be aligned. If not, adjust the pulley up or down until they are.","With your hands behind your head, bring your knees inward to your torso and elevate your hips off the floor.","Pause for a moment and in a slow and controlled manner drop your hips and bring your legs back to the starting 90-degree angle. You should still have tension on your abs in the resting position.","Repeat the same movement to failure."]},{id:"g-cable-rope-overhead-triceps-extension",name:"Cable Rope Overhead Triceps Extension",type:"isolation_upper",pattern:"isolation",primary:["triceps"],secondary:[],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Attach a rope to the bottom pulley of the pulley machine.","Grasping the rope with both hands, extend your arms with your hands directly above your head using a neutral grip (palms facing each other). Your elbows should be in close to your head and the arms should be perpendicular to the floor with the knuckles aimed at the ceiling. This will be your starting position.","Slowly lower the rope behind your head as you hold the upper arms stationary. Inhale as you perform this movement and pause when your triceps are fully stretched.","Return to the starting position by flexing your triceps as you breathe out.","Repeat for the recommended amount of repetitions."]},{id:"g-cable-rope-rear-delt-rows",name:"Cable Rope Rear-Delt Rows",type:"compound_upper",pattern:"horizontal_pull",primary:["front_delts"],secondary:["biceps","upper_back"],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Sit in the same position on a low pulley row station as you would if you were doing seated cable rows for the back.","Attach a rope to the pulley and grasp it with an overhand grip. Your arms should be extended and parallel to the floor with the elbows flared out.","Keep your lower back upright and slide your hips back so that your knees are slightly bent. This will be your starting position.","Pull the cable attachment towards your upper chest, just below the neck, as you keep your elbows up and out to the sides. Continue this motion as you exhale until the elbows travel slightly behind the back. Tip: Keep your upper arms horizontal, perpendicular to the torso and parallel to the floor throughout the motion.","Go back to the initial position where the arms are extended and the shoulders are stretched forward. Inhale as you perform this portion of the movement.","Repeat for the recommended amount of repetitions."]},{id:"g-cable-russian-twists",name:"Cable Russian Twists",type:"core",pattern:"core",primary:["obliques"],secondary:[],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Connect a standard handle attachment, and position the cable to a middle pulley position.","Lie on a stability ball perpendicular to the cable and grab the handle with one hand. You should be approximately arm's length away from the pulley, with the tension of the weight on the cable.","Grab the handle with both hands and fully extend your arms above your chest. You hands should be directly in-line with the pulley. If not, adjust the pulley up or down until they are.","Keep your hips elevated and abs engaged. Rotate your torso away from the pulley for a full-quarter rotation. Your body should be flat from head to knees.","Pause for a moment and in a slow and controlled manner reset to the starting position. You should still have side tension on the cable in the resting position.","Repeat the same movement to failure.","Then, reposition and repeat the same series of movements on the opposite side."]},{id:"g-cable-seated-crunch",name:"Cable Seated Crunch",type:"core",pattern:"core",primary:["abs"],secondary:[],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Seat on a flat bench with your back facing a high pulley.","Grasp the cable rope attachment with both hands (with the palms of the hands facing each other) and place your hands securely over both shoulders. Tip: Allow the weight to hyperextend the lower back slightly. This will be your starting position.","With the hips stationary, flex the waist so the elbows travel toward the hips. Breathe out as you perform this step.","As you inhale, go back to the initial position slowly.","Repeat for the recommended amount of repetitions."]},{id:"g-cable-shoulder-press",name:"Cable Shoulder Press",type:"compound_upper",pattern:"vertical_push",primary:["front_delts"],secondary:["triceps"],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Move the cables to the bottom of the towers and select an appropriate weight.","Stand directly in between the uprights. Grasp the cables and hold them at shoulder height, palms facing forward. This will be your starting position.","Keeping your head and chest up, extend through the elbow to press the handles directly over head.","After pausing at the top, return to the starting position and repeat."]},{id:"g-cable-shrugs",name:"Cable Shrugs",type:"isolation_upper",pattern:"isolation",primary:["traps"],secondary:[],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Grasp a cable bar attachment that is attached to a low pulley with a shoulder width or slightly wider overhand (palms facing down) grip.","Stand erect close to the pulley with your arms extended in front of you holding the bar. This will be your starting position.","Lift the bar by elevating the shoulders as high as possible as you exhale. Hold the contraction at the top for a second. Tip: The arms should remain extended at all times. Refrain from using the biceps to help lift the bar. Only the shoulders should be moving up and down.","Lower the bar back to the original position.","Repeat for the recommended amount of repetitions."]},{id:"e-cable-woodchop",name:"Cable Woodchop",type:"core",pattern:"core",primary:["obliques"],secondary:["abs"],equipment:["cable"],laterality:"unilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-cable-y-raise",name:"Cable Y-Raise",type:"isolation_upper",pattern:"isolation",primary:["side_delts"],secondary:["traps"],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-calf-press",name:"Calf Press",type:"isolation_lower",pattern:"horizontal_push",primary:["calves"],secondary:[],equipment:["machine"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Adjust the seat so that your legs are only slightly bent in the start position. The balls of your feet should be firmly on the platform.","Select an appropriate weight, and grasp the handles. This will be your starting position.","Straighten the legs by extending the knees, just barely lifting the weight from the stack. Your ankle should be fully flexed, toes pointing up. Execute the movement by pressing downward through the balls of your feet as far as possible.","After a brief pause, reverse the motion and repeat."]},{id:"g-calf-raise-on-a-dumbbell",name:"Calf Raise on a Dumbbell",type:"isolation_lower",pattern:"isolation",primary:["calves"],secondary:[],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Hang on to a sturdy object for balance and stand on a dumbbell handle, preferably one with round plates so that it rolls as in this manner you have to work harder to stabilize yourself; thus increasing the effectiveness of the exercise.","Now roll your foot slightly forward so that you can get a nice stretch of the calf. This will be your starting position.","Lift the calf as you roll your foot over the top of the handle so that you get a full extension. Exhale during the execution of this movement. Contract the calf hard at the top and hold for a second. Tip: As you come up, roll the dumbbell slightly backward.","Now inhale as you roll the dumbbell slightly forward as you come down to get a better stretch.","Repeat for the recommended amount of repetitions."]},{id:"g-calf-raises-with-bands",name:"Calf Raises - with Bands",type:"isolation_lower",pattern:"isolation",primary:["calves"],secondary:[],equipment:["band"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Grab an exercise band and stand on it with your toes making sure that the length of the band between the foot and the arms is the same for both sides.","While holding the handles of the band, raise the arms to the side of your head as if you were getting ready to perform a shoulder press. The palms should be facing forward with the elbows bent and to the sides. This movement will create tension on the band. This will be your starting position.","Keeping the hands by your shoulder, stand up on your toes as you exhale and contract the calves hard at the top of the movement.","After a one second contraction, slowly go back down to the starting position.","Repeat for the recommended amount of repetitions."]},{id:"g-car-drivers",name:"Car Drivers",type:"isolation_upper",pattern:"isolation",primary:["rear_delts"],secondary:[],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["While standing upright, hold a barbell plate in both hands at the 3 and 9 o'clock positions. Your palms should be facing each other and your arms should be extended straight out in front of you. This will be your starting position.","Initiate the movement by rotating the plate as far to one side as possible. Use the same type of movement you would use to turn a steering wheel to one side.","Reverse the motion, turning it all the way to the opposite side.","Repeat for the recommended amount of repetitions."]},{id:"e-cat-cow",name:"Cat-Cow",type:"core",pattern:"core",primary:["lower_back"],secondary:["abs"],equipment:["bodyweight"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-clean-and-jerk",name:"Clean and Jerk",type:"compound_lower",pattern:"hinge",primary:["glutes","quads"],secondary:["front_delts","triceps","traps"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-clean-and-press",name:"Clean and Press",type:"compound_upper",pattern:"hinge",primary:["front_delts"],secondary:["abs","calves","glutes","hamstrings","lats","quads","triceps"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Assume a shoulder-width stance, with knees inside the arms. Now while keeping the back flat, bend at the knees and hips so that you can grab the bar with the arms fully extended and a pronated grip that is slightly wider than shoulder width. Point the elbows out to sides. The bar should be close to the shins. Position the shoulders over or slightly ahead of the bar. Establish a flat back posture. This will be your starting position.","Begin to pull the bar by extending the knees. Move your hips forward and raise the shoulders at the same rate while keeping the angle of the back constant; continue to lift the bar straight up while keeping it close to your body.","As the bar passes the knee, extend at the ankles, knees, and hips forcefully, similar to a jumping motion. As you do so, continue to guide the bar with your hands, shrugging your shoulders and using the momentum from your movement to pull the bar as high as possible. The bar should travel close to your body, and you should keep your elbows out.","At maximum elevation, your feet should clear the floor and you should start to pull yourself under the bar. The mechanics of this could change slightly, depending on the weight used. You should descend into a squatting position as you pull yourself under the bar.","As the bar hits terminal height, rotate your elbows around and under the bar. Rack the bar across the front of the shoulders while keeping the torso erect and flexing the hips and knees to absorb the weight of the bar.","Stand to full height, holding the bar in the clean position.","Without moving your feet, press the bar overhead as you exhale. Lower the bar under control ."]},{id:"g-clock-push-up",name:"Clock Push-Up",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["front_delts","triceps"],equipment:["bodyweight"],laterality:"bilateral",bw:.65,metric:"weight_reps",steps:["Move into a prone position on the floor, supporting your weight on your hands and toes.","Your arms should be fully extended with the hands around shoulder width. Keep your body straight throughout the movement. This will be your starting position.","Descend by flexing at the elbow, lowering your chest toward the ground.",'At the bottom, reverse the motion by pushing yourself up through elbow extension as quickly as possible until you are air borne. Aim to "jump" 12-18 inches to one side.',"A
