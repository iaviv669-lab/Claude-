rimary:["chest"],secondary:["lats","front_delts","triceps"],equipment:["barbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Lie on a flat bench while holding a barbell using a palms down grip that is about 15 inches apart.","Place the bar on your upper thighs, extend your arms and lock them while keeping a slight bend on the elbows. This will be your starting position.","Now raise the weight using a semicircular motion and keeping your arms straight as you inhale. Continue the same movement until the bar is on the other side above your head . (Tip: the bar will travel approximately 180-degrees). At this point your arms should be parallel to the floor with the palms of your hands facing the ceiling.","Now return the barbell to the starting position by reversing the motion as you exhale.","Repeat for the recommended amount of repetitions."]},{id:"g-front-squat-clean-grip",name:"Front Squat (Clean Grip)",type:"compound_lower",pattern:"squat",primary:["quads"],secondary:["abs","glutes","hamstrings"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["To begin, first set the bar in a rack slightly below shoulder level. Rest the bar on top of the deltoids, pushing into the clavicles, and lightly touching the throat. Your hands should be in a clean grip, touching the bar only with your fingers to help keep it in position.","Lift the bar off the rack by first pushing with your legs and at the same time straightening your torso. Step away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head and elbows up at all times. This will be your starting position.","Bend at the knees, sitting down between your legs. Continue down until your hamstrings are on your calves. Keep your knees aligned with your feet by consciously using your abductors to push your knees out as you squat.","Begin to raise the bar as you exhale by pushing the floor mainly with the heel or middle of your foot as you straighten the legs again and return to the starting position."]},{id:"g-front-squats-with-two-kettlebells",name:"Front Squats with Two Kettlebells",type:"compound_lower",pattern:"squat",primary:["quads"],secondary:["calves","glutes"],equipment:["kettlebell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Clean two kettlebells to your shoulders. Clean the kettlebells to your shoulders by extending through the legs and hips as you pull the kettlebells towards your shoulders. Rotate your wrists as you do so.","Looking straight ahead at all times, squat as low as you can and pause at the bottom. As you squat down, push your knees out. You should squat between your legs, keeping an upright torso, with your head and chest up.","Rise back up by driving through your heels and repeat."]},{id:"g-front-two-dumbbell-raise",name:"Front Two-Dumbbell Raise",type:"isolation_upper",pattern:"isolation",primary:["front_delts"],secondary:[],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Pick a couple of dumbbells and stand with a straight torso and the dumbbells on front of your thighs at arms length with the palms of the hand facing your thighs. This will be your starting position.","While maintaining the torso stationary (no swinging), lift the dumbbells to the front with a slight bend on the elbow and the palms of the hands always facing down. Continue to go up until you arms are slightly above parallel to the floor. Exhale as you execute this portion of the movement and pause for a second at the top.","As you inhale, lower the dumbbells back down slowly to the starting position.","Repeat for the recommended amount of repetitions."]},{id:"e-front-foot-elevated-split-squat",name:"Front-Foot-Elevated Split Squat",type:"compound_lower",pattern:"lunge",primary:["quads","glutes"],secondary:[],equipment:["dumbbell"],laterality:"unilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-full-range-of-motion-lat-pulldown",name:"Full Range-Of-Motion Lat Pulldown",type:"compound_upper",pattern:"vertical_pull",primary:["lats"],secondary:["biceps","front_delts"],equipment:["machine","cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Either standing or seated on a high bench, grasp two stirrup cables that are attached to the high pulleys. Grab with the opposing hand so your arms are crisscrossed about you and your palms are facing forward.","Keeping your chest up and maintaining a slight arch in your lower back, pull the handles down as if you were doing a regular pulldown. The range of motion will be more of an arc. During the movement, rotate your hands so that in the bottom position your palms face each other rather than forward. Return slowly to the starting position and repeat."]},{id:"g-glute-kickback",name:"Glute Kickback",type:"compound_lower",pattern:"hinge",primary:["glutes"],secondary:["hamstrings"],equipment:["bodyweight"],laterality:"bilateral",bw:.6,metric:"weight_reps",steps:["Kneel on the floor or an exercise mat and bend at the waist with your arms extended in front of you (perpendicular to the torso) in order to get into a kneeling push-up position but with the arms spaced at shoulder width. Your head should be looking forward and the bend of the knees should create a 90-degree angle between the hamstrings and the calves. This will be your starting position.","As you exhale, lift up your right leg until the hamstrings are in line with the back while maintaining the 90-degree angle bend. Contract the glutes throughout this movement and hold the contraction at the top for a second. Tip: At the end of the movement the upper leg should be parallel to the floor while the calf should be perpendicular to it.","Go back to the initial position as you inhale and now repeat with the left leg.","Continue to alternate legs until all of the recommended repetitions have been performed."]},{id:"e-glute-ham-raise",name:"Glute-Ham Raise",type:"isolation_lower",pattern:"hinge",primary:["hamstrings","glutes"],secondary:[],equipment:["machine"],laterality:"bilateral",bw:.6,metric:"weight_reps",aliases:["ghr"]},{id:"g-good-morning-off-pins",name:"Good Morning off Pins",type:"compound_lower",pattern:"hinge",primary:["hamstrings"],secondary:["abs","glutes","lower_back"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Begin with a bar on a rack at about the same height as your stomach. Bend over underneath the bar and rack the bar across the rear of your shoulders as you would a power squat, not on top of your shoulders. At the proper height, you should be near parallel to the floor when bent over. Keep your back tight, shoulder blades pinched together, and your knees slightly bent. Keep your back arched and your cervical spine in proper alignment.","Begin the motion by extending through the hips with your glutes and hamstrings, and you are standing with the weight. Slowly lower the weight back to the pins returning to the starting position."]},{id:"g-gorilla-chin-crunch",name:"Gorilla Chin/Crunch",type:"core",pattern:"vertical_pull",primary:["abs"],secondary:["biceps","lats"],equipment:["pullup_bar"],laterality:"bilateral",bw:1,metric:"weight_reps",steps:["Hang from a chin-up bar using an underhand grip (palms facing you) that is slightly wider than shoulder width.","Now bend your knees at a 90 degree angle so that the calves are parallel to the floor while the thighs remain perpendicular to it. This will be your starting position.","As you exhale, pull yourself up while crunching your knees up at the same time until your knees are at chest level. You will stop going up as soon as your nose is at the same level as the bar. Tip: When you get to this point you should also be finishing the crunch at the same time.","Slowly start to inhale as you return to the starting position.","Repeat for the recommended amount of repetitions."]},{id:"e-hack-squat-machine-calf-raise",name:"Hack Squat Machine Calf Raise",type:"isolation_lower",pattern:"isolation",primary:["calves"],secondary:[],equipment:["machine"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-hammer-grip-incline-db-bench-press",name:"Hammer Grip Incline DB Bench Press",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["front_delts","triceps"],equipment:["dumbbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Lie back on an incline bench with a dumbbell on each hand on top of your thighs. The palms of your hand will be facing each other.","By using your thighs to help you get the dumbbells up, clean the dumbbells one arm at a time so that you can hold them at shoulder width.","Once at shoulder width, keep the palms of your hands with a neutral grip (palms facing each other). Keep your elbows flared out with the upper arms in line with the shoulders (perpendicular to the torso) and the elbows bent creating a 90-degree angle between the upper arm and the forearm. This will be your starting position.","Now bring down the weights slowly to your side as you breathe in. Keep full control of the dumbbells at all times.","As you breathe out, push the dumbbells up using your pectoral muscles. Lock your arms in the contracted position, hold for a second and then start coming down slowly. Tip: It should take at least twice as long to go down than to come up.","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the dumbbells back in your thighs and then on the floor. This is the safest manner to dispose of the dumbbells."]},{id:"e-hammer-strength-chest-press",name:"Hammer Strength Chest Press",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["triceps","front_delts"],equipment:["machine"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:["plate loaded chest press","iso-lateral chest press"]},{id:"e-hamstring-stretch",name:"Hamstring Stretch",type:"isolation_lower",pattern:"isolation",primary:["hamstrings"],secondary:[],equipment:["bodyweight"],laterality:"bilateral",bw:0,metric:"time",aliases:[]},{id:"e-handstand-push-up",name:"Handstand Push-Up",type:"compound_upper",pattern:"vertical_push",primary:["front_delts"],secondary:["triceps"],equipment:["bodyweight"],laterality:"bilateral",bw:1,metric:"weight_reps",aliases:[]},{id:"e-hang-clean",name:"Hang Clean",type:"compound_lower",pattern:"hinge",primary:["glutes","hamstrings"],secondary:["traps","quads"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-hang-power-clean",name:"Hang Power Clean",type:"compound_lower",pattern:"hinge",primary:["glutes","hamstrings"],secondary:["traps"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-hanging-bar-good-morning",name:"Hanging Bar Good Morning",type:"compound_lower",pattern:"hinge",primary:["hamstrings"],secondary:["abs","glutes","lower_back"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"time",steps:["Begin with a bar on a rack at about the same height as your stomach. Suspend the bar using chains or suspension straps.","Bend over underneath the bar and rack the bar across the rear of your shoulders as you would a power squat, not on top of your traps. At the proper height, you should be near parallel to the floor when bent over. Keep your back tight, shoulder blades pinched together, and your knees slightly bent. Keep your back arched and your cervical spine in proper alignment.","Begin the motion by extending through the hips with your glutes and hamstrings, and you are standing with the weight.","Slowly lower the weight back to the starting position, where it is supported by the chains."]},{id:"e-heels-elevated-goblet-squat",name:"Heels-Elevated Goblet Squat",type:"compound_lower",pattern:"squat",primary:["quads"],secondary:["glutes"],equipment:["dumbbell","kettlebell"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-helms-row",name:"Helms Row",type:"compound_upper",pattern:"horizontal_pull",primary:["upper_back"],secondary:["rear_delts"],equipment:["dumbbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-high-cable-curls",name:"High Cable Curls",type:"compound_upper",pattern:"horizontal_push",primary:["biceps"],secondary:[],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Stand between a couple of high pulleys and grab a handle in each arm. Position your upper arms in a way that they are parallel to the floor with the palms of your hands facing you. This will be your starting position.","Curl the handles towards you until they are next to your ears. Make sure that as you do so you flex your biceps and exhale. The upper arms should remain stationary and only the forearms should move. Hold for a second in the contracted position as you squeeze the biceps.","Slowly bring back the arms to the starting position.","Repeat for the recommended amount of repetitions."]},{id:"e-high-to-low-cable-fly",name:"High-to-Low Cable Fly",type:"isolation_upper",pattern:"isolation",primary:["chest"],secondary:[],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-hiking",name:"Hiking",type:"cardio",pattern:"carry",primary:["glutes","quads"],secondary:["calves"],equipment:["bodyweight"],laterality:"bilateral",bw:0,metric:"time",aliases:[]},{id:"g-hip-extension-with-bands",name:"Hip Extension with Bands",type:"compound_lower",pattern:"hinge",primary:["glutes"],secondary:["hamstrings"],equipment:["band"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Secure one end of the band to the lower portion of a post and attach the other to one ankle.","Facing the attachment point of the band, hold on to the column to stabilize yourself.","Keeping your head and your chest up, move the resisted leg back as far as you can while keeping the knee straight.","Return the leg to the starting position."]},{id:"g-hip-flexion-with-band",name:"Hip Flexion with Band",type:"compound_lower",pattern:"hinge",primary:["quads"],secondary:[],equipment:["band"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Secure one end of the band to the lower portion of a post and attach the other to one ankle.","Face away from the attachment point of the band.","Keeping your head and your chest up, raise your knee up to 90 degrees and pause.","Return the leg to the starting position."]},{id:"e-hip-flexor-stretch",name:"Hip Flexor Stretch",type:"isolation_lower",pattern:"isolation",primary:["quads"],secondary:[],equipment:["bodyweight"],laterality:"unilateral",bw:0,metric:"time",aliases:[]},{id:"g-hip-lift-with-band",name:"Hip Lift with Band",type:"compound_lower",pattern:"hinge",primary:["glutes"],secondary:["calves","hamstrings"],equipment:["band"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["After choosing a suitable band, lay down in the middle of the rack, after securing the band on either side of you. If your rack doesn't have pegs, the band can be secured using heavy dumbbells or similar objects, just ensure they won't move.","Adjust your position so that the band is directly over your hips. Bend your knees and place your feet flat on the floor. Your hands can be on the floor or holding the band in position.","Keeping your shoulders on the ground, drive through your heels to raise your hips, pushing into the band as high as you can.","Pause at the top of the motion, and return to the starting position."]},{id:"e-hollow-body-hold",name:"Hollow Body Hold",type:"core",pattern:"core",primary:["abs"],secondary:[],equipment:["bodyweight"],laterality:"bilateral",bw:0,metric:"time",aliases:[]},{id:"g-hyperextensions-with-no-hyperextension-bench",name:"Hyperextensions with No Hyperextension Bench",type:"compound_upper",pattern:"hinge",primary:["lower_back"],secondary:["glutes","hamstrings"],equipment:["bench"],laterality:"bilateral",bw:.6,metric:"weight_reps",steps:["With someone holding down your legs, slide yourself down to the edge a flat bench until your hips hang off the end of the bench. Tip: Your entire upper body should be hanging down towards the floor. Also, you will be in the same position as if you were on a hyperextension bench but the range of motion will be shorter due to the height of the flat bench vs. that of the hyperextension bench.","With your body straight, cross your arms in front of you (my preference) or behind your head. This will be your starting position. Tip: You can also hold a weight plate for extra resistance in front of you under your crossed arms.","Start bending forward slowly at the waist as far as you can while keeping your back flat. Inhale as you perform this movement. Keep moving forward until you almost touch the floor or you feel a nice stretch on the hamstrings (whichever comes first). Tip: Never round the back as you perform this exercise.","Slowly raise your torso back to the initial position as you exhale. Tip: Avoid the temptation to arch your back past a straight line. Also, do not swing the torso at any time in order to protect the back from injury.","Repeat for the recommended amount of repetitions."]},{id:"g-incline-barbell-triceps-extension",name:"Incline Barbell Triceps Extension",type:"isolation_upper",pattern:"isolation",primary:["triceps"],secondary:[],equipment:["barbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Hold a barbell with an overhand grip (palms down) that is a little closer together than shoulder width.","Lie back on an incline bench set at any angle between 45-75-degrees.","Bring the bar overhead with your arms extended and elbows in. The arms should be in line with the torso above the head. This will be your starting position.","Now lower the bar in a semicircular motion behind your head until your forearms touch your biceps. Inhale as you perform this movement. Tip: Keep your upper arms stationary and close to your head at all times. Only the forearms should move.","Return to the starting position as you breathe out and you contract the triceps. Hold the contraction for a second.","Repeat for the recommended amount of repetitions."]},{id:"g-incline-bench-pull",name:"Incline Bench Pull",type:"isolation_upper",pattern:"isolation",primary:["upper_back"],secondary:["front_delts","lats"],equipment:["barbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Grab a dumbbell in each hand and lie face down on an incline bench that is set to an incline that is approximately 30 degrees.","Let the arms hang to your sides fully extended as they point to the floor.","Turn the wrists until your hands have a pronated (palms down) grip.","Now flare the elbows out. This will be your starting position.",'As you breathe out, start to pull the dumbbells up as if you are doing a reverse bench press. You will do this by bending at the elbows and bringing the upper arms up as you let the forearms hang. Continue this motion until the upper arms are at the same level as your back. Tip: The elbows will come out to the side and your upper arms and torso should make the letter "T" at the top of the movement. Hold the contraction at the top for a second.',"Slowly go back down to the starting position as you breathe in.","Repeat for the recommended amount of repetitions."]},{id:"g-incline-cable-chest-press",name:"Incline Cable Chest Press",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["front_delts","triceps"],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Adjust the weight to an appropriate amount and be seated, grasping the handles. Your upper arms should be about 45 degrees to the body, with your head and chest up. The elbows should be bent to about 90 degrees. This will be your starting position.","Begin by extending through the elbow, pressing the handles together straight in front of you. Keep your shoulder blades retracted as you execute the movement.","After pausing at full extension, return to the starting position, keeping tension on the cables."]},{id:"e-incline-cable-fly",name:"Incline Cable Fly",type:"isolation_upper",pattern:"isolation",primary:["chest"],secondary:["front_delts"],equipment:["cable","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-incline-cable-flye",name:"Incline Cable Flye",type:"isolation_upper",pattern:"isolation",primary:["chest"],secondary:["front_delts"],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["To get yourself into the starting position, set the pulleys at the floor level (lowest level possible on the machine that is below your torso).","Place an incline bench (set at 45 degrees) in between the pulleys, select a weight on each one and grab a pulley on each hand.","With a handle on each hand, lie on the incline bench and bring your hands together at arms length in front of your face. This will be your starting position.","With a slight bend of your elbows (in order to prevent stress at the biceps tendon), lower your arms out at both sides in a wide arc until you feel a stretch on your chest. Breathe in as you perform this portion of the movement. Tip: Keep in mind that throughout the movement, the arms should remain stationary. The movement should only occur at the shoulder joint.","Return your arms back to the starting position as you squeeze your chest muscles and exhale. Hold the contracted position for a second. Tip: Make sure to use the same arc of motion used to lower the weights.","Repeat the movement for the prescribed amount of repetitions."]},{id:"g-incline-dumbbell-bench-with-palms-facing-in",name:"Incline Dumbbell Bench with Palms Facing in",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["front_delts","triceps"],equipment:["dumbbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Lie back on an incline bench with a dumbbell on each hand on top of your thighs. The palms of your hand will be facing each other.","By using your thighs to help you get the dumbbells up, clean the dumbbells one arm at a time so that you can hold them at shoulder width.","Once at shoulder width, keep the palms of your hands with a neutral grip (palms facing each other). Keep your elbows flared out with the upper arms in line with the shoulders (perpendicular to the torso) and the elbows bent creating a 90-degree angle between the upper arm and the forearm. This will be your starting position.","Now bring down the weights slowly to your side as you breathe in. Keep full control of the dumbbells at all times.","As you breathe out, push the dumbbells up using your pectoral muscles. Lock your arms in the contracted position, hold for a second and then start coming down slowly. Tip: It should take at least twice as long to go down than to come up.","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the dumbbells back in your thighs and then on the floor. This is the safest manner to dispose of the dumbbells."]},{id:"g-incline-dumbbell-flyes",name:"Incline Dumbbell Flyes",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["front_delts"],equipment:["dumbbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Hold a dumbbell on each hand and lie on an incline bench that is set to an incline angle of no more than 30 degrees.","Extend your arms above you with a slight bend at the elbows.","Now rotate the wrists so that the palms of your hands are facing you. Tip: The pinky fingers should be next to each other. This will be your starting position.","As you breathe in, start to slowly lower the arms to the side while keeping the arms extended and while rotating the wrists until the palms of the hand are facing each other. Tip: At the end of the movement the arms will be by your side with the palms facing the ceiling.","As you exhale start to bring the dumbbells back up to the starting position by reversing the motion and rotating the hands so that the pinky fingers are next to each other again. Tip: Keep in mind that the movement will only happen at the shoulder joint and at the wrist. There is no motion that happens at the elbow joint.","Repeat for the recommended amount of repetitions."]},{id:"g-incline-dumbbell-flyes-with-a-twist",name:"Incline Dumbbell Flyes - with a Twist",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["front_delts"],equipment:["dumbbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Hold a dumbbell in each hand and lie on an incline bench that is set to an incline angle of no more than 30 degrees.","Extend your arms above you with a slight bend at the elbows.","Now rotate the wrists so that the palms of your hands are facing you. Tip: The pinky fingers should be next to each other. This will be your starting position.","As you breathe in, start to slowly lower the arms to the side while keeping the arms extended and while rotating the wrists until the palms of the hand are facing each other. Tip: At the end of the movement the arms will be by your side with the palms facing the ceiling.","As you exhale start to bring the dumbbells back up to the starting position by reversing the motion and rotating the hands so that the pinky fingers are next to each other again. Tip: Keep in mind that the movement will only happen at the shoulder joint and at the wrist. There is no motion that happens at the elbow joint.","Repeat for the recommended amount of repetitions."]},{id:"g-incline-hammer-curls",name:"Incline Hammer Curls",type:"isolation_upper",pattern:"isolation",primary:["forearms"],secondary:[],equipment:["dumbbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Seat yourself on an incline bench with a dumbbell in each hand. You should pressed firmly against he back with your feet together. Allow the dumbbells to hang straight down at your side, holding them with a neutral grip. This will be your starting position.","Initiate the movement by flexing at the elbow, attempting to keep the upper arm stationary.","Continue to the top of the movement and pause, then slowly return to the start position."]},{id:"g-incline-inner-biceps-curl",name:"Incline Inner Biceps Curl",type:"isolation_upper",pattern:"isolation",primary:["biceps"],secondary:[],equipment:["dumbbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Hold a dumbbell in each hand and lie back on an incline bench.","The dumbbells should be at arm's length hanging at your sides and your palms should be facing out. This will be your starting position.","Now as you exhale curl the weight outward and up while keeping your forearms in line with your side deltoids. Continue the curl until the dumbbells are at shoulder height and to the sides of your deltoids. Tip: The end of the movement should look similar to a double biceps pose.","After a second contraction at the top of the movement, start to inhale and slowly lower the weights back to the starting position using the same path used to bring them up.","Repeat for the recommended amount of repetitions."]},{id:"e-incline-machine-chest-press",name:"Incline Machine Chest Press",type:"compound_upper",pattern:"horizontal_push",primary:["chest","front_delts"],secondary:["triceps"],equipment:["machine"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-incline-push-up",name:"Incline Push-Up",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["front_delts","triceps"],equipment:["bodyweight"],laterality:"bilateral",bw:.65,metric:"weight_reps",steps:["Stand facing bench or sturdy elevated platform. Place hands on edge of bench or platform, slightly wider than shoulder width.","Position forefoot back from bench or platform with arms and body straight. Arms should be perpendicular to body. Keeping body straight, lower chest to edge of box or platform by bending arms.","Push body up until arms are extended. Repeat."]},{id:"g-incline-push-up-close-grip",name:"Incline Push-Up Close-Grip",type:"compound_upper",pattern:"horizontal_push",primary:["triceps"],secondary:["chest","front_delts"],equipment:["bodyweight"],laterality:"bilateral",bw:.65,metric:"weight_reps",steps:["Stand facing a Smith machine bar or sturdy elevated platform at an appropriate height.","Place your hands next to one another on the bar.","Position your feet back from the bar with arms and body straight. This will be your starting position.","Keeping your body straight, lower your chest to the bar by bending the arms.","Return to the starting position by extending the elbows, pressing yourself back up."]},{id:"g-incline-push-up-medium",name:"Incline Push-Up Medium",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["abs","front_delts","triceps"],equipment:["bodyweight"],laterality:"bilateral",bw:.65,metric:"weight_reps",steps:["Stand facing a Smith machine bar or sturdy elevated platform at an appropriate height.","Place your hands on the bar, with your hands about shoulder width apart.","Position your feet back from the bar with arms and body straight. This will be your starting position.","Keeping your body straight, lower your chest to the bar by bending the arms.","Return to the starting position by extending the elbows, pressing yourself back up."]},{id:"g-incline-push-up-reverse-grip",name:"Incline Push-Up Reverse Grip",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["abs","front_delts","triceps"],equipment:["bodyweight"],laterality:"bilateral",bw:.65,metric:"weight_reps",steps:["Stand facing a Smith machine bar or sturdy elevated platform at an appropriate height.","Place your hands on the bar palms up, with your hands about shoulder width apart.","Position your feet back from the bar with arms and body straight. This will be your starting position.","Keeping your body straight, lower your chest to the bar by bending the arms.","Return to the starting position by extending the elbows, pressing yourself back up."]},{id:"g-incline-push-up-wide",name:"Incline Push-Up Wide",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["abs","front_delts","triceps"],equipment:["bodyweight"],laterality:"bilateral",bw:.65,metric:"weight_reps",steps:["Stand facing a Smith machine bar or sturdy elevated platform at an appropriate height.","Place your hands on the bar, with your hands wider than shoulder width.","Position your feet back from the bar with arms and body straight. Your arms should be perpendicular to the body. This will be your starting position.","Keeping your body straight, lower your chest to the bar by bending the arms.","Return to the starting position by extending the elbows, pressing yourself back up."]},{id:"e-incline-smith-machine-press",name:"Incline Smith Machine Press",type:"compound_upper",pattern:"horizontal_push",primary:["chest","front_delts"],secondary:["triceps"],equipment:["smith","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-incline-treadmill-walk",name:"Incline Treadmill Walk",type:"cardio",pattern:"carry",primary:["glutes","calves"],secondary:["hamstrings"],equipment:["machine"],laterality:"bilateral",bw:0,metric:"time",aliases:[]},{id:"g-internal-rotation-with-band",name:"Internal Rotation with Band",type:"isolation_upper",pattern:"isolation",primary:["rear_delts"],secondary:[],equipment:["band"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Choke the band around a post. The band should be at the same height as your elbow. Stand with your right side to the band a couple of feet away.","Grasp the end of the band with your right hand, and keep your elbow pressed firmly to your side. We recommend you hold a pad or foam roll in place with your elbow to keep it firmly in position.","With your upper arm in position, your elbow should be flexed to 90 degrees with your hand reaching away from your torso. This will be your starting position.","Execute the movement by rotating your arm in a forehand motion, keeping your elbow in place.","Continue as far as you are able, pause, and then return to the starting position."]},{id:"g-iron-cross",name:"Iron Cross",type:"compound_upper",pattern:"horizontal_push",primary:["side_delts"],secondary:["chest","glutes","hamstrings","lats","quads"],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Stand with feet shoulder-width apart, holding a light dumbbell in each hand in front of your thighs.","Squat down while raising your arms straight out in front of you to shoulder height.","Stand back up and open your arms out to the sides, still at shoulder height.","Lower the dumbbells back to your thighs and repeat."]},{id:"e-iso-lateral-pulldown-machine",name:"Iso-Lateral Pulldown Machine",type:"compound_upper",pattern:"vertical_pull",primary:["lats"],secondary:["biceps"],equipment:["machine"],laterality:"both",bw:0,metric:"weight_reps",aliases:["hammer strength pulldown"]},{id:"e-iso-lateral-row-machine",name:"Iso-Lateral Row Machine",type:"compound_upper",pattern:"horizontal_pull",primary:["upper_back","lats"],secondary:["biceps"],equipment:["machine"],laterality:"both",bw:0,metric:"weight_reps",aliases:["hammer strength row","plate loaded row"]},{id:"g-isometric-wipers",name:"Isometric Wipers",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["abs","front_delts","triceps"],equipment:["bodyweight"],laterality:"bilateral",bw:.6,metric:"weight_reps",steps:["Assume a push-up position, supporting your weight on your hands and toes while keeping your body straight. Your hands should be just outside of shoulder width. This will be your starting position.","Begin by shifting your body weight as far to one side as possible, allowing the elbow on that side to flex as you lower your body.","Reverse the motion by extending the flexed arm, pushing yourself up and then dropping to the other side.","Repeat for the desired number of repetitions."]},{id:"g-jackknife-sit-up",name:"Jackknife Sit-Up",type:"core",pattern:"core",primary:["abs"],secondary:[],equipment:["bodyweight"],laterality:"bilateral",bw:.6,metric:"weight_reps",steps:["Lie flat on the floor (or exercise mat) on your back with your arms extended straight back behind your head and your legs extended also. This will be your starting position.","As you exhale, bend at the waist while simultaneously raising your legs and arms to meet in a jackknife position. Tip: The legs should be extended and lifted at approximately a 35-45 degree angle from the floor and the arms should be extended and parallel to your legs. The upper torso should be off the floor.","While inhaling, lower your arms and legs back to the starting position.","Repeat for the recommended amount of repetitions."]},{id:"g-janda-sit-up",name:"Janda Sit-Up",type:"core",pattern:"core",primary:["abs"],secondary:[],equipment:["bodyweight"],laterality:"bilateral",bw:.3,metric:"weight_reps",steps:["Position your body on the floor in the basic sit-up position; knees to a ninety degree angle with feet flat on the floor and arms either crossed over your chest or to the sides. This will be your starting position.","As you strongly tighten your glutes and hamstrings, fill your lungs with air and in a slow (three to six second count) ascent, slowly exhale. Tip: It is important to tighten the glutes and hamstrings as this will cause the hip flexors to be inactivated in a process called reciprocal inhibition, which basically means that opposite muscles to the contracted ones will relax.","As you inhale, slowly go back in a controlled manner to the starting position.","Repeat for the recommended amount of repetitions."]},{id:"e-jefferson-curl",name:"Jefferson Curl",type:"isolation_lower",pattern:"hinge",primary:["lower_back","hamstrings"],secondary:[],equipment:["barbell","dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-jefferson-squats",name:"Jefferson Squats",type:"compound_lower",pattern:"squat",primary:["quads"],secondary:["calves","glutes","hamstrings","lats"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Place a barbell on the floor.","Stand in the middle of the bar length wise.","Bend down by bending at the knees and keeping your back straight and grasp the front of the bar with your right hand. Your palm should be in (neutral grip) facing the left side.","Grasp the rear of the bar with your left hand. The palm of your hand should be in neutral grip alignment (palms facing the right side). Tip: Ensure that your grip is even on the bar. Your torso should be positioned right in the middle of the bar and the distance between your torso and your right hand (which should be at the front) should be the same as the distance between your torso and your left hand (which should be to your back).","Now stand straight up with the weight. Tip: Your feet should be shoulder width apart and your toes slightly pointed out.","Squat down by bending at the knees and keeping your back straight until your upper thighs are parallel with the floor. Tip: Keep your back as vertical as possible with the floor and your head up. Also remember to not let your knees go past your toes. Inhale during this portion of the movement.","Now drive yourself back up to the starting position by pushing with the feet . Tip: Keep the bar hanging at arm's length and your elbows locked with a slight bend. The arms only serve as hooks. Avoid doing any lifting with them. Do the lifting with your thighs; not your arms."]},{id:"g-jm-press",name:"JM Press",type:"compound_upper",pattern:"horizontal_push",primary:["triceps"],secondary:["chest","front_delts"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Start the exercise the same way you would a close grip bench press. You will lie on a flat bench while holding a barbell at arms length (fully extended) with the elbows in. However, instead of having the arms perpendicular to the torso, make sure the bar is set in a direct line above the upper chest. This will be your starting position.","Now beginning from a fully extended position lower the bar down as if performing a lying triceps extension. Inhale as you perform this movement. When you reach the half way point, let the bar roll back about one inch by moving the upper arms towards your legs until they are perpendicular to the torso. Tip: Keep the bend at the elbows constant as you bring the upper arms forward.","As you exhale, press the bar back up by using the triceps to perform a close grip bench press.","Now go back to the starting position and start over.","Repeat for the recommended amount of repetitions."]},{id:"e-jump-rope",name:"Jump Rope",type:"cardio",pattern:"carry",primary:["calves"],secondary:["quads"],equipment:["bodyweight"],laterality:"bilateral",bw:0,metric:"time",aliases:["skipping"]},{id:"e-jumping-jacks",name:"Jumping Jacks",type:"cardio",pattern:"carry",primary:["calves"],secondary:["side_delts"],equipment:["bodyweight"],laterality:"bilateral",bw:0,metric:"time",aliases:[]},{id:"g-kettlebell-arnold-press",name:"Kettlebell Arnold Press",type:"compound_upper",pattern:"vertical_push",primary:["front_delts"],secondary:["triceps"],equipment:["kettlebell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Clean a kettlebell to your shoulder. Clean the kettlebell to your shoulder by extending through the legs and hips as you raise the kettlebell towards your shoulder. The palm should be facing inward.","Looking straight ahead, press the kettlebell out and overhead, rotating your wrist so that your palm faces forward at the top of the motion.","Return the kettlebell to the starting position, with the palm facing in."]},{id:"g-kettlebell-dead-clean",name:"Kettlebell Dead Clean",type:"compound_lower",pattern:"hinge",primary:["hamstrings"],secondary:["calves","glutes","lats","quads"],equipment:["kettlebell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Place kettlebell between your feet. To get in the starting position, push your butt back and look straight ahead.","Clean the kettlebell to your shoulder. Clean the kettlebell to your shoulders by extending through the legs and hips as you raise the kettlebell towards your shoulder. The wrist should rotate as you do so.","Lower the kettlebell, keeping the hamstrings loaded by keeping your back straight and your butt out."]},{id:"g-kettlebell-figure-8",name:"Kettlebell Figure 8",type:"core",pattern:"core",primary:["abs"],secondary:["hamstrings","front_delts"],equipment:["kettlebell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Place one kettlebell between your legs and take a wider than shoulder width stance. Bend over by pushing your butt out and keeping your back flat.","Pick up a kettlebell and pass it to your other hand between your legs. The receiving hand should reach from behind the legs. Go back and forth for several repetitions."]},{id:"g-kettlebell-goblet-squat",name:"Kettlebell Goblet Squat",type:"compound_lower",pattern:"squat",primary:["quads"],secondary:["glutes"],equipment:["kettlebell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Stand holding a light kettlebell by the horns close to your chest. This will be your starting position.","Squat down between your legs until your hamstrings are on your calves. Keep your chest and head up and your back straight.","At the bottom position, pause and use your elbows to push your knees out. Return to the starting position, and repeat for 10-20 repetitions."]},{id:"g-kettlebell-halo",name:"Kettlebell Halo",type:"compound_upper",pattern:"horizontal_push",primary:["rear_delts"],secondary:["lats","abs","triceps"],equipment:["kettlebell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Stand tall with your feet hip-width apart. Hold a kettlebell upside down by the horns, with the bell above your hands and close to your chest. Brace your abdominals and squeeze your glutes so your ribcage stays down. This is your starting position.","Keeping your elbows close to your head, move the kettlebell up past one ear and around behind your head.","Continue the circle past the opposite ear and back down to the starting position in front of your chest, letting the bell pass close to your body throughout.","Complete the prescribed number of circles in one direction, then repeat the same number in the opposite direction.","Move slowly and keep your head, hips and lower back still. If your lower back arches or the bell drifts far from your head, use a lighter weight."]},{id:"g-kettlebell-halo-with-overhead-extension",name:"Kettlebell Halo with Overhead Extension",type:"compound_upper",pattern:"horizontal_push",primary:["rear_delts"],secondary:["lats","abs"],equipment:["kettlebell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Stand tall with your feet hip-width apart. Hold a kettlebell upside down by the horns, with the bell above your hands and close to your chest. Brace your abdominals and squeeze your glutes so your ribcage stays down. This is your starting position.","Keeping your elbows close to your head, move the kettlebell up past one ear and around until it sits behind your head. Pause here.","From this position, extend your elbows to press the kettlebell up and overhead until your arms are straight, keeping your upper arms alongside your head.","Bend your elbows to lower the kettlebell back to the pause position behind your head, under control.","Continue the circle past the opposite ear and back down to the starting position in front of your chest to complete one repetition.","Alternate the direction of the circle on each repetition. Keep your head, hips and lower back still throughout; if your lower back arches or you cannot reach the overhead position without leaning back, use a lighter weight or perform the halo and the extension as separate exercises."]},{id:"g-kettlebell-hang-clean",name:"Kettlebell Hang Clean",type:"compound_lower",pattern:"hinge",primary:["hamstrings"],secondary:["calves","glutes","lats","front_delts"],equipment:["kettlebell"],laterality:"bilateral",bw:0,metric:"time",steps:["Place kettlebell between your feet. To get in the starting position, push your butt back and look straight ahead.","Clean kettlebell to your shoulder. Clean the kettlebell to your shoulders by extending through the legs and hips as you raise the kettlebell towards your shoulder. The wrist should rotate as you do so.","Lower kettlebell to a hanging position between your legs while keeping the hamstrings loaded. Keep your head up at all times."]},{id:"g-kettlebell-one-legged-deadlift",name:"Kettlebell One-Legged Deadlift",type:"compound_lower",pattern:"hinge",primary:["hamstrings"],secondary:["glutes","lower_back"],equipment:["kettlebell"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["Hold a kettlebell by the handle in one hand. Stand on one leg, on the same side that you hold the kettlebell.","Keeping that knee slightly bent, perform a stiff legged deadlift by bending at the hip, extending your free leg behind you for balance.","Continue lowering the kettlebell until you are parallel to the ground, and then return to the upright position."]},{id:"g-kettlebell-overhead-triceps-extension",name:"Kettlebell Overhead Triceps Extension",type:"isolation_upper",pattern:"isolation",primary:["triceps"],secondary:["front_delts","abs"],equipment:["kettlebell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Stand with your feet hip-width apart, holding a kettlebell by the horns with both hands. Press it overhead until your arms are extended, with the bell hanging behind your hands.","Brace your abdominals and keep your upper arms vertical and close to your head. This is your starting position.","Bend at the elbows to lower the kettlebell behind your head, going as far as your shoulder mobility allows without your elbows flaring outward.","Extend your elbows to press the kettlebell back to the starting position, keeping your upper arms still throughout.","Keep your ribcage down and avoid arching your lower back as you extend."]},{id:"g-kettlebell-pass-between-the-legs",name:"Kettlebell Pass Between the Legs",type:"core",pattern:"core",primary:["abs"],secondary:["glutes","hamstrings","front_delts"],equipment:["kettlebell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Place one kettlebell between your legs and take a comfortable stance. Bend over by pushing your butt out and keeping your back flat.",'Pick up a kettlebell and pass it to your other hand between your legs, in the fashion of a "W". Go back and forth for several repetitions.']},{id:"g-kettlebell-pirate-ships",name:"Kettlebell Pirate Ships",type:"compound_upper",pattern:"horizontal_push",primary:["front_delts"],secondary:["abs"],equipment:["kettlebell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["With a wide stance, hold a kettlebell with both hands. Allow it to hang at waist level with your arms extended. This will be your starting position.","Initiate the movement by turning to one side, swinging the kettlebell to head height. Briefly pause at the top of the motion.","Allow the bell to drop as you rotate to the opposite side, again raising the kettlebell to head height.","Repeat for the desired amount of repetitions."]},{id:"g-kettlebell-seated-press",name:"Kettlebell Seated Press",type:"compound_upper",pattern:"horizontal_push",primary:["front_delts"],secondary:["triceps"],equipment:["kettlebell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Sit on the floor and spread your legs out comfortably.","Clean one kettlebell to your shoulder.","Press the kettlebell up and out until it is locked out overhead. Return to the starting position."]},{id:"g-kettlebell-seesaw-press",name:"Kettlebell Seesaw Press",type:"compound_upper",pattern:"horizontal_push",primary:["front_delts"],secondary:["triceps"],equipment:["kettlebell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Clean two kettlebells two your shoulders.","Press one kettlebell.","Lower the kettlebell and immediately press the other kettlebell. Make sure to do the same amount of reps on both sides."]},{id:"g-kettlebell-sumo-high-pull",name:"Kettlebell Sumo High Pull",type:"compound_upper",pattern:"horizontal_push",primary:["upper_back"],secondary:["glutes","hamstrings","quads","front_delts","lats"],equipment:["kettlebell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Place a kettlebell on the ground between your feet. Position your feet in a wide stance, and grasp the kettlebell with two hands. Set your hips back as far as possible, with your knees bent. Keep your chest and head up. This will be your starting position.","Begin by extending the hips and knees, simultaneously pulling the kettlebell to your shoulders, raising your elbows as you do so. Reverse the motion to return to the starting position."]},{id:"g-kettlebell-thruster",name:"Kettlebell Thruster",type:"compound_upper",pattern:"horizontal_push",primary:["front_delts"],secondary:["quads","triceps"],equipment:["kettlebell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Clean two kettlebells to your shoulders. Clean the kettlebells to your shoulders by extending through the legs and hips as you pull the kettlebells towards your shoulders. Rotate your wrists as you do so. This will be your starting position.","Begin to squat by flexing your hips and knees, lowering your hips between your legs. Maintain an upright, straight back as you descend as low as you can.","At the bottom, reverse direction and squat by extending your knees and hips, driving through your heels. As you do so, press both kettlebells overhead by extending your arms straight up, using the momentum from the squat to help drive the weights upward.","As you begin the next repetition, return the weights to the shoulders."]},{id:"g-kettlebell-turkish-get-up-lunge-style",name:"Kettlebell Turkish Get-Up (Lunge Style)",type:"compound_upper",pattern:"lunge",primary:["front_delts"],secondary:["abs","hamstrings","quads","triceps"],equipment:["kettlebell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Lie on your back on the floor and press a kettlebell to the top position by extending the elbow. Bend the knee on the same side as the kettlebell.","Keeping the kettlebell locked out at all times, pivot to the opposite side and use your non- working arm to assist you in driving forward to the lunge position. Using your free hand, push yourself to a seated position, then progressing to one knee.","While looking up at the kettlebell, slowly stand up. Reverse the motion back to the starting position and repeat."]},{id:"g-kettlebell-turkish-get-up-squat-style",name:"Kettlebell Turkish Get-Up (Squat Style)",type:"compound_upper",pattern:"squat",primary:["front_delts"],secondary:["abs","calves","hamstrings","quads","triceps"],equipment:["kettlebell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Lie on your back on the floor and press a kettlebell to the top position by extending the elbow. Bend the knee on the same side as the kettlebell.","Keeping the kettlebell locked out at all times, pivot to the opposite side and use your non- working arm to assist you in driving forward to the lunge position.","Using your free hand, push yourself to a seated position, then progressing to your feet. While looking up at the kettlebell, slowly stand up. Reverse the motion back to the starting position and repeat."]},{id:"g-kettlebell-windmill",name:"Kettlebell Windmill",type:"core",pattern:"core",primary:["obliques"],secondary:["glutes","hamstrings","front_delts","triceps"],equipment:["kettlebell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Place a kettlebell in front of your lead foot and clean and press it overhead with your opposite arm. Clean the kettlebell to your shoulder by extending through the legs and hips as you pull the kettlebell towards your shoulders. Rotate your wrist as you do so, so that the palm faces forward. Press it overhead by extending the elbow.","Keeping the kettlebell locked out at all times, push your butt out in the direction of the locked out kettlebell. Turn your feet out at a forty-five degree angle from the arm with the locked out kettlebell. Bending at the hip to one side, sticking your butt out, slowly lean until you can touch the floor with your free hand. Keep your eyes on the kettlebell that you hold over your head at all times.","Pause for a second after reaching the ground and reverse the motion back to the starting position."]},{id:"g-kneeling-cable-crunch-with-alternating-oblique-twists",name:"Kneeling Cable Crunch with Alternating Oblique Twists",type:"core",pattern:"core",primary:["obliques"],secondary:[],equipment:["cable"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["Connect a rope attachment to a high pulley cable and position a mat on the floor in front of it.","Grab the rope with both hands and kneel approximately two feet back from the tower.","Position the rope behind your head with your hands by your ears.","Keep your hands in the same place, contract your abs and pull downward on the rope in a crunching movement until your elbows reach your knees.","Pause briefly at the bottom and rise up in a slow and controlled manner until you reach the starting position.","Repeat the same downward movement until you're halfway down, at which time you'll begin rotating one of your elbows to the opposite knee.","Again, pause briefly at the bottom and rise up in a slow and controlled manner until you reach the starting position.","Repeat the same movement as before, but alternate the other elbow to the opposite knee.","Continue this series of movements to failure."]},{id:"g-kneeling-cable-triceps-extension",name:"Kneeling Cable Triceps Extension",type:"isolation_upper",pattern:"isolation",primary:["triceps"],secondary:[],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Place a bench sideways in front of a high pulley machine.","Hold a straight bar attachment above your head with your hands about 6 inches apart with your palms facing down.","Face away from the machine and kneel.","Place your head and the back of your upper arms on the bench. Your elbows should be bent with the forearms pointing towards the high pulley. This will be your starting position.","While keeping your upper arms close to your head at all times with the elbows in, press the bar out in a semicircular motion until the elbows are locked and your arms are parallel to the floor. Contract the triceps hard and keep this position for a second. Exhale as you perform this movement.","Slowly return to the starting position as you breathe in.","Repeat for the recommended amount of repetitions."]},{id:"g-kneeling-high-pulley-row",name:"Kneeling High Pulley Row",type:"compound_upper",pattern:"horizontal_pull",primary:["upper_back"],secondary:["biceps","lats"],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Select the appropriate weight using a pulley that is above your head. Attach a rope to the cable and kneel a couple of feet away, holding the rope out in front of you with both arms extended. This will be your starting position.","Initiate the movement by flexing the elbows and fully retracting your shoulders, pulling the rope toward your upper chest with your elbows out.","After pausing briefly, slowly return to the starting position."]},{id:"e-kneeling-lat-pulldown",name:"Kneeling Lat Pulldown",type:"compound_upper",pattern:"vertical_pull",primary:["lats"],secondary:["biceps"],equipment:["cable"],laterality:"unilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-kneeling-single-arm-high-pulley-row",name:"Kneeling Single-Arm High Pulley Row",type:"compound_upper",pattern:"horizontal_pull",primary:["upper_back"],secondary:["biceps","lats"],equipment:["cable"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["Attach a single handle to a high pulley and make your weight selection.","Kneel in front of the cable tower, taking the cable with one hand with your arm extended. This will be your starting position.","Starting with your palm facing forward, pull the weight down to your torso by flexing the elbow and retract the shoulder blade. As you do so, rotate the wrist so that at the completion of the movement, your palm is now facing you.","After a brief pause, return to the starting position."]},{id:"g-kneeling-squat",name:"Kneeling Squat",type:"compound_lower",pattern:"squat",primary:["glutes"],secondary:["abs","hamstrings","lats"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Set the bar to the proper height in a power rack. Kneel behind the bar; it may be beneficial to put a mat down to pad your knees. Slide under the bar, racking it across the back of your shoulders. Your shoulder blades should be retracted and the bar tight across your back. Unrack the weight.","With your head looking forward, sit back with your butt until you touch your calves.","Reverse the motion, returning the torso to an upright position."]},{id:"e-kroc-row",name:"Kroc Row",type:"compound_upper",pattern:"horizontal_pull",primary:["lats","upper_back"],secondary:["biceps","forearms"],equipment:["dumbbell"],laterality:"unilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-l-sit",name:"L-Sit",type:"core",pattern:"core",primary:["abs"],secondary:["triceps"],equipment:["bodyweight","dip_bars"],laterality:"bilateral",bw:0,metric:"time",aliases:[]},{id:"g-landmine-180-s",name:"Landmine 180's",type:"core",pattern:"core",primary:["abs"],secondary:["glutes","lats","front_delts"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Position a bar into a landmine or securely anchor it in a corner. Load the bar to an appropriate weight.","Raise the bar from the floor, taking it to shoulder height with both hands with your arms extended in front of you. Adopt a wide stance. This will be your starting position.","Perform the movement by rotating the trunk and hips as you swing the weight all the way down to one side. Keep your arms extended throughout the exercise.","Reverse the motion to swing the weight all the way to the opposite side.","Continue alternating the movement until the set is complete."]},{id:"g-landmine-linear-jammer",name:"Landmine Linear Jammer",type:"compound_upper",pattern:"horizontal_push",primary:["front_delts"],secondary:["abs","calves","chest","hamstrings","quads","triceps"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Position a bar into landmine or, lacking one, securely anchor it in a corner. Load the bar to an appropriate weight and position the handle attachment on the bar.","Raise the bar from the floor, taking the handles to your shoulders. This will be your starting position.","In an athletic stance, squat by flexing your hips and setting your hips back, keeping your arms flexed.","Reverse the motion by powerfully extending through the hips, knees, and ankles, while also extending the elbows to straighten the arms. This movement should be done explosively, coming out of the squat to full extension as powerfully as possible.","Return to the starting position."]},{id:"e-landmine-press",name:"Landmine Press",type:"compound_upper",pattern:"vertical_push",primary:["front_delts"],secondary:["chest","triceps"],equipment:["barbell"],laterality:"unilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-landmine-rotation",name:"Landmine Rotation",type:"core",pattern:"core",primary:["obliques"],secondary:["front_delts"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-larsen-press",name:"Larsen Press",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["triceps"],equipment:["barbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-lateral-lunge",name:"Lateral Lunge",type:"compound_lower",pattern:"lunge",primary:["adductors","quads"],secondary:["glutes"],equipment:["dumbbell"],laterality:"unilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-lateral-raise-with-bands",name:"Lateral Raise - with Bands",type:"isolation_upper",pattern:"isolation",primary:["side_delts"],secondary:[],equipment:["band"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["To begin, stand on an exercise band so that tension begins at arm's length. Grasp the handles using a pronated (palms facing your thighs) grip that is slightly less than shoulder width. The handles should be resting on the sides of your thighs. Your arms should be extended with a slight bend at the elbows and your back should be straight. This will be your starting position.","Use your side shoulders to lift the handles to the sides as you exhale. Continue to lift the handles until they are slightly above parallel. Tip: As you lift the handles, slightly tilt the hand as if you were pouring water and keep your arms extended. Also, keep your torso stationary and pause for a second at the top of the movement.","Lower the handles back down slowly to the starting position. Inhale as you perform this portion of the movement.","Repeat for the recommended amount of repetitions."]},{id:"e-lean-away-lateral-raise",name:"Lean-Away Lateral Raise",type:"isolation_upper",pattern:"isolation",primary:["side_delts"],secondary:[],equipment:["dumbbell","cable"],laterality:"unilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-leg-curl",name:"Leg Curl",type:"isolation_lower",pattern:"isolation",primary:["hamstrings"],secondary:[],equipment:["machine"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Adjust the machine lever to fit your height and lie face down on the leg curl machine with the pad of the lever on the back of your legs (just a few inches under the calves). Tip: Preferably use a leg curl machine that is angled as opposed to flat since an angled position is more favorable for hamstrings recruitment.","Keeping the torso flat on the bench, ensure your legs are fully stretched and grab the side handles of the machine. Position your toes straight (or you can also use any of the other two stances described on the foot positioning section). This will be your starting position.","As you exhale, curl your legs up as far as possible without lifting the upper legs from the pad. Once you hit the fully contracted position, hold it for a second.","As you inhale, bring the legs back to the initial position. Repeat for the recommended amount of repetitions."]},{id:"g-leg-lift",name:"Leg Lift",type:"isolation_lower",pattern:"isolation",primary:["glutes"],secondary:["hamstrings"],equipment:["bodyweight"],laterality:"bilateral",bw:.3,metric:"weight_reps",steps:["While standing up straight with both feet next to each other at around shoulder width, grab a sturdy surface such as the sides of a squat rack or the top of a chair to brace yourself and keep balance.","With or without an ankle weight, lift one leg behind you as if performing a leg curl but standing up while keeping the other leg straight. Breathe out as you perform this movement.","Slowly bring the raised leg back to the floor as you breathe in.","Repeat for the recommended amount of repetitions.","Repeat the movement with the opposite leg."]},{id:"g-leg-pull-in",name:"Leg Pull-In",type:"core",pattern:"core",primary:["abs"],secondary:[],equipment:["bodyweight"],laterality:"bilateral",bw:.6,metric:"weight_reps",steps:["Lie on an exercise mat with your legs extended and your hands either palms facing down next to you or under your glutes. Tip: My preference is with the hands next to me. This will be your starting position.","Bend your knees and pull your upper thighs into your midsection as you breathe out. Continue the motion until your knees are around chest level. Contract your abs as you execute this movement and hold for a second at the top. Tip: As you perform the motion, the lower legs (calves) should always remain parallel to the floor.","Return to the starting position as you inhale.","Repeat for the recommended amount of repetitions."]},{id:"g-leg-over-floor-press",name:"Leg-Over Floor Press",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["front_delts","triceps"],equipment:["kettlebell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Lie on the floor with one kettlebell in place on your chest, holding it by the handle. Extend leg on working side over leg on non-working side.Your free arm can be extended out to your side for support.","Press the kettlebll into a locked out position.","Lower the weight until the elbow touches the ground, keeping the kettlebell above the elbow. Repeat for the desired number of repetitions."]},{id:"g-leverage-decline-chest-press",name:"Leverage Decline Chest Press",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["front_delts","triceps"],equipment:["machine"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Load an appropriate weight onto the pins and adjust the seat for your height. The handles should be near the bottom of the pectorals at the beginning of the motion. Your chest and head should be up and your shoulder blades retracted. This will be your starting position.","Press the handles forward by extending through the elbow.","After a brief pause at the top, return the weight just above the start position, keeping tension on the muscles by not returning the weight to the stops until the set is complete."]},{id:"g-leverage-high-row",name:"Leverage High Row",type:"compound_upper",pattern:"horizontal_pull",primary:["upper_back"],secondary:["lats"],equipment:["machine"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Load an appropriate weight onto the pins and adjust the seat height so that you can just reach the handles above you. Adjust the knee pad to help keep you down. Grasp the handles with a pronated grip. This will be your starting position.","Pull the handles towards your torso, retracting your shoulder blades as you flex the elbow.","Pause at the bottom of the motion, and then slowly return the handles to the starting position.","For multiple repetitions, avoid completely returning the weight to the stops to keep tension on the muscles being worked."]},{id:"g-leverage-incline-chest-press",name:"Leverage Incline Chest Press",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["front_delts","triceps"],equipment:["machine"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Load an appropriate weight onto the pins and adjust the seat for your height. The handles should be near the top of the pectorals at the beginning of the motion. Your chest and head should be up and your shoulder blades retracted. This will be your starting position.","Press the handles forward by extending through the elbow.","After a brief pause at the top, return the weight just above the start position, keeping tension on the muscles by not returning the weight to the stops until the set is complete."]},{id:"g-leverage-shoulder-press",name:"Leverage Shoulder Press",type:"compound_upper",pattern:"vertical_push",primary:["front_delts"],secondary:["triceps"],equipment:["machine"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Load an appropriate weight onto the pins and adjust the seat for your height. The handles should be near the top of the shoulders at the beginning of the motion. Your chest and head should be up and handles held with a pronated grip. This will be your starting position.","Press the handles upward by extending through the elbow.","After a brief pause at the top, return the weight to just above the start position, keeping tension on the muscles by not returning the weight to the stops until the set is complete."]},{id:"e-log-press",name:"Log Press",type:"compound_upper",pattern:"vertical_push",primary:["front_delts"],secondary:["triceps","chest"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-low-cable-crossover",name:"Low Cable Crossover",type:"isolation_upper",pattern:"isolation",primary:["chest"],secondary:["front_delts"],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["To move into the starting position, place the pulleys at the low position, select the resistance to be used and grasp a handle in each hand.","Step forward, gaining tension in the pulleys. Your palms should be facing forward, hands below the waist, and your arms straight. This will be your starting position.","With a slight bend in your arms, draw your hands upward and toward the midline of your body. Your hands should come together in front of your chest, palms facing up.","Return your arms back to the starting position after a brief pause."]},{id:"g-low-cable-triceps-extension",name:"Low Cable Triceps Extension",type:"isolation_upper",pattern:"isolation",primary:["triceps"],secondary:[],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Select the desired weight and lay down face up on the bench of a seated row machine that has a rope attached to it. Your head should be pointing towards the attachment.","Grab the outside of the rope ends with your palms facing each other (neutral grip).","Position your elbows so that they are bent at a 90 degree angle and your upper arms are perpendicular (90 degree angle) to your torso. Tip: Keep the elbows in and make sure that the upper arms point to the ceiling while your forearms point towards the pulley above your head. This will be your starting position.","As you breathe out, extend your lower arms until they are straight and vertical. The upper arms and elbows remain stationary throughout the movement. Only the forearms should move. Contract the triceps hard for a second.","As you breathe in slowly return to the starting position.","Repeat for the recommended amount of repetitions."]},{id:"g-low-pulley-row-to-neck",name:"Low Pulley Row to Neck",type:"compound_upper",pattern:"horizontal_pull",primary:["front_delts"],secondary:["biceps","upper_back"],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Sit on a low pulley row machine with a rope attachment.","Grab the ends of the rope using a palms-down grip and sit with your back straight and your knees slightly bent. Tip: Keep your back almost completely vertical and your arms fully extended in front of you. This will be your starting position.","While keeping your torso stationary, lift your elbows and start bending them as you pull the rope towards your neck while exhaling. Throughout the movement your upper arms should remain parallel to the floor. Tip: Continue this motion until your hands are almost next to your ears (the forearms will not be parallel to the floor at the end of the movement as they will be angled a bit upwards) and your elbows are out away from your sides.","After holding for a second or so at the contracted position, come back slowly to the starting position as you inhale. Tip: Again, during no part of the movement should the torso move.","Repeat for the recommended amount of repetitions."]},{id:"e-low-to-high-cable-fly",name:"Low-to-High Cable Fly",type:"isolation_upper",pattern:"isolation",primary:["chest"],secondary:["front_delts"],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-lu-raise",name:"Lu Raise",type:"isolation_upper",pattern:"isolation",primary:["side_delts","front_delts"],secondary:[],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-lunge-pass-through",name:"Lunge Pass Through",type:"compound_lower",pattern:"lunge",primary:["hamstrings"],secondary:["calves","glutes","quads"],equipment:["kettlebell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Stand with your torso upright holding a kettlebell in your right hand. This will be your starting position.","Step forward with your left foot and lower your upper body down by flexing the hip and the knee, keeping the torso upright. Lower your back knee until it nearly touches the ground.","As you lunge, pass the kettlebell under your front leg to your opposite hand.","Pressing through the heel of your foot, return to the starting position.","Repeat the movement for the recommended amount of repetitions, alternating legs."]},{id:"g-lying-cable-curl",name:"Lying Cable Curl",type:"isolation_upper",pattern:"isolation",primary:["biceps"],secondary:[],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Grab a straight bar or E-Z bar attachment that is attached to the low pulley with both hands, using an underhand (palms facing up) shoulder-width grip.","Lie flat on your back on top of an exercise mat in front of the weight stack with your feet flat against the frame of the pulley machine and your legs straight.","With your arms extended and your elbows close to your body slightly bend your arms. This will be your starting position.","While keeping your upper arms stationary and the elbows close to your body, curl the bar up slowly toward your chest as you breathe out and you squeeze the biceps.","After a second squeeze at the top of the movement, slowly return to the starting position.","Repeat for the recommended amount of repetitions."]},{id:"g-lying-cambered-barbell-row",name:"Lying Cambered Barbell Row",type:"isolation_upper",pattern:"horizontal_pull",primary:["upper_back"],secondary:["biceps","lats"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Place a cambered bar underneath an exercise bench.","Lie face down on the exercise bench and grab the bar using a palms down (pronated grip) that is wider than shoulder width. This will be your starting position.","As you exhale row the bar up as you keep the elbows close to your body to either your chest, in order to target the upper mid back, or to your stomach if targeting the lats is your goal.","After a second hold at the top, lower back down to the starting position slowly as you inhale."]},{id:"g-lying-close-grip-bar-curl-on-high-pulley",name:"Lying Close-Grip Bar Curl on High Pulley",type:"isolation_upper",pattern:"isolation",primary:["biceps"],secondary:[],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Place a flat bench in front of a high pulley or lat pulldown machine.","Hold the straight bar attachment using an underhand grip (palms up) that is about shoulder width.","Lie on your back with your head over the end of the bench.","Now extend your arms straight above your shoulders. Your torso and your arms should make a 90-degree angle and the elbows should be in. This will be your starting position.","As you breathe out, curl the bar down in a semicircular motion until it touches your chin. Squeeze the biceps for a second at the top contracted position. Tip: As you execute this motion only the forearms should move. At no time should the upper arms be moving at all. They are to remain perpendicular throughout the movement.","Return to starting position slowly.","Repeat for the recommended amount of repetitions."]},{id:"g-lying-close-grip-barbell-triceps-extension-behind-the-head",name:"Lying Close-Grip Barbell Triceps Extension behind the Head",type:"isolation_upper",pattern:"isolation",primary:["triceps"],secondary:[],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["While holding a barbell or EZ Curl bar with a pronated grip (palms facing forward), lie on your back on a flat bench with your head close to the end of the bench. Tip: If you are holding a barbell grab it using a shoulder-width grip and if you are using an E-Z Bar grab it on the inner handles.","Extend your arms in front of you and slowly bring the bar back in a semi circular motion (while keeping the arms extended) to a position over your head. At the end of this step your arms should be overhead and parallel to the floor. This will be your starting position. Tip: Keep your elbows in at all times.","As you inhale, lower the bar by bending at the elbows and while keeping the upper arm stationary. Keep lowering the bar until your forearms are perpendicular to the floor.","As you exhale bring the bar back up to the starting position by pushing the bar up in a semi-circular motion until the lower arms are also parallel to the floor. Contract the triceps hard at the top of the movement for a second. Tip: Again, only the forearms should move. The upper arms should remain stationary at all times.","Repeat for the recommended amount of repetitions."]},{id:"g-lying-close-grip-barbell-triceps-press-to-chin",name:"Lying Close-Grip Barbell Triceps Press to Chin",type:"isolation_upper",pattern:"vertical_pull",primary:["triceps"],secondary:[],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["While holding a barbell or EZ Curl bar with a pronated grip (palms facing forward), lie on your back on a flat bench with your head off the end of the bench. Tip: If you are holding a barbell grab it using a shoulder-width grip and if you are using an E-Z Bar grab it on the inner handles.","Extend your arms in front of you as you hold the barbell over your chest. The arms should be perpendicular to your torso (90-degree angle). This will be your starting position.","As you inhale, lower the bar in a semi-circular motion by bending at the elbows and while keeping the upper arm stationary and elbows in. Keep lowering the bar until it lightly touches your chin.","As you exhale bring the bar back up to the starting position by pushing the bar up in a semi-circular motion. Contract the triceps hard at the top of the movement for a second. Tip: Again, only the forearms should move. The upper arms should remain stationary at all times.","Repeat for the recommended amount of repetitions."]},{id:"g-lying-dumbbell-tricep-extension",name:"Lying Dumbbell Tricep Extension",type:"isolation_upper",pattern:"isolation",primary:["triceps"],secondary:["chest","front_delts"],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Lie on a flat bench while holding two dumbbells directly in front of you. Your arms should be fully extended at a 90-degree angle from your torso and the floor. The palms should be facing in and the elbows should be tucked in. This is the starting position.","As you breathe in and you keep the upper arms stationary with the elbows in, slowly lower the weight until the dumbbells are near your ears.","At that point, while keeping the elbows in and the upper arms stationary, use the triceps to bring the weight back up to the starting position as you breathe out.","Repeat for the recommended amount of repetitions."]},{id:"g-lying-high-bench-barbell-curl",name:"Lying High Bench Barbell Curl",type:"isolation_upper",pattern:"isolation",primary:["biceps"],secondary:[],equipment:["barbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Lie face forward on a tall flat bench while holding a barbell with a supinated grip (palms facing up). Tip: If you are holding a barbell grab it using a shoulder-width grip and if you are using an E-Z Bar grab it on the inner handles. Your upper body should be positioned in a way that the upper chest is over the end of the bench and the barbell is hanging in front of you with the arms extended and perpendicular to the floor. This will be your starting position.","While keeping the elbows in and the upper arms stationary, curl the weight up in a semi-circular motion as you contract the biceps and exhale. Hold at the top of the movement for a second.","As you inhale, slowly go back to the starting position. Tip: Maintain full control of the weight at all times and avoid any swinging. Remember, only the forearms should move throughout the movement.","Repeat for the recommended amount of repetitions."]},{id:"g-lying-one-arm-lateral-r
