s you accelerate up, move your outside foot away from your direction of travel. Leaving the ground, shift your body about 30 degrees for the next repetition.","Return to the starting position and repeat the exercise, working all the way around until you are back where you started."]},{id:"g-close-grip-barbell-bench-press",name:"Close-Grip Barbell Bench Press",type:"compound_upper",pattern:"horizontal_push",primary:["triceps"],secondary:["chest","front_delts"],equipment:["barbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Lie back on a flat bench. Using a close grip (around shoulder width), lift the bar from the rack and hold it straight over you with your arms locked. This will be your starting position.","As you breathe in, come down slowly until you feel the bar on your middle chest. Tip: Make sure that - as opposed to a regular bench press - you keep the elbows close to the torso at all times in order to maximize triceps involvement.","After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your triceps muscles. Lock your arms in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up.","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the bar back in the rack."]},{id:"g-close-grip-dumbbell-press",name:"Close-Grip Dumbbell Press",type:"compound_upper",pattern:"horizontal_push",primary:["triceps"],secondary:["chest","front_delts"],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Place a dumbbell standing up on a flat bench.","Ensuring that the dumbbell stays securely placed at the top of the bench, lie perpendicular to the bench with only your shoulders lying on the surface. Hips should be below the bench and your legs bent with your feet firmly on the floor.","Grasp the dumbbell with both hands and hold it straight over your chest at arm's length. Both palms should be pressing against the underside of the sides of the dumbbell. This will be your starting position.","Initiate the movement by lowering the dumbbell to your chest.","Return to the starting position by extending the elbows."]},{id:"g-close-grip-ez-bar-curl",name:"Close-Grip EZ Bar Curl",type:"isolation_upper",pattern:"isolation",primary:["biceps"],secondary:[],equipment:["ez_bar"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Stand up with your torso upright while holding an E-Z Curl Bar at the closer inner handle. The palm of your hands should be facing forward and they should be slightly tilted inwards due to the shape of the bar. The elbows should be close to the torso. This will be your starting position.","While holding the upper arms stationary, curl the weights forward while contracting the biceps as you breathe out. Tip: Only the forearms should move.","Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second and squeeze the biceps hard.","Slowly begin to bring the bar back to starting position as your breathe in.","Repeat for the recommended amount of repetitions."]},{id:"g-close-grip-ez-bar-curl-with-band",name:"Close-Grip EZ-Bar Curl with Band",type:"isolation_upper",pattern:"isolation",primary:["biceps"],secondary:[],equipment:["ez_bar"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Attach a band to each end of the bar. Take the bar, placing a foot on the middle of the band. Stand upright with a narrow, supinated grip on the EZ bar. The elbows should be close to the torso. This will be your starting position.","While keeping the upper arms in place, flex the elbows to execute the curl. Exhale as the weight is lifted.","Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second and squeeze the biceps hard.","Slowly begin to bring the bar back to starting position as your breathe in.","Repeat for the recommended amount of repetitions."]},{id:"g-close-grip-ez-bar-press",name:"Close-Grip EZ-Bar Press",type:"compound_upper",pattern:"horizontal_push",primary:["triceps"],secondary:["chest","front_delts"],equipment:["ez_bar"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Lie on a flat bench with an EZ bar loaded to an appropriate weight.","Using a narrow grip lift the bar and hold it straight over your torso with your elbows in. The arms should be perpendicular to the floor. This will be your starting position.","Now lower the bar down to your lower chest as you breathe in. Keep the elbows in as you perform this movement.","Using the triceps to push the bar back up, press it back to the starting position by extending the elbows as you exhale.","Repeat."]},{id:"g-close-grip-front-lat-pulldown",name:"Close-Grip Front Lat Pulldown",type:"compound_upper",pattern:"vertical_pull",primary:["lats"],secondary:["biceps","front_delts"],equipment:["machine","cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Sit down on a pull-down machine with a wide bar attached to the top pulley. Make sure that you adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.","Grab the bar with the palms facing forward using the prescribed grip. Note on grips: For a wide grip, your hands need to be spaced out at a distance wider than your shoulder width. For a medium grip, your hands need to be spaced out at a distance equal to your shoulder width and for a close grip at a distance smaller than your shoulder width.","As you have both arms extended in front of you - while holding the bar at the chosen grip width - bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.","As you breathe out, bring the bar down until it touches your upper chest by drawing the shoulders and the upper arms down and back. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary (only the arms should move). The forearms should do no other work except for holding the bar; therefore do not try to pull the bar down using the forearms.","After a second in the contracted position, while squeezing your shoulder blades together, slowly raise the bar back to the starting position when your arms are fully extended and the lats are fully stretched. Inhale during this portion of the movement.","6. Repeat this motion for the prescribed amount of repetitions."]},{id:"g-close-grip-push-up-off-of-a-dumbbell",name:"Close-Grip Push-Up off of a Dumbbell",type:"compound_upper",pattern:"horizontal_push",primary:["triceps"],secondary:["abs","chest","front_delts"],equipment:["bodyweight"],laterality:"bilateral",bw:.65,metric:"weight_reps",steps:["Lie on the floor and place your hands on an upright dumbbell. Supporting your weight on your toes and hands, keep your torso rigid and your elbows in with your arms straight. This will be your starting position.","Lower your body, allowing the elbows to flex while you inhale. Keep your body straight, not allowing your hips to rise or sag.","Press yourself back up to the starting position by extending the elbows. Breathe out as you perform this step.","After a pause at the contracted position, repeat the movement for the prescribed amount of repetitions."]},{id:"g-close-grip-standing-barbell-curl",name:"Close-Grip Standing Barbell Curl",type:"isolation_upper",pattern:"isolation",primary:["biceps"],secondary:[],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Hold a barbell with both hands, palms up and a few inches apart.","Stand with your torso straight and your head up. Your feet should be about shoulder width and your elbows close to your torso. This will be your starting position. Tip: You will keep your upper arms and elbows stationary throughout the movement.","Curl the bar up in a semicircular motion until the forearms touch your biceps. Exhale as you perform this portion of the movement and contract your biceps hard for a second at the top. Tip: Avoid bending the back or using swinging motions as you lift the weight. Only the forearms should move.","Slowly go back down to the starting position as you inhale.","Repeat for the recommended amount of repetitions."]},{id:"g-cocoons",name:"Cocoons",type:"core",pattern:"core",primary:["abs"],secondary:[],equipment:["bodyweight"],laterality:"bilateral",bw:.6,metric:"weight_reps",steps:["Begin by lying on your back on the ground. Your legs should be straight and your arms extended behind your head. This will be your starting position.","To perform the movement, tuck the knees toward your chest, rotating your pelvis to lift your glutes from the floor. As you do so, flex the spine, bringing your arms back over your head to perform a simultaneous crunch motion.","After a brief pause, return to the starting position."]},{id:"g-concentration-curls",name:"Concentration Curls",type:"isolation_upper",pattern:"isolation",primary:["biceps"],secondary:[],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Sit down on a flat bench with one dumbbell in front of you between your legs. Your legs should be spread with your knees bent and feet on the floor.","Use your right arm to pick the dumbbell up. Place the back of your right upper arm on the top of your inner right thigh. Rotate the palm of your hand until it is facing forward away from your thigh. Tip: Your arm should be extended and the dumbbell should be above the floor. This will be your starting position.","While holding the upper arm stationary, curl the weights forward while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level. Tip: At the top of the movement make sure that the little finger of your arm is higher than your thumb. This guarantees a good contraction. Hold the contracted position for a second as you squeeze the biceps.","Slowly begin to bring the dumbbells back to starting position as your breathe in. Caution: Avoid swinging motions at any time.","Repeat for the recommended amount of repetitions. Then repeat the movement with the left arm."]},{id:"e-copenhagen-plank",name:"Copenhagen Plank",type:"core",pattern:"core",primary:["adductors","obliques"],secondary:[],equipment:["bodyweight","bench"],laterality:"unilateral",bw:0,metric:"time",aliases:[]},{id:"e-cossack-squat",name:"Cossack Squat",type:"compound_lower",pattern:"lunge",primary:["adductors","quads"],secondary:["glutes"],equipment:["bodyweight"],laterality:"unilateral",bw:.7,metric:"weight_reps",aliases:[]},{id:"g-cross-body-hammer-curl",name:"Cross Body Hammer Curl",type:"isolation_upper",pattern:"isolation",primary:["forearms"],secondary:[],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Stand up straight with a dumbbell in each hand. Your hands should be down at your side with your palms facing in.","While keeping your palms facing in and without twisting your arm, curl the dumbbell of the right arm up towards your left shoulder as you exhale. Touch the top of the dumbbell to your shoulder and hold the contraction for a second.","Slowly lower the dumbbell along the same path as you inhale and then repeat the same movement for the left arm.","Continue alternating in this fashion until the recommended amount of repetitions is performed for each arm."]},{id:"g-cross-over-with-bands",name:"Cross Over - with Bands",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["biceps","front_delts"],equipment:["band"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Secure an exercise band around a stationary post.","While facing away from the post, grab the handles on both ends of the band and step forward enough to create tension on the band.",'Raise your arms to the sides, parallel to the floor, perpendicular to your torso (your torso and the arms should resemble the letter "T") and with the palms facing forward. Have them extended with a slight bend at the elbows. This will be your starting position.',"While keeping your arms straight, bring them across your chest in a semicircular motion to the front as you exhale and flex your pecs. Hold the contraction for a second.","Slowly return to the starting position as you inhale.","Perform for the recommended amount of repetitions."]},{id:"g-cross-body-crunch",name:"Cross-Body Crunch",type:"core",pattern:"core",primary:["abs"],secondary:[],equipment:["bodyweight"],laterality:"bilateral",bw:.6,metric:"weight_reps",steps:["Lie flat on your back and bend your knees about 60 degrees.","Keep your feet flat on the floor and place your hands loosely behind your head. This will be your starting position.","Now curl up and bring your right elbow and shoulder across your body while bring your left knee in toward your left shoulder at the same time. Reach with your elbow and try to touch your knee. Exhale as you perform this movement. Tip: Try to bring your shoulder up towards your knee rather than just your elbow and remember that the key is to contract the abs as you perform the movement; not just to move the elbow.","Now go back down to the starting position as you inhale and repeat with the left elbow and the right knee.","Continue alternating in this manner until all prescribed repetitions are done."]},{id:"g-crunch-hands-overhead",name:"Crunch - Hands Overhead",type:"core",pattern:"core",primary:["abs"],secondary:[],equipment:["bodyweight"],laterality:"bilateral",bw:.3,metric:"weight_reps",steps:["Lie on the floor with your back flat and knees bent with around a 60-degree angle between the hamstrings and the calves.","Keep your feet flat on the floor and stretch your arms overhead with your palms crossed. This will be your starting position.","Curl your upper body forward and bring your shoulder blades just off the floor. At all times, keep your arms aligned with your head, neck and shoulder. Don't move them forward from that position. Exhale as you perform this portion of the movement and hold the contraction for a second.","Slowly lower down to the starting position as you inhale.","Repeat for the recommended amount of repetitions."]},{id:"g-crunch-legs-on-exercise-ball",name:"Crunch - Legs on Exercise Ball",type:"core",pattern:"core",primary:["abs"],secondary:[],equipment:["bodyweight"],laterality:"bilateral",bw:.3,metric:"weight_reps",steps:["Lie flat on your back with your feet resting on an exercise ball and your knees bent at a 90 degree angle.","Place your feet three to four inches apart and point your toes inward so they touch.","Place your hands lightly on either side of your head keeping your elbows in. Tip: Don't lock your fingers behind your head.","Push the small of your back down in the floor in order to better isolate your abdominal muscles. This will be your starting position.","Begin to roll your shoulders off the floor and continue to push down as hard as you can with your lower back. Your shoulders should come up off the floor only about four inches, and your lower back should remain on the floor. Breathe out as you execute this portion of the movement. Squeeze your abdominals hard at the top of the contraction and hold for a second. Tip: Focus on a slow, controlled movement. Refrain from using momentum at any time.","Slowly go back down to the starting position as you inhale.","Repeat for the recommended amount of repetitions."]},{id:"g-crunches",name:"Crunches",type:"core",pattern:"core",primary:["abs"],secondary:[],equipment:["bodyweight"],laterality:"bilateral",bw:.3,metric:"weight_reps",steps:["Lie flat on your back with your feet flat on the ground, or resting on a bench with your knees bent at a 90 degree angle. If you are resting your feet on a bench, place them three to four inches apart and point your toes inward so they touch.","Now place your hands lightly on either side of your head keeping your elbows in. Tip: Don't lock your fingers behind your head.","While pushing the small of your back down in the floor to better isolate your abdominal muscles, begin to roll your shoulders off the floor.","Continue to push down as hard as you can with your lower back as you contract your abdominals and exhale. Your shoulders should come up off the floor only about four inches, and your lower back should remain on the floor. At the top of the movement, contract your abdominals hard and keep the contraction for a second. Tip: Focus on slow, controlled movement - don't cheat yourself by using momentum.","After the one second contraction, begin to come down slowly again to the starting position as you inhale.","Repeat for the recommended amount of repetitions."]},{id:"g-cuban-press",name:"Cuban Press",type:"compound_upper",pattern:"horizontal_push",primary:["rear_delts"],secondary:["lats"],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:['Take a dumbbell in each hand with a pronated grip in a standing position. Raise your upper arms so that they are parallel to the floor, allowing your lower arms to hang in the "scarecrow" position. This will be your starting position.',"To initiate the movement, externally rotate the shoulders to move the upper arm 180 degrees. Keep the upper arms in place, rotating the upper arms until the wrists are directly above the elbows, the forearms perpendicular to the floor.","Now press the dumbbells by extending at the elbows, straightening your arms overhead.","Return to the starting position as you breathe in by reversing the steps.","Repeat for the recommended amount of repetitions."]},{id:"e-curtsy-lunge",name:"Curtsy Lunge",type:"compound_lower",pattern:"lunge",primary:["glutes","quads"],secondary:["abductors"],equipment:["dumbbell"],laterality:"unilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"e-dead-hang",name:"Dead Hang",type:"isolation_upper",pattern:"isolation",primary:["forearms"],secondary:["lats"],equipment:["pullup_bar"],laterality:"bilateral",bw:0,metric:"time",aliases:[]},{id:"g-decline-barbell-bench-press",name:"Decline Barbell Bench Press",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["front_delts","triceps"],equipment:["barbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Secure your legs at the end of the decline bench and slowly lay down on the bench.","Using a medium width grip (a grip that creates a 90-degree angle in the middle of the movement between the forearms and the upper arms), lift the bar from the rack and hold it straight over you with your arms locked. The arms should be perpendicular to the floor. This will be your starting position. Tip: In order to protect your rotator cuff, it is best if you have a spotter help you lift the barbell off the rack.","As you breathe in, come down slowly until you feel the bar on your lower chest.","After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms and squeeze your chest in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up).","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the bar back in the rack."]},{id:"g-decline-close-grip-bench-to-skull-crusher",name:"Decline Close-Grip Bench to Skull Crusher",type:"compound_upper",pattern:"horizontal_push",primary:["triceps"],secondary:["chest","front_delts"],equipment:["barbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Secure your legs at the end of the decline bench and slowly lay down on the bench.","Using a close grip (a grip that is slightly less than shoulder width), lift the bar from the rack and hold it straight over you with your arms locked and elbows in. The arms should be perpendicular to the floor. This will be your starting position. Tip: In order to protect your rotator cuff, it is best if you have a spotter help you lift the barbell off the rack.","Now lower the bar down to your lower chest as you breathe in. Keep the elbows in as you perform this movement.","Using the triceps to push the bar back up, press it back to the starting position as you exhale.","As you breathe in and you keep the upper arms stationary, bring the bar down slowly by moving your forearms in a semicircular motion towards you until you feel the bar slightly touch your forehead. Breathe in as you perform this portion of the movement.","Lift the bar back to the starting position by contracting the triceps and exhaling.","Repeat steps 3-6 until the recommended amount of repetitions is performed."]},{id:"g-decline-crunch",name:"Decline Crunch",type:"core",pattern:"core",primary:["abs"],secondary:[],equipment:["bodyweight"],laterality:"bilateral",bw:.3,metric:"weight_reps",steps:["Secure your legs at the end of the decline bench and lie down.","Now place your hands lightly on either side of your head keeping your elbows in. Tip: Don't lock your fingers behind your head.","While pushing the small of your back down in the bench to better isolate your abdominal muscles, begin to roll your shoulders off it.","Continue to push down as hard as you can with your lower back as you contract your abdominals and exhale. Your shoulders should come up off the bench only about four inches, and your lower back should remain on the bench. At the top of the movement, contract your abdominals hard and keep the contraction for a second. Tip: Focus on slow, controlled movement - don't cheat yourself by using momentum.","After the one second contraction, begin to come down slowly again to the starting position as you inhale.","Repeat for the recommended amount of repetitions."]},{id:"g-decline-dumbbell-bench-press",name:"Decline Dumbbell Bench Press",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["front_delts","triceps"],equipment:["dumbbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Secure your legs at the end of the decline bench and lie down with a dumbbell on each hand on top of your thighs. The palms of your hand will be facing each other.","Once you are laying down, move the dumbbells in front of you at shoulder width.","Once at shoulder width, rotate your wrists forward so that the palms of your hands are facing away from you. This will be your starting position.","Bring down the weights slowly to your side as you breathe out. Keep full control of the dumbbells at all times. Tip: Throughout the motion, the forearms should always be perpendicular to the floor.","As you breathe out, push the dumbbells up using your pectoral muscles. Lock your arms in the contracted position, squeeze your chest, hold for a second and then start coming down slowly. Tip: It should take at least twice as long to go down than to come up..","Repeat the movement for the prescribed amount of repetitions of your training program."]},{id:"g-decline-dumbbell-flyes",name:"Decline Dumbbell Flyes",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:[],equipment:["dumbbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Secure your legs at the end of the decline bench and lie down with a dumbbell on each hand on top of your thighs. The palms of your hand will be facing each other.","Once you are laying down, move the dumbbells in front of you at shoulder width. The palms of the hands should be facing each other and the arms should be perpendicular to the floor and fully extended. This will be your starting position.","With a slight bend on your elbows in order to prevent stress at the biceps tendon, lower your arms out at both sides in a wide arc until you feel a stretch on your chest. Breathe in as you perform this portion of the movement. Tip: Keep in mind that throughout the movement, the arms should remain stationary; the movement should only occur at the shoulder joint.","Return your arms back to the starting position as you squeeze your chest muscles and breathe out. Tip: Make sure to use the same arc of motion used to lower the weights.","Hold for a second at the contracted position and repeat the movement for the prescribed amount of repetitions."]},{id:"e-decline-dumbbell-press",name:"Decline Dumbbell Press",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["triceps"],equipment:["dumbbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-decline-dumbbell-triceps-extension",name:"Decline Dumbbell Triceps Extension",type:"isolation_upper",pattern:"isolation",primary:["triceps"],secondary:[],equipment:["dumbbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Secure your legs at the end of the decline bench and lie down with a dumbbell on each hand on top of your thighs. The palms of your hand will be facing each other.","Once you are laying down, move the dumbbells in front of you at shoulder width. The palms of the hands should be facing each other and the arms should be perpendicular to the floor and fully extended. This will be your starting position.","As you breathe in and you keep the upper arms stationary (and elbows in), bring the dumbbells down slowly by moving your forearms in a semicircular motion towards you until your thumbs are next to your ears. Breathe in as you perform this portion of the movement.","Lift the dumbbells back to the starting position by contracting the triceps and exhaling.","Repeat for the recommended amount of repetitions."]},{id:"g-decline-ez-bar-triceps-extension",name:"Decline EZ Bar Triceps Extension",type:"isolation_upper",pattern:"isolation",primary:["triceps"],secondary:[],equipment:["ez_bar","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Secure your legs at the end of the decline bench and slowly lay down on the bench.","Using a close grip (a grip that is slightly less than shoulder width), lift the EZ bar from the rack and hold it straight over you with your arms locked and elbows in. The arms should be perpendicular to the floor. This will be your starting position. Tip: In order to protect your rotator cuff, it is best if you have a spotter help you lift the barbell off the rack.","As you breathe in and you keep the upper arms stationary, bring the bar down slowly by moving your forearms in a semicircular motion towards you until you feel the bar slightly touch your forehead. Breathe in as you perform this portion of the movement.","Lift the bar back to the starting position by contracting the triceps and exhaling.","Repeat until the recommended amount of repetitions is performed."]},{id:"g-decline-oblique-crunch",name:"Decline Oblique Crunch",type:"core",pattern:"core",primary:["obliques"],secondary:[],equipment:["bodyweight"],laterality:"bilateral",bw:.6,metric:"weight_reps",steps:["Secure your legs at the end of the decline bench and slowly lay down on the bench.","Raise your upper body off the bench until your torso is about 35-45 degrees if measured from the floor.","Put one hand beside your head and the other on your thigh. This will be your starting position.","Raise your upper body slowly from the starting position while turning your torso to the left. Continue crunching up as you exhale until your right elbow touches your left knee. Hold this contracted position for a second. Tip: Focus on keeping your abs tight and keeping the movement slow and controlled.","Lower your body back down slowly to the starting position as you inhale.","After completing one set on the right for the recommended amount of repetitions, switch to your left side. Tip: Focus on really twisting your torso and feeling the contraction when you are in the up position."]},{id:"g-decline-reverse-crunch",name:"Decline Reverse Crunch",type:"core",pattern:"core",primary:["abs"],secondary:[],equipment:["bodyweight"],laterality:"bilateral",bw:.6,metric:"weight_reps",steps:["Lie on your back on a decline bench and hold on to the top of the bench with both hands. Don't let your body slip down from this position.","Hold your legs parallel to the floor using your abs to hold them there while keeping your knees and feet together. Tip: Your legs should be fully extended with a slight bend on the knee. This will be your starting position.","While exhaling, move your legs towards the torso as you roll your pelvis backwards and you raise your hips off the bench. At the end of this movement your knees will be touching your chest.","Hold the contraction for a second and move your legs back to the starting position while inhaling.","Repeat for the recommended amount of repetitions."]},{id:"g-decline-smith-press",name:"Decline Smith Press",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["front_delts","triceps"],equipment:["smith","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Place a decline bench underneath the Smith machine. Now place the barbell at a height that you can reach when lying down and your arms are almost fully extended. Using a pronated grip that is wider than shoulder width, unlock the bar from the rack and hold it straight over you with your arms extended. This will be your starting position.","As you inhale, lower the bar under control by allowing the elbows to flex, lightly contacting the torso.","After a brief pause, bring the bar back to the starting position by extending the elbows, exhaling as you do so.","Repeat the movement for the prescribed amount of repetitions.","When the set is complete, lock the bar back in the rack."]},{id:"e-deep-squat-hold",name:"Deep Squat Hold",type:"isolation_lower",pattern:"squat",primary:["quads","adductors"],secondary:[],equipment:["bodyweight"],laterality:"bilateral",bw:0,metric:"time",aliases:[]},{id:"g-deficit-deadlift",name:"Deficit Deadlift",type:"compound_upper",pattern:"hinge",primary:["lower_back"],secondary:["glutes","hamstrings","quads"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Begin by having a platform or weight plates that you can stand on, usually 1-3 inches in height. Approach the bar so that it is centered over your feet. You feet should be about hip width apart. Bend at the hip to grip the bar at shoulder width, allowing your shoulder blades to protract. Typically, you would use an overhand grip or an over/under grip on heavier sets.","With your feet, and your grip set, take a big breath and then lower your hips and bend the knees until your shins contact the bar. Look forward with your head, keep your chest up and your back arched, and begin driving through the heels to move the weight upward. After the bar passes the knees, aggressively pull the bar back, pulling your shoulder blades together as you drive your hips forward into the bar.","Lower the bar by bending at the hips and guiding it to the floor."]},{id:"e-deficit-push-up",name:"Deficit Push-Up",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["triceps"],equipment:["bodyweight"],laterality:"bilateral",bw:.65,metric:"weight_reps",aliases:[]},{id:"g-diamond-push-up",name:"Diamond Push-up",type:"compound_upper",pattern:"horizontal_push",primary:["triceps"],secondary:["chest"],equipment:["bodyweight"],laterality:"bilateral",bw:.65,metric:"weight_reps",steps:["Lie on the floor face down and place your hands closer than shoulder width for a close hand position. Make sure that you are holding your torso up at arms' length.","Lower yourself until your chest almost touches the floor as you inhale.","Using your triceps and some of your pectoral muscles, press your upper body back up to the starting position and squeeze your chest. Breathe out as you perform this step.","After a second pause at the contracted position, repeat the movement for the prescribed amount of repetitions."]},{id:"e-donkey-calf-raise",name:"Donkey Calf Raise",type:"isolation_lower",pattern:"isolation",primary:["calves"],secondary:[],equipment:["machine"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-double-kettlebell-alternating-hang-clean",name:"Double Kettlebell Alternating Hang Clean",type:"compound_lower",pattern:"hinge",primary:["hamstrings"],secondary:["biceps","calves","glutes","lats","quads"],equipment:["kettlebell"],laterality:"unilateral",bw:0,metric:"time",steps:["Place two kettlebells between your feet. To get in the starting position, push your butt back and look straight ahead.","Clean one kettlebell to your shoulder and hold on to the other kettlebell.","With a fluid motion, lower the top kettlebell while driving the bottom kettlebell up."]},{id:"g-double-kettlebell-jerk",name:"Double Kettlebell Jerk",type:"compound_upper",pattern:"vertical_push",primary:["front_delts"],secondary:["calves","quads","triceps"],equipment:["kettlebell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Hold a kettlebell by the handle in each hand.","Clean the kettlebells to your shoulders by extending through the legs and hips as you pull the kettlebells towards your shoulders. Rotate your wrists as you do so, so that the palms face forward. This will be your starting position.","Dip your body by bending the knees, keeping your torso upright.","Immediately reverse direction, driving through the heels, in essence jumping to create momentum.","As you do so, press the kettlebells overhead to lockout by extending the arms, using your body's momentum to move the weights.","Return your feet to the ground in a split fashion, with one foot forward and one foot back.","Keeping the weights overhead, return to a standing position, bringing your feet together. Lower the weights to perform the next repetition."]},{id:"g-double-kettlebell-push-press",name:"Double Kettlebell Push Press",type:"compound_upper",pattern:"vertical_push",primary:["front_delts"],secondary:["calves","quads","triceps"],equipment:["kettlebell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Clean two kettlebells to your shoulders.","Squat down a few inches and reverse the motion rapidly. Use the momentum from the legs to drive the kettlebells overhead.","Once the kettlebells are locked out, lower the kettlebells to your shoulders and repeat."]},{id:"g-double-kettlebell-windmill",name:"Double Kettlebell Windmill",type:"core",pattern:"core",primary:["obliques"],secondary:["glutes","hamstrings","front_delts","triceps"],equipment:["kettlebell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Place a kettlebell in front of your front foot and clean and press a kettlebell overhead with your opposite arm. Clean the kettlebell to your shoulder by extending through the legs and hips as you pull the kettlebell towards your shoulders. Rotate your wrist as you do so, so that the palm faces forward.","Keeping the kettlebell locked out at all times, push your butt out in the direction of the locked out kettlebell. Turn your feet out at a forty-five degree angle from the arm with the locked out kettlebell.","Bending at the hip to one side, sticking your butt out, slowly lean until you can retrieve the kettlebell from the floor. Keep your eyes on the kettlebell that you hold over your head at all times.","Pause for a second after retrieving the kettlebell from the ground and reverse the motion back to the starting position."]},{id:"g-drag-curl",name:"Drag Curl",type:"compound_upper",pattern:"horizontal_push",primary:["biceps"],secondary:[],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Grab a barbell with a supinated grip (palms facing forward) and get your elbows close to your torso and back. This will be your starting position.",'As you exhale, curl the bar up while keeping the elbows to the back as you "Drag" the bar up by keeping it in contact with your torso. Tip: As you can see, you will not be keeping the elbows pinned to your sides, but instead you will be bringing them back. Also, do not lift your shoulders.',"Slowly go back to the starting position as you keep the bar in contact with the torso at all times.","Repeat for the recommended amount of repetitions."]},{id:"e-dragon-flag",name:"Dragon Flag",type:"core",pattern:"core",primary:["abs"],secondary:[],equipment:["bench"],laterality:"bilateral",bw:.5,metric:"weight_reps",aliases:[]},{id:"g-dumbbell-alternate-bicep-curl",name:"Dumbbell Alternate Bicep Curl",type:"isolation_upper",pattern:"isolation",primary:["biceps"],secondary:[],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Stand (torso upright) with a dumbbell in each hand held at arms length. The elbows should be close to the torso and the palms of your hand should be facing your thighs.","While holding the upper arm stationary, curl the right weight as you rotate the palm of the hands until they are facing forward. At this point continue contracting the biceps as you breathe out until your biceps is fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a second as you squeeze the biceps. Tip: Only the forearms should move.","Slowly begin to bring the dumbbell back to the starting position as your breathe in. Tip: Remember to twist the palms back to the starting position (facing your thighs) as you come down.","Repeat the movement with the left hand. This equals one repetition.","Continue alternating in this manner for the recommended amount of repetitions."]},{id:"g-dumbbell-bench-press-with-neutral-grip",name:"Dumbbell Bench Press with Neutral Grip",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["front_delts","triceps"],equipment:["dumbbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Take a dumbbell in each hand and lay back onto a flat bench. Your feet should be flat on the floor and your shoulder blades retracted.","Maintaining a neutral grip, palms facing each other, begin with your arms extended directly above you, perpendicular to the floor. This will be your starting position.","Begin the movement by flexing the elbow, lowering the upper arms to the side. Descend until the dumbbells are to your torso.","Pause, then extend the elbow and return to the starting position."]},{id:"g-dumbbell-calf-raise",name:"Dumbbell Calf Raise",type:"isolation_lower",pattern:"isolation",primary:["calves"],secondary:[],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Stand with your torso upright holding two dumbbells in your hands by your sides. Place the ball of the foot on a sturdy and stable wooden board (that is around 2-3 inches tall) while your heels extend off and touch the floor. This will be your starting position.","With the toes pointing either straight (to hit all parts equally), inwards (for emphasis on the outer head) or outwards (for emphasis on the inner head), raise the heels off the floor as you exhale by contracting the calves. Hold the top contraction for a second.","As you inhale, go back to the starting position by slowly lowering the heels.","Repeat for the recommended amount of times."]},{id:"g-dumbbell-clean",name:"Dumbbell Clean",type:"compound_lower",pattern:"hinge",primary:["hamstrings"],secondary:["calves","glutes","lats","quads","front_delts"],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Begin standing with a dumbbell in each hand with your feet shoulder width apart.","Lower the weights to the floor by flexing at the hips and knees, pushing your hips back until the dumbbells reach the floor. This will be your starting position.","To initiate the movement, violently jump upward by extending the hips, knees, and ankles to acclerate the weights upward. Maintaining a neutral grip on the dumbbells, keep the arms straight until full extension is reached.","After full extension, rebend the hips and knees to receive the weight in a squat position. Allow the arms to bend, guiding the dumbbells to your shoulders.","Upon receiving the weight in the squat position, extend the hips and knees to finish in a standing position with the weights on your shoulders."]},{id:"g-dumbbell-floor-press",name:"Dumbbell Floor Press",type:"compound_upper",pattern:"horizontal_push",primary:["triceps"],secondary:["chest","front_delts"],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Lay on the floor holding dumbbells in your hands. Your knees can be bent. Begin with the weights fully extended above you.","Lower the weights until your upper arm comes in contact with the floor. You can tuck your elbows to emphasize triceps size and strength, or to focus on your chest angle your arms to the side.","Pause at the bottom, and then bring the weight together at the top by extending through the elbows."]},{id:"g-dumbbell-incline-row",name:"Dumbbell Incline Row",type:"compound_upper",pattern:"horizontal_pull",primary:["upper_back"],secondary:["biceps","front_delts","lats"],equipment:["dumbbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Using a neutral grip, lean into an incline bench.","Take a dumbbell in each hand with a neutral grip, beginning with the arms straight. This will be your starting position.","Retract the shoulder blades and flex the elbows to row the dumbbells to your side.","Pause at the top of the motion, and then return to the starting position."]},{id:"g-dumbbell-incline-shoulder-raise",name:"Dumbbell Incline Shoulder Raise",type:"isolation_upper",pattern:"isolation",primary:["front_delts"],secondary:["triceps"],equipment:["dumbbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Sit on an Incline Bench while holding a dumbbell on each hand on top of your thighs.","Lift your legs up to kick the weights to your shoulders and lean back. Position the dumbbells above your shoulders with your arms extended. The arms should be perpendicular to the floor with your palms facing forward and knuckles pointing towards the ceiling. This will be your starting position.","While keeping the arms straight and locked, lift the dumbbells by raising the shoulders from the bench as you breathe out.","Bring back the dumbbells to the starting position as you breathe in.","Repeat for the recommended amount of repetitions."]},{id:"e-dumbbell-kickback",name:"Dumbbell Kickback",type:"isolation_upper",pattern:"isolation",primary:["triceps"],secondary:[],equipment:["dumbbell"],laterality:"unilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-dumbbell-lunges",name:"Dumbbell Lunges",type:"compound_lower",pattern:"lunge",primary:["quads"],secondary:["calves","glutes","hamstrings"],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Stand with your torso upright holding two dumbbells in your hands by your sides. This will be your starting position.","Step forward with your right leg around 2 feet or so from the foot being left stationary behind and lower your upper body down, while keeping the torso upright and maintaining balance. Inhale as you go down. Note: As in the other exercises, do not allow your knee to go forward beyond your toes as you come down, as this will put undue stress on the knee joint. Make sure that you keep your front shin perpendicular to the ground.","Using mainly the heel of your foot, push up and go back to the starting position as you exhale.","Repeat the movement for the recommended amount of repetitions and then perform with the left leg."]},{id:"g-dumbbell-lying-one-arm-rear-lateral-raise",name:"Dumbbell Lying One-Arm Rear Lateral Raise",type:"isolation_upper",pattern:"isolation",primary:["rear_delts"],secondary:["lats"],equipment:["dumbbell"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["While holding a dumbbell in one hand, lay with your chest down on a slightly inclined (around 15 degrees when measured from the floor) adjustable bench. The other hand can be used to hold to the leg of the bench for stability.","Position the palm of the hand that is holding the dumbbell in a neutral manner (palms facing your torso) as you keep the arm extended with the elbow slightly bent. This will be your starting position.","Now raise the arm with the dumbbell to the side until your elbow is at shoulder height and your arm is roughly parallel to the floor as you exhale. Tip: Maintain your arm perpendicular to the torso while keeping your arm extended throughout the movement. Also, keep the contraction at the top for a second.","Slowly lower the dumbbell to the starting position as you inhale.","Repeat for the recommended amount of repetitions."]},{id:"g-dumbbell-lying-rear-lateral-raise",name:"Dumbbell Lying Rear Lateral Raise",type:"isolation_upper",pattern:"isolation",primary:["rear_delts"],secondary:[],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["While holding a dumbbell in each hand, lay with your chest down on a slightly inclined (around 15 degrees when measured from the floor) adjustable bench.","Position the palms of the hands in a neutral manner (palms facing your torso) as you keep the arms extended with the elbows slightly bent. This will be your starting position.","Now raise the arms to the side until your elbows are at shoulder height and your arms are roughly parallel to the floor as you exhale. Tip: Maintain your arms perpendicular to the torso while keeping them extended throughout the movement. Also, keep the contraction at the top for a second.","Slowly lower the dumbbells to the starting position as you inhale.","Repeat for the recommended amount of repetitions and then switch to the other arm."]},{id:"g-dumbbell-one-arm-shoulder-press",name:"Dumbbell One-Arm Shoulder Press",type:"compound_upper",pattern:"vertical_push",primary:["front_delts"],secondary:["triceps"],equipment:["dumbbell"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["Grab a dumbbell and either sit on a military press bench or a utility bench that has a back support on it as you place the dumbbells upright on top of your thighs or stand up straight.","Clean the dumbbell up to bring it to shoulder height. The other hand can be kept fully extended to the side, by the waist or grabbing a fixed surface.","Rotate the wrist so that the palm of your hand is facing forward. This is your starting position.","As you exhale, push the dumbbell up until your arm is fully extended.","After a second pause, slowly come down back to the starting position as you inhale.","Repeat for the recommended amount of repetitions and then switch arms."]},{id:"g-dumbbell-one-arm-triceps-extension",name:"Dumbbell One-Arm Triceps Extension",type:"isolation_upper",pattern:"isolation",primary:["triceps"],secondary:[],equipment:["dumbbell"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["Grab a dumbbell and either sit on a military press bench or a utility bench that has a back support on it as you place the dumbbells upright on top of your thighs or stand up straight.","Clean the dumbbell up to bring it to shoulder height and then extend the arm over your head so that the whole arm is perpendicular to the floor and next to your head. The dumbbell should be on top of you. The other hand can be kept fully extended to the side, by the waist, supporting the upper arm that has the dumbbell or grabbing a fixed surface.","Rotate the wrist so that the palm of your hand is facing forward and the pinkie is facing the ceiling. This will be your starting position.","Slowly lower the dumbbell behind your head as you hold the upper arm stationary. Inhale as you perform this movement and pause when your triceps are fully stretched.","Return to the starting position by flexing your triceps as you breathe out. Tip: It is imperative that only the forearm moves. The upper arm should remain at all times stationary next to your head.","Repeat for the recommended amount of repetitions and switch arms."]},{id:"g-dumbbell-one-arm-upright-row",name:"Dumbbell One-Arm Upright Row",type:"compound_upper",pattern:"horizontal_push",primary:["side_delts"],secondary:["biceps","upper_back"],equipment:["dumbbell"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["Grab a dumbbell and stand up straight with your arm extended in front of you with a slight bend at the elbows and your back straight. This will be your starting position. Tip: The dumbbell should be resting on top of your thigh with the palm of your hands facing your thighs.","Keep the other hand can be kept fully extended to the side, by the waist or grabbing a fixed surface. This will be your starting position.","Use your side shoulders to lift the dumbbell as you exhale. The dumbbell should be close to the body as you move it up. Continue to lift it until the dumbbell is nearly in line with your chin. Tip: Your elbows should drive the motion. As you lift the dumbbell, your elbow should always be higher than your forearm. Also, keep your torso stationary and pause for a second at the top of the movement.","Lower the dumbbell back down slowly to the starting position. Inhale as you perform this portion of the movement.","Repeat for the recommended amount of repetitions and switch arms."]},{id:"g-dumbbell-prone-incline-curl",name:"Dumbbell Prone Incline Curl",type:"isolation_upper",pattern:"isolation",primary:["biceps"],secondary:[],equipment:["dumbbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Grab a dumbbell on each hand and lie face down on an incline bench with your shoulders near top of the incline. Your knees can rest on the seat or your legs can be straddled to the sides (my preferred way).","Let your arms extend and hang naturally in front of you so that they are perpendicular to the floor.","Now keep your elbows in by your side and face the palms forward. This will be your starting position.","Raise the dumbbells by contracting the biceps until your arms are fully flexed. Exhale as you perform this portion of the movement and ensure that only the forearms move. The upper arms should remain stationary at all times.","Lower the dumbbells until your arms are fully extended.","Repeat for the recommended amount of times."]},{id:"e-dumbbell-pullover",name:"Dumbbell Pullover",type:"isolation_upper",pattern:"isolation",primary:["lats","chest"],secondary:[],equipment:["dumbbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-dumbbell-raise",name:"Dumbbell Raise",type:"compound_upper",pattern:"horizontal_push",primary:["front_delts"],secondary:["biceps"],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Grab a dumbbell in each arm and stand up straight with your arms extended by your sides with a slight bend at the elbows and your back straight. This will be your starting position. Tip: The dumbbell should be next to your thighs with the palm of your hands facing back.","Use your side shoulders to lift the dumbbells as you exhale. The dumbbells should be to the side of the body as you move them up. Continue to lift it until the dumbbells are nearly in line with your chin. Tip: Your elbows should drive the motion. As you lift the dumbbell, your elbow should always be higher than your forearm. Also, keep your torso stationary and pause for a second at the top of the movement.","Lower the dumbbells back down slowly to the starting position. Inhale as you perform this portion of the movement.","Repeat for the recommended amount of repetitions."]},{id:"g-dumbbell-rear-lunge",name:"Dumbbell Rear Lunge",type:"compound_lower",pattern:"lunge",primary:["quads"],secondary:["calves","glutes","hamstrings"],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Stand with your torso upright holding two dumbbells in your hands by your sides. This will be your starting position.","Step backward with your right leg around two feet or so from the left foot and lower your upper body down, while keeping the torso upright and maintaining balance. Inhale as you go down. Tip: As in the other exercises, do not allow your knee to go forward beyond your toes as you come down, as this will put undue stress on the knee joint. Make sure that you keep your front shin perpendicular to the ground. Keep the torso upright during the lunge; flexible hip flexors are important. A long lunge emphasizes the Gluteus Maximus; a short lunge emphasizes Quadriceps.","Push up and go back to the starting position as you exhale. Tip: Use the ball of your feet to push in order to accentuate the quadriceps. To focus on the glutes, press with your heels.","Now repeat with the opposite leg."]},{id:"g-dumbbell-scaption",name:"Dumbbell Scaption",type:"isolation_upper",pattern:"isolation",primary:["side_delts"],secondary:["lats"],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["This corrective exercise strengthens the muscles that stabilize your shoulder blade. Hold a light weight in each hand, hanging at your sides. Your thumbs should pointing up.","Begin the movement raising your arms out in front of you, about 30 degrees off center. Your arms should be fully extended as you perform the movement.","Continue until your arms are parallel to the ground, and then return to the starting position."]},{id:"g-dumbbell-seated-one-leg-calf-raise",name:"Dumbbell Seated One-Leg Calf Raise",type:"isolation_lower",pattern:"isolation",primary:["calves"],secondary:[],equipment:["dumbbell","bench"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["Place a block on the floor about 12 inches from a flat bench.","Sit on a flat bench and place a dumbbell on your upper left thigh about 3 inches above your knee.","Now place the ball of your left foot on the block. This will be your starting position.","Raise your toes up as high as possible as you exhale and you contract your calf muscle. Hold the contraction for a second.","Slowly return to the starting position, stretching as far down as possible.","Repeat for your prescribed number of repetitions and then repeat with the right leg."]},{id:"g-dumbbell-shoulder-press",name:"Dumbbell Shoulder Press",type:"compound_upper",pattern:"vertical_push",primary:["front_delts"],secondary:["triceps"],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["While holding a dumbbell in each hand, sit on a military press bench or utility bench that has back support. Place the dumbbells upright on top of your thighs.","Now raise the dumbbells to shoulder height one at a time using your thighs to help propel them up into position.","Make sure to rotate your wrists so that the palms of your hands are facing forward. This is your starting position.","Now, exhale and push the dumbbells upward until they touch at the top.","Then, after a brief pause at the top contracted position, slowly lower the weights back down to the starting position while inhaling.","Repeat for the recommended amount of repetitions."]},{id:"g-dumbbell-side-bend",name:"Dumbbell Side Bend",type:"core",pattern:"core",primary:["obliques"],secondary:[],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Stand up straight while holding a dumbbell on the left hand (palms facing the torso) as you have the right hand holding your waist. Your feet should be placed at shoulder width. This will be your starting position.","While keeping your back straight and your head up, bend only at the waist to the right as far as possible. Breathe in as you bend to the side. Then hold for a second and come back up to the starting position as you exhale. Tip: Keep the rest of the body stationary.","Now repeat the movement but bending to the left instead. Hold for a second and come back to the starting position.","Repeat for the recommended amount of repetitions and then change hands."]},{id:"g-dumbbell-squat",name:"Dumbbell Squat",type:"compound_lower",pattern:"squat",primary:["quads"],secondary:["calves","glutes","hamstrings","lats"],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Stand up straight while holding a dumbbell on each hand (palms facing the side of your legs).","Position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance and also maintain a straight back. This will be your starting position. Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances discussed in the foot stances section.","Begin to slowly lower your torso by bending the knees as you maintain a straight posture with the head up. Continue down until your thighs are parallel to the floor. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise your torso as you exhale by pushing the floor with the heel of your foot mainly as you straighten the legs again and go back to the starting position.","Repeat for the recommended amount of repetitions."]},{id:"g-dumbbell-squat-to-a-bench",name:"Dumbbell Squat to a Bench",type:"compound_lower",pattern:"squat",primary:["quads"],secondary:["calves","glutes","hamstrings","lats"],equipment:["dumbbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Stand up straight with a flat bench behind you while holding a dumbbell on each hand (palms facing the side of your legs).","Position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance and also maintain a straight back. This will be your starting position. Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances discussed in the foot stances section.","Begin to slowly lower your torso by bending the knees as you maintain a straight posture with the head up. Continue down until you slightly touch the bench behind you. Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise the bar as you exhale by pushing the floor with the heel of your foot mainly as you straighten the legs again and go back to the starting position.","Repeat for the recommended amount of repetitions."]},{id:"g-dumbbell-step-up",name:"Dumbbell Step-up",type:"compound_lower",pattern:"lunge",primary:["glutes"],secondary:["quads"],equipment:["dumbbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Stand up straight while holding a dumbbell on each hand (palms facing the side of your legs).","Place the right foot on the elevated platform. Step on the platform by extending the hip and the knee of your right leg. Use the heel mainly to lift the rest of your body up and place the foot of the left leg on the platform as well. Breathe out as you execute the force required to come up.","Step down with the left leg by flexing the hip and knee of the right leg as you inhale. Return to the original standing position by placing the right foot of to next to the left foot on the initial position.","Repeat with the right leg for the recommended amount of repetitions and then perform with the left leg."]},{id:"g-dumbbell-tricep-extension-pronated-grip",name:"Dumbbell Tricep Extension -Pronated Grip",type:"isolation_upper",pattern:"isolation",primary:["triceps"],secondary:[],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Lie down on a flat bench holding two dumbbells directly above your shoulders. Your arms should be fully extended and form a 90 degree angle from your torso and the floor.","The palms of your hands should be facing forward, and your elbows should be tucked in. This will be your starting position.","Now, inhale and slowly lower the dumbbells until they are near your ears. Be sure to keep your upper arms stationary and your elbows tucked in.","Then, exhale and use your triceps to return the weight to the starting position."]},{id:"g-elbow-to-knee",name:"Elbow to Knee",type:"core",pattern:"core",primary:["abs"],secondary:[],equipment:["bodyweight"],laterality:"bilateral",bw:.6,metric:"weight_reps",steps:["Lie on the floor, crossing your right leg across your bent left knee. Clasp your hands behind your head, beginning with your shoulder blades on the ground. This will be your starting position.","Perform the motion by flexing the spine and rotating your torso to bring the left elbow to the right knee.","Return to the starting position and repeat the movement for the desired number of repetitions before switching sides."]},{id:"g-elevated-back-lunge",name:"Elevated Back Lunge",type:"compound_lower",pattern:"lunge",primary:["quads"],secondary:["glutes","hamstrings"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Position a bar onto a rack at shoulder height loaded to an appropriate weight. Place a short, raised platform behind you.","Rack the bar onto your upper back, keeping your back arched and tight. Step onto your raised platform with both feet. This will be your starting position.","Begin by stepping backwards with one leg. Descend by flexing your hips and knees until your knee touches the floor.","Pause, and extend through the hips and knees to rise up, returning all the way to the starting position before alternating."]},{id:"g-elevated-cable-rows",name:"Elevated Cable Rows",type:"compound_upper",pattern:"horizontal_pull",primary:["upper_back"],secondary:["lats"],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Get a platform of some sort (it can be an aerobics or calf raise platform) that is around 4-6 inches in height.","Place it on the seat of the cable row machine.","Sit down on the machine and place your feet on the front platform or crossbar provided making sure that your knees are slightly bent and not locked.","Lean over as you keep the natural alignment of your back and grab the V-bar handles.","With your arms extended pull back until your torso is at a 90-degree angle from your legs. Your back should be slightly arched and your chest should be sticking out. You should be feeling a nice stretch on your lats as you hold the bar in front of you. This is the starting position of the exercise.","Keeping the torso stationary, pull the handles back towards your torso while keeping the arms close to it until you touch the abdominals. Breathe out as you perform that movement. At that point you should be squeezing your back muscles hard. Hold that contraction for a second and slowly go back to the original position while breathing in.","Repeat for the recommended amount of repetitions."]},{id:"e-elliptical",name:"Elliptical",type:"cardio",pattern:"carry",primary:["quads"],secondary:["glutes"],equipment:["machine"],laterality:"bilateral",bw:0,metric:"time",aliases:["cross trainer"]},{id:"g-extended-range-one-arm-kettlebell-floor-press",name:"Extended Range One-Arm Kettlebell Floor Press",type:"compound_upper",pattern:"horizontal_push",primary:["chest"],secondary:["front_delts","triceps"],equipment:["kettlebell"],laterality:"unilateral",bw:0,metric:"weight_reps",steps:["Lie on the floor and position a kettlebell for one arm to press. The kettlebell should be held by the handle. The leg on the same side that you are pressing should be bent, with the knee crossing over the midline of the body.","Press the kettlebell by extending the elbow and adducting the arm, pressing it above your body. Return to the starting position."]},{id:"g-external-rotation",name:"External Rotation",type:"isolation_upper",pattern:"isolation",primary:["rear_delts"],secondary:[],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Lie sideways on a flat bench with one arm holding a dumbbell and the other hand on top of the bench folded so that you can rest your head on it.","Bend the elbows of the arm holding the dumbbell so that it creates a 90-degree angle between the upper arm and the forearm. Tip: Keep the arm parallel to your torso.","Now bend the elbow while keeping the upper arm stationary. In this manner, the forearm will be parallel to the floor and perpendicular to your torso (Tip: So the forearm will be directly in front of you). The upper arm will be stationary by your torso and should be parallel to the floor (aligned with your torso at all times). This will be your starting position.","As you breathe out, externally rotate your forearm so that the dumbbell is lifted up in a semicircle motion as you maintain the 90 degree angle bend between the upper arms and the forearm. You will continue this external rotation until the forearm is perpendicular to the floor and the torso pointing towards the ceiling. At this point you will hold the contraction for a second.","As you breathe in, slowly go back to the starting position.","Repeat for the recommended amount of repetitions and then switch to the other arm."]},{id:"g-external-rotation-with-band",name:"External Rotation with Band",type:"compound_upper",pattern:"horizontal_push",primary:["rear_delts"],secondary:[],equipment:["band"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Choke the band around a post. The band should be at the same height as your elbow. Stand with your left side to the band a couple of feet away.","Grasp the end of the band with your right hand, and keep your elbow pressed firmly to your side. We recommend you hold a pad or foam roll in place with your elbow to keep it firmly in position.","With your upper arm in position, your elbow should be flexed to 90 degrees with your hand reaching across the front of your torso. This will be your starting position.","Execute the movement by rotating your arm in a backhand motion, keeping your elbow in place.","Continue as far as you are able, pause, and then return to the starting position."]},{id:"g-external-rotation-with-cable",name:"External Rotation with Cable",type:"isolation_upper",pattern:"isolation",primary:["rear_delts"],secondary:[],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Adjust the cable to the same height as your elbow. Stand with your left side to the band a couple of feet away.","Grasp the handle with your right hand, and keep your elbow pressed firmly to your side. We recommend you hold a pad or foam roll in place with your elbow to keep it firmly in position.","With your upper arm in position, your elbow should be flexed to 90 degrees with your hand reaching across the front of your torso. This will be your starting position.","Execute the movement by rotating your arm in a backhand motion, keeping your elbow in place."]},{id:"e-ez-bar-overhead-triceps-extension",name:"EZ-Bar Overhead Triceps Extension",type:"isolation_upper",pattern:"isolation",primary:["triceps"],secondary:[],equipment:["ez_bar"],laterality:"bilateral",bw:0,metric:"weight_reps",aliases:[]},{id:"g-flat-bench-cable-flyes",name:"Flat Bench Cable Flyes",type:"isolation_upper",pattern:"isolation",primary:["chest"],secondary:[],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Position a flat bench between two low pulleys so that when you are laying on it, your chest will be lined up with the cable pulleys.","Lay flat on the bench and keep your feet on the ground.","Have someone hand you the handles on each hand. You will grab each single handle attachment with a palms up grip.","Extend your arms by your side with a slight bend on your elbows. Tip: You will keep this bend constant through the whole movement. Your arms should be parallel to the floor. This is your starting position.","Now start lifting the arms in a semi-circle motion directly in front of you by pulling the cables together until both hands meet at the top of the movement. Squeeze your chest as you perform this motion and breathe out during this movement. Also, hold the contraction for a second at the top. Tip: When performed correctly, at the top position of this movement, your arms should be perpendicular to your torso and the floor touching above your chest.","Slowly come back to the starting position.","Repeat for the recommended amount of repetitions."]},{id:"g-flat-bench-leg-pull-in",name:"Flat Bench Leg Pull-In",type:"core",pattern:"core",primary:["abs"],secondary:[],equipment:["bench"],laterality:"bilateral",bw:.6,metric:"weight_reps",steps:["Lie on an exercise mat or a flat bench with your legs off the end.","Place your hands either under your glutes with your palms down or by the sides holding on to the bench (or with palms down by the side on an exercise mat). Also extend your legs straight out. This will be your starting position.","Bend your knees and pull your upper thighs into your midsection as you breathe out. Continue this movement until your knees are near your chest. Hold the contracted position for a second.","As you breathe in, slowly return to the starting position.","Repeat for the recommended amount of repetitions."]},{id:"g-flat-bench-lying-leg-raise",name:"Flat Bench Lying Leg Raise",type:"core",pattern:"core",primary:["abs"],secondary:[],equipment:["bench"],laterality:"bilateral",bw:.3,metric:"weight_reps",steps:["Lie with your back flat on a bench and your legs extended in front of you off the end.","Place your hands either under your glutes with your palms down or by the sides holding on to the bench. This will be your starting position.","As you keep your legs extended, straight as possible with your knees slightly bent but locked raise your legs until they make a 90-degree angle with the floor. Exhale as you perform this portion of the movement and hold the contraction at the top for a second.","Now, as you inhale, slowly lower your legs back down to the starting position."]},{id:"g-flexor-incline-dumbbell-curls",name:"Flexor Incline Dumbbell Curls",type:"isolation_upper",pattern:"isolation",primary:["biceps"],secondary:[],equipment:["dumbbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Hold the dumbbell towards the side farther from you so that you have more weight on the side closest to you. (This can be done for a good effect on all bicep dumbbell exercises). Now do a normal incline dumbbell curl, but keep your wrists as far back as possible so as to neutralize any stress that is placed on them.","Sit on an incline bench that is angled at 45-degrees while holding a dumbbell on each hand.","Let your arms hang down on your sides, with the elbows in, and turn the palms of your hands forward with the thumbs pointing away from the body. Tip: You will keep this hand position throughout the movement as there should not be any twisting of the hands as they come up. This will be your starting position.","Curl up the two dumbbells at the same time until your biceps are fully contracted and exhale. Tip: Do not swing the arms or use momentum. Keep a controlled motion at all times. Hold the contracted position for a second at the top.","As you inhale, slowly go back to the starting position.","Repeat for the recommended amount of repetitions."]},{id:"g-floor-press",name:"Floor Press",type:"compound_upper",pattern:"horizontal_push",primary:["triceps"],secondary:["chest","front_delts"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Adjust the j-hooks so they are at the appropriate height to rack the bar. Begin lying on the floor with your head near the end of a power rack. Keeping your shoulder blades pulled together; pull the bar off of the hooks.","Lower the bar towards the bottom of your chest or upper stomach, squeezing the bar and attempting to pull it apart as you do so. Ensure that you tuck your elbows throughout the movement. Lower the bar until your upper arm contacts the ground and pause, preventing any slamming or bouncing of the weight.","Press the bar back up as fast as you can, keeping the bar, your wrists, and elbows in line as you do so."]},{id:"g-floor-press-with-chains",name:"Floor Press with Chains",type:"compound_upper",pattern:"horizontal_push",primary:["triceps"],secondary:["chest","front_delts"],equipment:["barbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Adjust the j-hooks so they are at the appropriate height to rack the bar. For this exercise, drape the chains directly over the end of the bar, trying to keep the ends away from the plates.","Begin lying on the floor with your head near the end of a power rack. Keeping your shoulder blades pulled together, pull the bar off of the hooks.","Lower the bar towards the bottom of your chest or upper stomach, squeezing the bar and attempting to pull it apart as you do so. Ensure that you tuck your elbows throughout the movement. Lower the bar until your upper arm contacts the ground and pause, preventing any slamming or bouncing of the weight.","Press the bar back up as fast as you can, keeping the bar, your wrists, and elbows in line as you do so."]},{id:"g-flutter-kicks",name:"Flutter Kicks",type:"compound_lower",pattern:"hinge",primary:["glutes"],secondary:["hamstrings"],equipment:["bodyweight"],laterality:"bilateral",bw:.6,metric:"weight_reps",steps:["On a flat bench lie facedown with the hips on the edge of the bench, the legs straight with toes high off the floor and with the arms on top of the bench holding on to the front edge.","Squeeze your glutes and hamstrings and straighten the legs until they are level with the hips. This will be your starting position.","Start the movement by lifting the left leg higher than the right leg.","Then lower the left leg as you lift the right leg.","Continue alternating in this manner (as though you are doing a flutter kick in water) until you have done the recommended amount of repetitions for each leg. Make sure that you keep a controlled movement at all times. Tip: You will breathe normally as you perform this movement."]},{id:"g-freehand-jump-squat",name:"Freehand Jump Squat",type:"compound_lower",pattern:"squat",primary:["quads"],secondary:["calves","glutes","hamstrings"],equipment:["bodyweight"],laterality:"bilateral",bw:.6,metric:"weight_reps",steps:["Cross your arms over your chest.","With your head up and your back straight, position your feet at shoulder width.","Keeping your back straight and chest up, squat down as you inhale until your upper thighs are parallel, or lower, to the floor.","Now pressing mainly with the ball of your feet, jump straight up in the air as high as possible, using the thighs like springs. Exhale during this portion of the movement.","When you touch the floor again, immediately squat down and jump again.","Repeat for the recommended amount of repetitions."]},{id:"e-frog-pump",name:"Frog Pump",type:"isolation_lower",pattern:"hinge",primary:["glutes"],secondary:[],equipment:["bodyweight"],laterality:"bilateral",bw:.3,metric:"weight_reps",aliases:[]},{id:"g-frog-sit-ups",name:"Frog Sit-Ups",type:"core",pattern:"core",primary:["abs"],secondary:[],equipment:["bodyweight"],laterality:"bilateral",bw:.3,metric:"weight_reps",steps:["Lie with your back flat on the floor (or exercise mat) and your legs extended in front of you.","Now bend at the knees and place your outer thighs by the floor (or mat) as you make the soles of your feet touch each other.","Now try pushing both soles and bringing them up as near you as possible while you keep the outer thighs on the floor (or at least almost touching it). Tip: In this position your legs should create a diamond shape.","Now, cross your arms in front of you by touching the opposite shoulders. This will be your starting position.","As you exhale flatten your lower back to the floor while curling the torso upwards. Tip: This will be like performing the first 1/4 movement of a sit up. Hold at the top position for a second.","As you inhale, slowly lower back to the starting position.","Repeat for the recommended amount of repetitions."]},{id:"g-front-cable-raise",name:"Front Cable Raise",type:"isolation_upper",pattern:"isolation",primary:["front_delts"],secondary:[],equipment:["cable"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Select the weight on a low pulley machine and grasp the single hand cable attachment that is attached to the low pulley with your left hand.","Face away from the pulley and put your arm straight down with the hand cable attachment in front of your thighs at arms' length with the palms of the hand facing your thighs. This will be your starting position.","While maintaining the torso stationary (no swinging), lift the left arm to the front with a slight bend on the elbow and the palms of the hand always faces down. Continue to go up until you arm is slightly above parallel to the floor. Exhale as you execute this portion of the movement and pause for a second at the top.","Now as you inhale lower the arm back down slowly to the starting position.","Once all of the recommended amount of repetitions have been performed for this arm, switch arms and perform the exercise with the right one."]},{id:"g-front-dumbbell-raise",name:"Front Dumbbell Raise",type:"isolation_upper",pattern:"isolation",primary:["front_delts"],secondary:[],equipment:["dumbbell"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Pick a couple of dumbbells and stand with a straight torso and the dumbbells on front of your thighs at arms length with the palms of the hand facing your thighs. This will be your starting position.","While maintaining the torso stationary (no swinging), lift the left dumbbell to the front with a slight bend on the elbow and the palms of the hands always facing down. Continue to go up until you arm is slightly above parallel to the floor. Exhale as you execute this portion of the movement and pause for a second at the top. Inhale after the second pause.","Now lower the dumbbell back down slowly to the starting position as you simultaneously lift the right dumbbell.","Continue alternating in this fashion until all of the recommended amount of repetitions have been performed for each arm."]},{id:"g-front-incline-dumbbell-raise",name:"Front Incline Dumbbell Raise",type:"isolation_upper",pattern:"isolation",primary:["front_delts"],secondary:[],equipment:["dumbbell","bench"],laterality:"bilateral",bw:0,metric:"weight_reps",steps:["Sit down on an incline bench with the incline set anywhere between 30 to 60 degrees while holding a dumbbell on each hand. Tip: You can change the angle to hit the muscle a little differently each time.","Extend your arms straight in front of you and have your palms facing down with the dumbbells raised about 1 inch above your thighs. This will be your starting position.","Slowly raise the dumbbells straight up until they are slightly above your shoulders, while keeping your elbows locked. Squeeze at the top for a second and make sure you breathe out during this portion of the movement. Tip: Keep your head resting down against the bench and your legs on the floor at all times.","Lower the arms back to the starting position as you inhale.","Repeat for the recommended amount of repetitions."]},{id:"g-front-raise-and-pullover",name:"Front Raise and Pullover",type:"compound_upper",pattern:"horizontal_push",p
